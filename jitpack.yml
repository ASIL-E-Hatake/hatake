# JitPack は git の tag からビルドして配る＝**レジストリに出さずに Java 版を配れる**道。
#
# このリポジトリはモノレポで、Java は `java/` の下に居る。JitPack は根を見に来るので、
# **どこをビルドするか**をここで教える（教えないと「Gradle プロジェクトが無い」で落ちる）。
#
# 試験は回さない（`-x test`）。中身が通ることは CI の担当で、ここは**配れる形になるか**
# だけを見る。両方やると、JitPack が落ちた理由が2つになって読めなくなる。
#
# 利用者側の書き方は docs/guide/release.ja.md。
jdk:
  - openjdk21
install:
  # 中身は java/jitpack-install.sh（`sh gradlew publishToMavenLocal -x test`）。
  # wrapper の jar を JitPack がときどき開けない（v0.9.26 / v0.9.28）ので、そのときは
  # 同じ版の Gradle を直接取ってきて組む逃げ道をそこに持たせた。
  # `./…` ではなく `sh …` で呼ぶのは、git に実行ビットが入っていないと `Permission denied`
  # で落ちるため（実際 v0.9.0 の JitPack がこれで落ちた。Windows で clone すると落ちる）。
  - sh java/jitpack-install.sh
