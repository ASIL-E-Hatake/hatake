<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" role="img" aria-label="定義から画面まで">
  <style>
    .bg { fill: #ffffff }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0f172a }
    .title { font-size: 19px; font-weight: 700 }
    .caption { font-size: 13px; fill: #64748b }
    .label { font-size: 15px; font-weight: 600 }
    .note { font-size: 13px; fill: #64748b }
    .body { font-size: 13px; fill: #334155 }
    .edge { font-size: 13px; fill: #475569 }
    .strong { font-weight: 700 }
    .good { fill: #15803d }
    .bad { fill: #b91c1c }
    .box { stroke-width: 1.5 }
    .core { fill: #f1f5f9; stroke: #475569 }
    .input { fill: #eff6ff; stroke: #2563eb }
    .output { fill: #f0fdf4; stroke: #16a34a }
    .outside { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 5 4 }
    .flow { stroke: #475569; stroke-width: 2 }
    .link { fill: none; stroke-width: 1.6 }
    .back { stroke: #94a3b8 }
    .tip { fill: #475569 }
    .tipBack { fill: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220 }
      text { fill: #e2e8f0 }
      .caption, .note { fill: #94a3b8 }
      .body { fill: #cbd5e1 }
      .edge { fill: #cbd5e1 }
      .good { fill: #4ade80 }
      .bad { fill: #f87171 }
      .core { fill: #172033; stroke: #94a3b8 }
      .input { fill: #172554; stroke: #60a5fa }
      .output { fill: #052e16; stroke: #4ade80 }
      .outside { fill: #2a2410; stroke: #facc15 }
      .flow { stroke: #cbd5e1 }
      .back { stroke: #64748b }
      .tip { fill: #cbd5e1 }
      .tipBack { fill: #64748b }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="tipBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tipBack" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="738"/>
  <text class="title" x="24" y="49">定義から画面まで</text>
  <text class="caption" x="24" y="68">hatake の中心は DSL と業務定義。Flutter は Renderer の1つで、交換できる。</text>
  <rect class="box input" x="24" y="82" width="852.0" height="126" rx="8"/>
  <text class="label" x="450.0" y="112" text-anchor="middle">定義（Definition）</text>
  <text class="note" x="450.0" y="131" text-anchor="middle">人と AI が書くのはここだけ</text>
  <text class="body body" x="38.0" y="156">・ YAML / JSON</text>
  <text class="body body" x="38.0" y="175">・ Dart のビルダー</text>
  <text class="body body" x="38.0" y="194">・ API から取った JSON</text>
  <line class="flow" x1="450" y1="222" x2="450" y2="256" marker-end="url(#tip)"/>
  <text class="edge" x="438" y="245" text-anchor="end">解析（strict：知らないキーは<tspan class="edge strong">黙って捨てず弾く</tspan>）</text>
  <rect class="box core" x="24" y="264" width="852.0" height="107" rx="8"/>
  <text class="label" x="450.0" y="294" text-anchor="middle">PageDefinition / AppDefinition</text>
  <text class="note" x="450.0" y="313" text-anchor="middle"><tspan class="note strong">唯一の正</tspan>（Single Source of Truth）</text>
  <text class="body body" x="38.0" y="338">・ 取得方法を知らない（YAML か API かは残らない）</text>
  <text class="body body" x="38.0" y="357">・ 3言語で同じ形（Dart / TypeScript / Java）</text>
  <line class="flow" x1="450" y1="385" x2="450" y2="419" marker-end="url(#tip)"/>
  <text class="edge" x="438" y="408" text-anchor="end">描画（定義を読んで Widget を組む）</text>
  <line class="flow back" x1="736" y1="419" x2="736" y2="385" marker-end="url(#tipBack)"/>
  <text class="edge back" x="746" y="408">入力・操作</text>
  <rect class="box core" x="24" y="427" width="418.0" height="126" rx="8"/>
  <text class="label" x="233.0" y="457" text-anchor="middle">Renderer</text>
  <text class="note" x="233.0" y="476" text-anchor="middle">Material / Fluent / 独自</text>
  <text class="body good" x="38.0" y="501">○ 定義を Widget にする</text>
  <text class="body bad" x="38.0" y="520">× 業務ロジックを持たない</text>
  <text class="body bad" x="38.0" y="539">× HTTP を呼ばない</text>
  <rect class="box outside" x="458" y="427" width="418.0" height="126" rx="8"/>
  <text class="label" x="667.0" y="457" text-anchor="middle">Registry（プラグイン）</text>
  <text class="note" x="667.0" y="476" text-anchor="middle">足すのはここ。本体は直さない</text>
  <text class="body body" x="472.0" y="501">・ 項目型・検証・整形</text>
  <text class="body body" x="472.0" y="520">・ アクション・集計</text>
  <line class="flow" x1="450" y1="567" x2="450" y2="601" marker-end="url(#tip)"/>
  <text class="edge" x="438" y="590" text-anchor="end">組み上がったもの</text>
  <rect class="box output" x="24" y="609" width="852.0" height="69" rx="8"/>
  <text class="label" x="450.0" y="639" text-anchor="middle">Flutter Widget</text>
  <text class="note" x="450.0" y="658" text-anchor="middle">実装技術。ここを手で書かないのが目的</text>
  <text class="caption" x="24" y="702">AI にも人にも入口は1つ。<tspan class="caption strong">Widget を書かせず、定義を書かせる</tspan>（足りなければ DSL かプラグインを足す）。</text>
</svg>
