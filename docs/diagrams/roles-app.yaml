# 権限を重ねた図の元になる小さなアプリ。
#
# この絵で見せたいのは、1枚ずつ読んでも出てこない3つ:
#   ・誰でも開けて、持ち出せる画面（受注照会に roles の無い CSV出力がある）
#   ・役割で絞った画面（マスタのグループが admin だけ）
#   ・**誰も開けない画面**（admin だけの画面から manager だけのボタンで繋いだので、
#     admin ∩ manager = 誰も居ない。定義としては通るし、画面を見ても気づけない）
#
# 最後のは `hatake validate` が警告（page-nobody-can-open）で言う。**わざと残してある**ので、
# 直さないでください（絵と警告の両方の見本になっている）。
#
# 絵は生成物。作り直しは:
#   npx hatake diagram docs/diagrams/roles-app.yaml --out docs/diagrams/roles-app-flow.svg
#   npx hatake diagram docs/diagrams/roles-app.yaml --role admin --out docs/diagrams/roles-app-admin.svg
dsl_version: "1.0"
app:
  id: sales_roles
  title: 受注（権限つき）
  home: orders
  menu:
    - { id: orders, label: 受注照会, icon: list, page: order_search }
    # グループの roles は中身にも掛かる（見えないグループの中の画面は開けない）。
    - group: マスタ
      roles: [admin]
      items:
        - { label: 顧客, icon: people, page: customer_master }
  pages:
    # 誰でも開ける画面。CSV出力に roles が無いので、誰でも持ち出せる。
    - type: search
      id: order_search
      title: 受注照会
      repository: orderRepository
      key: orderNo
      search:
        filters:
          - { field: orderNo, label: 受注番号 }
          - { field: customer, label: 顧客名, type: text, operator: contains }
      table:
        columns:
          - { field: orderNo, label: 受注番号, sortable: true, width: 160 }
          - { field: customer, label: 顧客, width: 200 }
          - { field: amount, label: 金額, type: number, format: currency, width: 140 }
      actions:
        - { id: detail, type: navigate, label: 詳細, page: order_detail, params: { id: "$row.orderNo" } }
        # 明細編集は manager だけ（扉に鍵が掛かっている）。
        - { id: edit, type: navigate, label: 明細編集, page: order_entry, roles: [manager], params: { id: "$row.orderNo" } }
        - { id: csv, type: export, label: CSV出力, config: { filename: 受注一覧 } }
    - type: detail
      id: order_detail
      title: 受注詳細
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - fields:
              - { field: orderNo, label: 受注番号 }
              - { field: customer, label: 顧客 }
    - type: form
      id: order_entry
      title: 受注入力
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - fields:
              - { field: orderNo, label: 受注番号, required: true }
              - { field: customer, label: 顧客, required: true }
    # admin だけのグループから開く画面。
    - type: master
      id: customer_master
      title: 顧客マスタ
      repository: customerRepository
      key: code
      table:
        columns:
          - { field: code, label: コード, sortable: true, width: 140 }
          - { field: name, label: 顧客名, width: 220 }
      actions:
        - { id: create, type: create, label: 新規登録 }
        # ここが罠。開けるのは admin だけの画面なのに、ボタンは manager だけ。
        # 単価マスタは誰も開けない（両方を持っている人が居ない）。
        - { id: openPrice, type: navigate, label: 単価, page: price_master, roles: [manager] }
    - type: master
      id: price_master
      title: 単価マスタ
      repository: priceRepository
      key: code
      table:
        columns:
          - { field: code, label: コード, sortable: true, width: 140 }
          - { field: price, label: 単価, type: number, format: currency, width: 140 }
      actions:
        - { id: create, type: create, label: 新規登録 }
