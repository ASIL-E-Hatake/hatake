<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" role="img" aria-label="販売管理（sales_admin）の画面と遷移">
  <style>
    .bg { fill: #ffffff }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0f172a }
    .title { font-size: 19px; font-weight: 700 }
    .caption { font-size: 13px; fill: #64748b }
    .label { font-size: 15px; font-weight: 600 }
    .note { font-size: 13px; fill: #64748b }
    .body { font-size: 13px; fill: #334155 }
    .edge { font-size: 13px; fill: #475569 }
    .strong { font-weight: 700 }
    .good { fill: #15803d }
    .bad { fill: #b91c1c }
    .box { stroke-width: 1.5 }
    .core { fill: #f1f5f9; stroke: #475569 }
    .input { fill: #eff6ff; stroke: #2563eb }
    .output { fill: #f0fdf4; stroke: #16a34a }
    .outside { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 5 4 }
    .flow { stroke: #475569; stroke-width: 2 }
    .link { fill: none; stroke-width: 1.6 }
    .back { stroke: #94a3b8 }
    .tip { fill: #475569 }
    .tipBack { fill: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220 }
      text { fill: #e2e8f0 }
      .caption, .note { fill: #94a3b8 }
      .body { fill: #cbd5e1 }
      .edge { fill: #cbd5e1 }
      .good { fill: #4ade80 }
      .bad { fill: #f87171 }
      .core { fill: #172033; stroke: #94a3b8 }
      .input { fill: #172554; stroke: #60a5fa }
      .output { fill: #052e16; stroke: #4ade80 }
      .outside { fill: #2a2410; stroke: #facc15 }
      .flow { stroke: #cbd5e1 }
      .back { stroke: #64748b }
      .tip { fill: #cbd5e1 }
      .tipBack { fill: #64748b }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="tipBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tipBack" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="670"/>
  <text class="title" x="24" y="49">販売管理（sales_admin）の画面と遷移</text>
  <text class="caption" x="24" y="68">段は「メニューから開ける画面 → そこから遷移で開く画面」。線は遷移の向き（札はボタン名）。</text>
  <text class="caption" x="24" y="96">メニューから開ける画面 7 枚 / 全部で 8 枚</text>
  <text class="caption" x="24" y="132">内訳: 数字とグラフ: 1 / マスタ保守: 2 / 照会（読み取り専用）: 1 / 帳票: 1 / 1件の照会: 1 / 1件の入力: 2</text>
  <rect class="box input" x="24" y="154" width="273.3" height="69" rx="8"/>
  <text class="label" x="160.7" y="184" text-anchor="middle">売上ダッシュボード</text>
  <text class="note" x="160.7" y="203" text-anchor="middle">sales_dashboard</text>
  <rect class="box input" x="313.3333333333333" y="154" width="273.3" height="69" rx="8"/>
  <text class="label" x="450.0" y="184" text-anchor="middle">顧客マスタ</text>
  <text class="note" x="450.0" y="203" text-anchor="middle">customer_master</text>
  <rect class="box input" x="602.6666666666666" y="154" width="273.3" height="69" rx="8"/>
  <text class="label" x="739.3" y="184" text-anchor="middle">商品マスタ</text>
  <text class="note" x="739.3" y="203" text-anchor="middle">product_master</text>
  <rect class="box input" x="24" y="233" width="273.3" height="69" rx="8"/>
  <text class="label" x="160.7" y="263" text-anchor="middle">売上明細表</text>
  <text class="note" x="160.7" y="282" text-anchor="middle">sales_report</text>
  <rect class="box input" x="313.3333333333333" y="233" width="273.3" height="69" rx="8"/>
  <text class="label" x="450.0" y="263" text-anchor="middle">受注入力</text>
  <text class="note" x="450.0" y="282" text-anchor="middle">order_entry</text>
  <rect class="box input" x="602.6666666666666" y="233" width="273.3" height="69" rx="8"/>
  <text class="label" x="739.3" y="263" text-anchor="middle">受注入力（明細別テーブル）</text>
  <text class="note" x="739.3" y="282" text-anchor="middle">order_entry_paged</text>
  <rect class="box input" x="24" y="312" width="273.3" height="69" rx="8"/>
  <text class="label" x="160.7" y="342" text-anchor="middle">受注照会</text>
  <text class="note" x="160.7" y="361" text-anchor="middle">order_search</text>
  <path class="flow link" d="M 160.7 391 V 411.0 H 160.7 V 433" marker-end="url(#tip)"/>
  <text class="edge" x="168.7" y="407.0">詳細</text>
  <rect class="box core" x="24" y="433" width="273.3" height="69" rx="8"/>
  <text class="label" x="160.7" y="463" text-anchor="middle">受注詳細</text>
  <text class="note" x="160.7" y="482" text-anchor="middle">order_detail</text>
  <text class="caption" x="24" y="526">線にできなかった遷移（同じ段の中・戻り・行が離れているもの）:</text>
  <text class="caption" x="24" y="562">  売上ダッシュボード → 受注照会（受注照会） / 受注照会 → 受注入力（明細編集）</text>
  <text class="caption" x="24" y="598">受注照会 → 受注入力（明細別テーブル）（明細（別テーブル））</text>
  <text class="caption" x="24" y="634">すべての画面がメニューか遷移からたどれる。</text>
</svg>
