name: Release

# tag を打ったら、**配る形**を作って GitHub Release に貼る。
#
# レジストリ（npm / pub.dev / Maven Central）には出さない。出すのは人が決めたときだけで、
# ここがやるのは「git の tag から入れられる状態にする」までにする＝**間違って publish
# される道を作らない**。
#
# 3版の配られ方はそれぞれ違う:
#   ・TypeScript … ここで固めた tarball を Release に貼る（`spec/` 同梱）
#   ・ブラウザ側（runtime / vue3 / react19）… 同じく tarball を貼る。**組む順番が要る**
#     （runtime は api の型を、Renderer は runtime の型を見る）
#   ・Flutter/Dart … tag をそのまま `git:` で指してもらう（作るものは無い）
#   ・Java … JitPack が tag を見てビルドする（作るものは無い。jitpack.yml が指図する）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手で回すときに貼り付ける tag（例: v0.9.0）"
        required: true

permissions:
  contents: write

jobs:
  tarball:
    name: tarball を作って貼る（TypeScript ＋ ブラウザ側）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 版が tag と揃っているか
        run: |
          set -e
          # tag と package.json がズレたまま配ると、入れた人が「どっちが本当か」を
          # 判断できなくなる。**貼る前**に落とす。配るもの全部を見る。
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for pkg in typescript web/runtime web/http web/vue3 web/react19; do
            HAVE="v$(node -p "require('./$pkg/package.json').version")"
            if [ "$TAG" != "$HAVE" ]; then
              echo "tag ($TAG) と $pkg ($HAVE) が違います"; exit 1
            fi
          done

      # **根で入れる。** ワークスペースの子（`typescript/`）の中で `npm install` すると、
      # **その子の分しか入らない**（`vue` も `@hatake-fw/runtime` の繋ぎも入らず、
      # ブラウザ側を固める所で "Cannot find module 'vue'" になる）。0.9.17 で実際に
      # これで落とした。
      - name: 入れる（ワークスペースごと）
        run: npm install

      - name: 固めて、入れて、叩く（TypeScript）
        working-directory: typescript
        run: |
          set -e
          # 配る形のまま動くことを見てから貼る（spec 同梱・bin の張り方・定義が通るか）。
          node tool/check-package.mjs
          # 見た形と同じものをもう一度作る（check-package は確かめたあと消す）。
          npm pack

      - name: 固める（ブラウザ側）
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # **組む順番が要る。** runtime は api の型を、Renderer は runtime の型を見る。
          # 固めるときは prepack が各パッケージを組み直すので、ここで組むのは
          # 「次のパッケージが型を見られるようにする」ため。
          npm run build --workspace @hatake-fw/api
          npm run build --workspace @hatake-fw/runtime
          for pkg in runtime http vue3 react19; do (cd "web/$pkg" && npm pack); done
          # 組み忘れたまま固めても npm は何も言わないので、中身を見てから貼る。
          node web/tool/check-tarballs.mjs "${TAG#v}"

      - name: Release に貼る
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            typescript/*.tgz
            web/runtime/*.tgz
            web/http/*.tgz
            web/vue3/*.tgz
            web/react19/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            入れ方は [リリースと入れ方](https://github.com/ASIL-E-Hatake/hatake/blob/main/docs/guide/release.ja.md) を見てください。

            - **TypeScript（サーバ側・道具）** … 下の `hatake-fw-api-*.tgz` を `npm i <URL>`
            - **ブラウザ側** … `runtime` ＋ `vue3` か `react19` を同じ番号で入れる
              （見た目は `@hatake-fw/runtime/hatake.css` を読み込む）
            - **Flutter / Dart** … この tag を `git:` で指す（`dependency_overrides` が要ります）
            - **Java** … JitPack がこの tag をビルドします

            レジストリ（npm / pub.dev / Maven Central）にはまだ出していません。
