name: Deploy demo

# Builds the hatake_example Flutter web app and publishes it to GitHub Pages.
# Assumes a project page at https://<user>.github.io/hatake/ — if the repository
# is named differently, change --base-href accordingly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build web
        working-directory: flutter/packages/hatake_example
        run: |
          flutter pub get
          flutter build web --release --base-href /hatake/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/packages/hatake_example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
