name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    name: Pure-Dart packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake_core hatake_yaml hatake_dsl; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && dart pub get && dart analyze && { if [ -d test ]; then dart test; fi; })
            echo "::endgroup::"
          done

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake hatake_material hatake_example; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && flutter pub get && flutter analyze && { if [ -d test ]; then flutter test; fi; })
            echo "::endgroup::"
          done

  typescript:
    name: TypeScript edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck & test (incl. conformance)
        working-directory: typescript
        run: |
          npm install
          npm run typecheck
          npm test
      - name: CLI smoke test (validate every shipped example)
        working-directory: typescript
        run: |
          npm run build
          node dist/cli.js validate ../spec/examples/*.yaml
      - name: Reference & example catalog are reachable from a real run
        working-directory: typescript
        run: |
          set -e
          # spec/ を実行時に探す経路（--spec 無し）はテストでは通らないので、ここで。
          node dist/cli.js reference rowsPerPage
          node dist/cli.js reference --page-kind report --out /tmp/report-reference.json
          node dist/cli.js examples 帳票
          node dist/cli.js pitfalls groupBy
          node dist/cli.js pitfalls groupBy --lang en
          # コミットしてある生成物と一致すること（vitest でも見ているが、CLI 経由でも）。
          node dist/cli.js reference --out /tmp/reference.json
          # --strip-trailing-cr: Windows のチェックアウトでも同じ判定にするため。
          diff -u --strip-trailing-cr ../spec/reference.json /tmp/reference.json

      - name: MCP server answers a stdio handshake
        working-directory: typescript
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hatake_validate","arguments":{"source":"page: {type: crud, id: x, title: X, repository: xRepository}"}}}' \
            | node dist/mcp.js > /tmp/mcp.log
          # 通知には返事をしない = 4 送って 3 行。stdout に他のものを書いていないことも見る。
          test "$(wc -l < /tmp/mcp.log)" -eq 3
          grep -q '"protocolVersion":"2025-06-18"' /tmp/mcp.log
          grep -q 'hatake_reference' /tmp/mcp.log
          grep -q 'crud' /tmp/mcp.log

      - name: Scaffolds are valid definitions
        working-directory: typescript
        run: |
          set -e
          mkdir -p /tmp/scaffold
          for kind in crud search master detail form wizard dashboard report; do
            node dist/cli.js new "$kind" --id "demo_$kind" --title デモ \
              --out "/tmp/scaffold/$kind.yaml"
          done
          node dist/cli.js validate /tmp/scaffold/*.yaml
      - name: Scaffolds pass the JSON Schema too
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml
          python spec/tools/validate_schema.py /tmp/scaffold/*.yaml

  java:
    name: Java edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (incl. conformance)
        working-directory: java
        run: gradle test

  schema:
    name: DSL schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example definitions against the schema
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml openapi-spec-validator
          python spec/tools/validate_schema.py
      - name: Check the DTO emitter's JSON Schema output
        run: python spec/tools/check_dto_schema.py
      - name: Check the DTO emitter's OpenAPI output
        run: python spec/tools/check_openapi.py

  publish-dry-run:
    name: pub publish (dry run)
    runs-on: ubuntu-latest
    needs: [dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Only the dependency-free leaf can dry-run before the others are on
      # pub.dev; downstream packages resolve their hosted constraints only
      # after hatake_core is published.
      - name: hatake_core publish dry-run
        run: cd flutter/packages/hatake_core && dart pub get && dart pub publish --dry-run
