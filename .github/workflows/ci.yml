name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    name: Pure-Dart packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake_core hatake_yaml hatake_dsl hatake_encoding hatake_print hatake_http; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && dart pub get && dart analyze && { if [ -d test ]; then dart test; fi; })
            echo "::endgroup::"
          done

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake hatake_material hatake_example; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && flutter pub get && flutter analyze && { if [ -d test ]; then flutter test; fi; })
            echo "::endgroup::"
          done

  typescript:
    name: TypeScript edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck & test (incl. conformance)
        working-directory: typescript
        run: |
          npm install
          npm run typecheck
          npm test
      - name: CLI smoke test (validate every shipped example)
        working-directory: typescript
        run: |
          npm run build
          # --warn-as-error: 同梱の例は「通る」だけでなく「意図どおり動く」形であること。
          node dist/cli.js validate --warn-as-error ../spec/examples/*.yaml
          # デモは隣に hatake-registry.json があるので、画面の外との辻褄（Repository /
          # プラグイン名が登録済みか）もここで見ている＝名前がズレたら CI が落ちる。
          # 1枚ずつではなく assets/*.yaml を全部見る。以前 sales_app.yaml だけを見て
          # いたので、隣の customer_master.yaml に未登録のプラグイン（押しても何も
          # 起きないボタン）が入ったまま気づけなかった。配るものは全部通す。
          node dist/cli.js validate --warn-as-error \
            ../flutter/packages/hatake_example/assets/*.yaml
      - name: Reference & example catalog are reachable from a real run
        working-directory: typescript
        run: |
          set -e
          # spec/ を実行時に探す経路（--spec 無し）はテストでは通らないので、ここで。
          node dist/cli.js reference rowsPerPage
          node dist/cli.js reference --page-kind report --out /tmp/report-reference.json
          node dist/cli.js examples 帳票
          node dist/cli.js pitfalls groupBy
          node dist/cli.js pitfalls groupBy --lang en
          # 定義を人の言葉に開く／実際に転んだ実例を引く（spec/ を実行時に探す経路）。
          node dist/cli.js explain ../spec/examples/sales_report.yaml
          node dist/cli.js explain ../spec/examples/sales_app.yaml --page order_search
          # 1行の要約（README や PR 本文に貼る形）。app なら画面一覧の表。
          node dist/cli.js explain ../spec/examples/customer_form.yaml --brief
          node dist/cli.js explain ../spec/examples/sales_app.yaml --brief
          # 同じ定義どうしなら「見え方は変わりません」。終了コードは変えない道具。
          node dist/cli.js explain --diff ../spec/examples/sales_app.yaml ../spec/examples/sales_app.yaml
          node dist/cli.js failures unknown-repository
          # 実例カタログの収穫。**同梱の例からは候補が出ない**こと（配っている定義が
          # 汚れていない＝カタログに足すものが無い、が正しい状態）。
          node dist/cli.js harvest ../spec/examples --min 1 | tee /tmp/harvest.log
          grep -q '候補はありません' /tmp/harvest.log
          # 最小化。**同梱の例は最小化しても意味が変わらない**（モデルの一致は vitest でも
          # 見ているが、spec/ を実行時に探す経路でも通す）。短くした結果も警告ゼロで通ること。
          node dist/cli.js minimize ../spec/examples/customer_form.yaml > /tmp/min.yaml
          node dist/cli.js validate --warn-as-error /tmp/min.yaml
          # 2度目は落とすものが無い（＝1回で終わる）。
          node dist/cli.js minimize /tmp/min.yaml 2>&1 >/dev/null | tee /tmp/min2.log
          grep -q '落とせる指定はありません' /tmp/min2.log
          # 自動修復。綴り違い（キー名・行アクション）を入れた定義を直して、
          # **直したものが警告ゼロで通る**こと。
          cat > /tmp/typo.yaml <<'YAML'
          page:
            type: crud
            id: order_list
            title: 受注一覧
            repository: orderRepository
            key: orderNo
            table:
              rowActions: [edit, aprove]
              columns:
                - { field: orderNo, label: 受注番号, witdh: 140 }
            form:
              sections:
                - fields:
                    - { field: orderNo, label: 受注番号, required: true }
            actions:
              - { id: approve, type: plugin, plugin: approveOrder, label: 承認 }
          YAML
          # **綴り違いで**落ちていることを確かめる（「落ちれば何でもよい」にすると、
          # YAML が壊れていても「想定どおり」に見えてしまう）。
          if node dist/cli.js validate /tmp/typo.yaml 2>/tmp/typo.log; then
            echo "綴り違いを検出できていない"; exit 1
          fi
          grep -q 'witdh' /tmp/typo.log
          node dist/cli.js fix /tmp/typo.yaml > /tmp/fixed.yaml
          node dist/cli.js validate --warn-as-error /tmp/fixed.yaml
          # 同梱の例には直すものが無い（配っているものは健康）。
          node dist/cli.js fix ../spec/examples/sales_app.yaml 2>&1 >/dev/null | tee /tmp/nofix.log
          grep -q '直せるものはありませんでした' /tmp/nofix.log
          # 助言。**終了コードを変えない**のが決めごと（好みを強制しない）。
          node dist/cli.js advise ../spec/examples/sales_app.yaml
          node dist/cli.js advise ../spec/examples/customer_form.yaml
          # 定義が外に要求しているもの（アプリ側で登録が要るもの）が引けること。
          node dist/cli.js refs ../spec/examples/sales_app.yaml --needs-registration
          # 実装から作る「登録済みのもの」の一覧が、コミットしてあるものと一致すること
          # （デモの登録を変えたら再生成が要る＝一覧が古くならない）。
          node dist/cli.js registry ../flutter/packages/hatake_example/lib/main.dart --out /tmp/hatake-registry.json
          diff -u --strip-trailing-cr ../flutter/packages/hatake_example/assets/hatake-registry.json /tmp/hatake-registry.json
          # 同じ定義どうしの diff は「変わりません」で終了コード 0。
          node dist/cli.js diff ../spec/examples/sales_app.yaml ../spec/examples/sales_app.yaml --caution-as-error
          # コミットしてある生成物と一致すること（vitest でも見ているが、CLI 経由でも）。
          node dist/cli.js reference --out /tmp/reference.json
          # --strip-trailing-cr: Windows のチェックアウトでも同じ判定にするため。
          diff -u --strip-trailing-cr ../spec/reference.json /tmp/reference.json

      - name: Diagrams match their source
        run: |
          set -e
          # 図解は生成物。元データ（docs/diagrams/*.json）だけ直せば絵が付いてくる形にして
          # あるので、作り直して差分が出たら「絵が古い」ということ。
          for f in docs/diagrams/*.json; do
            node typescript/dist/cli.js diagram "$f" --out "${f%.json}.svg"
          done
          # 定義から作る図も生成物（資料とサイトに出しているので、古いままにしない）。
          node typescript/dist/cli.js diagram spec/examples/sales_app.yaml             --out docs/diagrams/sales-app-flow.svg
          # 権限を重ねた図（全体と、admin で通れる道だけ）。元は roles-app.yaml。
          node typescript/dist/cli.js diagram docs/diagrams/roles-app.yaml             --out docs/diagrams/roles-app-flow.svg
          node typescript/dist/cli.js diagram docs/diagrams/roles-app.yaml --role admin             --out docs/diagrams/roles-app-admin.svg
          # --ignore-cr-at-eol: Windows のチェックアウト（CRLF）で走らせても同じ判定にする。
          git diff --exit-code --ignore-cr-at-eol -- docs/diagrams

      - name: Diagram and index from real definitions
        working-directory: typescript
        run: |
          set -e
          # 定義から図を作る（app の遷移図）。描けることと、元データが出せること。
          node dist/cli.js diagram ../spec/examples/sales_app.yaml --out /tmp/app.svg
          node dist/cli.js diagram ../spec/examples/sales_app.yaml --json > /tmp/app.diagram.json
          # 出した元データを描き直せる（定義から作った図も手で直せる形になっている）。
          node dist/cli.js diagram /tmp/app.diagram.json --out /tmp/app2.svg
          diff -u /tmp/app.svg /tmp/app2.svg
          # 画面の索引。同梱の例11枚から18枚の画面が出る（app の中身も1枚ずつ数える）。
          # 同じ枚数を Dart 版・Java 版の試験でも見ている（エディションで答えが変わらない）。
          node dist/cli.js index ../spec/examples --by size | tee /tmp/index.log
          grep -q '画面 18 枚' /tmp/index.log
          node dist/cli.js index ../spec/examples --find "顧客 検索"
          # 定義から作った遷移図に、線が1本ずつ引かれていること（まとめ矢印に戻っていない）。
          grep -q 'class="flow link"' /tmp/app.svg
          # 線にできなかった遷移は文で挙げる（図から黙って消えない）。
          grep -q '線にできなかった遷移' /tmp/app.svg

      - name: Roles on the diagram
        working-directory: typescript
        run: |
          set -e
          # 権限は入口から辿るしかない（ページに roles は書けない）。1枚ずつ読んでも
          # 出ない2つ＝「誰でも開けて持ち出せる画面」と「誰も開けない画面」が出ること。
          node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --json > /tmp/roles.json
          grep -q '"warn"' /tmp/roles.json
          grep -q '誰も開けない' /tmp/roles.json
          grep -q 'admin だけ' /tmp/roles.json
          # 役割を渡すと「その役割で通れる道」の図になる。
          node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --role admin --json             > /tmp/roles-admin.json
          grep -q 'admin で通れる道' /tmp/roles-admin.json
          # 綴り違いは黙って通さない（通すと「全部開ける」に見える）。
          if node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --role admn               2> /tmp/roles-typo.log; then
            echo "知らない役割名を通してしまった"; exit 1
          fi
          grep -q '出てくるのは admin / manager' /tmp/roles-typo.log

      - name: Advice can be judged by an outside ruler
        working-directory: typescript
        run: |
          set -e
          # 助言は好みなので、物差しを外から渡せる。同梱の例の物差しがそのまま通ること。
          node dist/cli.js advise ../spec/examples/sales_app.yaml             --rules ../docs/guide/advise-rules.example.json > /tmp/advise.log
          grep -q '物差しは ../docs/guide/advise-rules.example.json を使いました' /tmp/advise.log
          # 切った規則は出ない（money-without-format を off にしてある）。
          if grep -q 'money-without-format' /tmp/advise.log; then
            echo "off にした規則が出ている"; exit 1
          fi
          # 案件の決めごとは出る（並べ替えの無い一覧が例の中にある）。
          grep -q 'team-sortable-column' /tmp/advise.log
          # 知らない規則名を書いた物差しは、黙って無視せずエラーにする。
          printf '%s' '{"off":["no-such-rule"]}' > /tmp/bad-rules.json
          if node dist/cli.js advise ../spec/examples/sales_app.yaml               --rules /tmp/bad-rules.json 2> /tmp/bad-rules.log; then
            echo "読めない物差しを通してしまった"; exit 1
          fi
          grep -q '規則名ではありません' /tmp/bad-rules.log
          # レビュー用の1枚（説明＋助言）。助言が出ても終了コードは 0。
          node dist/cli.js explain ../spec/examples/sales_app.yaml --review             --page order_search > /tmp/review.log
          grep -q '書き足したほうがいい所（助言）' /tmp/review.log
          grep -q 'この画面でできないこと' /tmp/review.log
          grep -q '警告ではありません' /tmp/review.log

      - name: Cross-field validation and the access warning
        working-directory: typescript
        run: |
          set -e
          # 項目間の検証（compare）は3エディションで同じ答えになること＝共有フィクスチャで
          # 見ている（各エディションの試験の中）。ここでは CLI から見える所を確かめる。
          # 書き間違いは黙って通る類なので、警告で言えていること。
          cat > /tmp/compare.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - { field: startDate, label: 開始日, type: date }
                    - field: endDate
                      label: 終了日
                      type: date
                      validators:
                        - { type: compare, operator: gte, field: startDte }
          YAML
          # 規則名は --json にしか出ない（人向けの出力は場所と直し方だけ）。
          node dist/cli.js validate /tmp/compare.yaml --json > /tmp/compare.json
          grep -q '"rule": "compare-unknown-field"' /tmp/compare.json
          # 近い名前を出していること（これが無いと直せない）。
          grep -q 'startDate の間違い' /tmp/compare.json
          # 正しく書けば警告ゼロ（--warn-as-error で通ること）。
          sed -i 's/startDte/startDate/' /tmp/compare.yaml
          node dist/cli.js validate --warn-as-error /tmp/compare.yaml
          # 説明は相手の**ラベル**で言う（項目名は出さない）。
          node dist/cli.js explain /tmp/compare.yaml | tee /tmp/compare-explain.log
          grep -q '開始日 以上' /tmp/compare-explain.log
          # 開ける人が居ない画面は警告で言う（同梱の見本に1件わざと入っている）。
          node dist/cli.js validate ../docs/diagrams/roles-app.yaml --json > /tmp/access.json
          grep -q '"rule": "page-nobody-can-open"' /tmp/access.json
          grep -q '入口の roles を見直して' /tmp/access.json
          # **書き忘れ**は警告にできない（書いていないので）。助言で勧めること。
          cat > /tmp/no-compare.yaml <<'YAML'
          page:
            type: form
            id: reservation
            title: 予約
            repository: reservationRepository
            form:
              sections:
                - fields:
                    - { field: startDate, label: 開始日, type: date, required: true }
                    - { field: endDate, label: 終了日, type: date, required: true }
            actions:
              - { id: save, type: create, label: 登録 }
          YAML
          node dist/cli.js advise /tmp/no-compare.yaml > /tmp/no-compare.log
          grep -q 'dates-without-compare' /tmp/no-compare.log
          grep -q '「終了日」は「開始日」より前の値でも保存できます' /tmp/no-compare.log
          # 助言は好みなので、終了コードは変えない。
          node dist/cli.js advise /tmp/no-compare.yaml > /dev/null

      - name: Who can open a screen, and PR-ready output
        working-directory: typescript
        run: |
          set -e
          # 「この画面を開けるのは誰か」は1枚だけ読んでも出ない値。図（diagram --roles）と
          # 警告（page-nobody-can-open）と説明が、同じ答えを言うこと。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml > /tmp/explain-roles.log
          grep -q '## 画面を開ける人' /tmp/explain-roles.log
          grep -q '単価マスタ（price_master） … 誰も開けない' /tmp/explain-roles.log
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --page price_master > /tmp/explain-one.log
          grep -q 'この画面を開ける人' /tmp/explain-one.log
          # どこから来られるかまで言う（入口が分からないと直せない）。
          grep -q '入口「単価」（customer_master から）' /tmp/explain-one.log
          # レビュー用の1枚にも乗る（レビューは紙1枚で読むので、図を開かせない）。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --review --page price_master \
            | grep -q '誰も開けない'
          # PR 本文の形。見出しと箇条書きで出て、`<file>` が HTML に食われないこと。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --markdown > /tmp/explain.md
          grep -q '^## ' /tmp/explain.md
          grep -q '^### 画面を開ける人' /tmp/explain.md
          grep -q 'hatake explain &lt;file&gt;' /tmp/explain.md
          if grep -q '<file>' /tmp/explain.md; then
            echo "HTML に食われる書き方が残っている"; exit 1
          fi
          # 形は1つだけ選ぶ（貼った先で形が違う、という気づきにくい事故を作らない）。
          if node dist/cli.js explain ../docs/diagrams/roles-app.yaml --json --markdown 2> /tmp/both.log; then
            echo "--json と --markdown の同時指定を通してしまった"; exit 1
          fi
          grep -q '同時に使えません' /tmp/both.log
          # 変更前は git から取れる（HEAD と作業中を比べるので、浅いクローンでも動く）。
          cp ../docs/diagrams/roles-app.yaml /tmp/roles-backup.yaml
          node dist/cli.js explain --diff --git HEAD ../docs/diagrams/roles-app.yaml > /tmp/git-same.log
          grep -q '見え方は変わりません' /tmp/git-same.log
          # 入口の roles を1つ直すと、**遠くの画面**の「開ける人」が変わったと言うこと。
          sed -i 's/roles: \[manager\]/roles: [admin]/g' ../docs/diagrams/roles-app.yaml
          node dist/cli.js explain --diff --git HEAD ../docs/diagrams/roles-app.yaml --markdown > /tmp/git-diff.md
          grep -q '単価マスタ' /tmp/git-diff.md
          grep -q 'admin だけ' /tmp/git-diff.md
          # 後方互換の判定も同じ書き方で、表にできる。
          node dist/cli.js diff --git HEAD ../docs/diagrams/roles-app.yaml --markdown > /tmp/git-api.md || true
          grep -q '| 影響 | 区分 | 場所 | 内容 |' /tmp/git-api.md
          cp /tmp/roles-backup.yaml ../docs/diagrams/roles-app.yaml
          # 触った見本を1バイト単位で元に戻せていること（後の段が同じファイルを見る）。
          # git diff では見ない（改行の扱いが環境で違うので、ここでは byte で比べる）。
          cmp /tmp/roles-backup.yaml ../docs/diagrams/roles-app.yaml

      - name: Say what nobody said (unused registrations, leftovers, paper)
        working-directory: typescript
        run: |
          set -e
          # (a) 逆向きの突き合わせ。同梱のデモは登録が全部使われていること。
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --unused --registry ../flutter/packages/hatake_example/assets/hatake-registry.json \
            > /tmp/unused.log
          grep -q '登録はすべて使われています' /tmp/unused.log
          # 消し忘れを1つ混ぜたら、それだけを出すこと。
          node -e "
            const fs = require('fs');
            const p = '../flutter/packages/hatake_example/assets/hatake-registry.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            (d.repositories = d.repositories || []).push('oldStockRepository');
            fs.writeFileSync('/tmp/reg.json', JSON.stringify(d));
          "
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --unused --registry /tmp/reg.json > /tmp/unused2.log
          grep -q 'oldStockRepository' /tmp/unused2.log
          # 全部渡していないと嘘になる、を必ず書く（この道具で一番やりがちな読み違え）。
          grep -q '定義を全部渡していないと嘘になります' /tmp/unused2.log

          # (b) 機械が直せなかった分を「次の1往復で渡す形」にする。
          cat > /tmp/mixed.yaml <<'YAML'
          app:
            id: sales
            title: 受注
            pages:
              - type: crud
                id: order_list
                title: 受注一覧
                repository: orderRepository
                key: orderNo
                table:
                  columns: [{ field: orderNo, label: 受注番号, witdh: 140 }]
                form:
                  sections:
                    - fields: [{ field: orderNo, label: 受注番号, required: true }]
                actions:
                  - { id: open, type: navigate, label: 明細, page: order_datail }
          YAML
          node dist/cli.js fix /tmp/mixed.yaml --todo > /tmp/todo.log || true
          # 直した分は「もう見なくていい」と言い、残りは場所つきで出す。
          grep -q '件を直しました' /tmp/todo.log
          grep -q 'app.pages\[0\].actions\[0\].page \[unknown-page\]' /tmp/todo.log
          # 手掛かりは実例カタログから引く（規則名 → こう直した）。
          grep -q '実例: hatake failures' /tmp/todo.log
          # 触ってよい範囲を必ず書く（言わないと、直した所を戻される）。
          grep -q 'ほかの所は触らないこと' /tmp/todo.log
          # 直した分は残りに入っていないこと。
          if grep -q 'witdh' /tmp/todo.log; then
            echo "直した分を渡している"; exit 1
          fi

          # (c) 紙に入らない帳票を、刷る前に言う。
          cat > /tmp/wide.yaml <<'YAML'
          page:
            type: report
            id: sales_report
            title: 売上明細表
            repository: orderRepository
            table:
              columns:
                - { field: orderNo, label: 受注番号, width: 200 }
                - { field: customer, label: 顧客, width: 200 }
                - { field: amount, label: 金額, type: number, width: 200 }
            report:
              rowsPerPage: 120
          YAML
          node dist/cli.js validate /tmp/wide.yaml --json > /tmp/paper.json
          grep -q '"rule": "columns-wider-than-paper"' /tmp/paper.json
          grep -q '"rule": "rows-per-page-too-many"' /tmp/paper.json
          # 数を出していること（どれだけ減らせばいいか分からないと直せない）。
          grep -q '595.28pt' /tmp/paper.json
          grep -q '7.02pt' /tmp/paper.json
          # 同梱の帳票の例は、当然どちらも言われないこと（誤検出しない）。
          node dist/cli.js validate --warn-as-error ../spec/examples/sales_report.yaml

      - name: Show the paper (a report as text, for a human or an AI)
        working-directory: typescript
        run: |
          set -e
          # 刷るのは Dart 版。TS 版は同じ座標を組んで**文字で見せる**（AI は紙を見られない）。
          # 行を渡さなくても見えること（見本の行を作る）と、そう書くこと。
          node dist/cli.js paper ../spec/examples/sales_report.yaml --columns 100 \
            > /tmp/paper.log 2> /tmp/paper.err
          grep -q '595.28 x 841.89pt の紙' /tmp/paper.log
          # 同梱の例は得意先ごとに改ページするので、紙は複数枚になる。
          grep -q -- '--- 2 枚目 ---' /tmp/paper.log
          grep -q '顧客: ' /tmp/paper.log
          grep -q '小計' /tmp/paper.log
          grep -q '行は\*\*見本\*\*です' /tmp/paper.err
          # 右寄せの数は右端が揃うこと（揃っていなければ、揃っているかを読めない）。
          # 数えるのは**表示幅**（全角は2桁）。文字数で数えると、全角の数が違う行
          # （小計の「件」）だけズレて見える。
          node -e "
            const fs = require('fs');
            const half = (c) => {
              const x = c.codePointAt(0);
              return (x >= 0x20 && x <= 0x7e) || (x >= 0xff61 && x <= 0xffdc) ||
                (x >= 0xffe8 && x <= 0xffee);
            };
            const cells = (s) => [...s].reduce((n, c) => n + (half(c) ? 1 : 2), 0);
            const ends = fs.readFileSync('/tmp/paper.log', 'utf8').split('\n')
              .filter((line) => line.includes('¥'))
              .map((line) => cells(line.trimEnd()));
            const uniq = [...new Set(ends)];
            if (ends.length < 3 || uniq.length !== 1) {
              console.error('右端が揃っていない: ' + JSON.stringify(uniq));
              process.exit(1);
            }
          "
          # 本物の行を渡したときは、見本の注記を出さないこと。
          printf '%s' '[{"orderNo":"SO-1","orderDate":"2026-04-01","status":"出荷済","customer":"山田商事","amount":1234}]' > /tmp/rows.json
          node dist/cli.js paper ../spec/examples/sales_report.yaml --rows /tmp/rows.json \
            > /tmp/paper2.log 2> /tmp/paper2.err
          grep -q '¥1,234' /tmp/paper2.log
          if grep -q '見本' /tmp/paper2.err; then
            echo "渡した行なのに見本と言っている"; exit 1
          fi
          # 帳票でない定義には、そう言って落ちること。
          if node dist/cli.js paper ../spec/examples/customer_master.yaml 2> /tmp/paper3.err; then
            echo "帳票でない定義を通してしまった"; exit 1
          fi
          grep -q '帳票（type: report）の定義がありません' /tmp/paper3.err

      - name: Printing starts in the definition, not in application code
        working-directory: typescript
        run: |
          set -e
          # 同梱の帳票には印刷ボタンがある。アクションの型が通っていなければ
          # unknown-action-type で落ちる＝「定義から刷れる」ことがここで担保される。
          node dist/cli.js validate --warn-as-error ../spec/examples/sales_report.yaml
          # 説明は画面の言葉で読み上げる（語彙は spec/vocabulary.json が正）。
          node dist/cli.js explain ../spec/examples/sales_report.yaml > /tmp/print.log
          grep -q '印刷 … 紙に刷る' /tmp/print.log
          # 紙の無い画面に置いたら、**押す前に**言うこと（押すまで分からないのは遅い）。
          cat > /tmp/print-nowhere.yaml <<'YAML'
          page:
            type: crud
            id: order_list
            title: 受注一覧
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: printPdf, type: print, label: 印刷 }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/print-nowhere.yaml               2> /tmp/nowhere.log; then
            echo "紙の無い画面の印刷ボタンを通してしまった"; exit 1
          fi
          grep -q 'この画面には report がありません' /tmp/nowhere.log
          node dist/cli.js validate --json /tmp/print-nowhere.yaml > /tmp/nowhere.json
          grep -q '"rule": "print-without-report"' /tmp/nowhere.json
          # 警告から対照表（間違い → 正しい書き方）へ繋がること。
          node dist/cli.js pitfalls print-without-report > /tmp/pitfall.log
          grep -q 'type: report' /tmp/pitfall.log
          # 紙も持ち出しの口として数えること（権限で絞っていなければ助言が出る）。
          node dist/cli.js advise /tmp/print-nowhere.yaml > /tmp/print-advise.log
          grep -q '紙で持ち出せます' /tmp/print-advise.log

      - name: What the definition needs from the application (including sinks)
        working-directory: typescript
        run: |
          set -e
          # 定義が外に要求しているもの。Repository とプラグインだけでなく、
          # **出す口**（CSV は exportSink、印刷は printSink）も出ること。ここが
          # 抜けていると「ボタンは出るのに押すと未登録です」を空のリポジトリから
          # 始める人が踏む。
          node dist/cli.js refs ../spec/examples/sales_report.yaml             --needs-registration > /tmp/needs.log
          grep -q 'exportSink' /tmp/needs.log
          grep -q 'printSink' /tmp/needs.log
          # 口が繋がっていなければ、押す前に言う（登録済み一覧との突き合わせ）。
          printf '%s' '{"repositories":["orderRepository"],"sinks":["exportSink"]}'             > /tmp/half-wired.json
          node dist/cli.js validate ../spec/examples/sales_report.yaml             --registry /tmp/half-wired.json --json > /tmp/half-wired-out.json
          grep -q '"rule": "unregistered-sink"' /tmp/half-wired-out.json
          grep -q 'printSink' /tmp/half-wired-out.json
          if grep -q '"exportSink"' /tmp/half-wired-out.json; then
            echo "登録済みの口まで未登録と言っている"; exit 1
          fi

      - name: A definition compared with itself is compatible
        working-directory: typescript
        run: |
          set -e
          # diff の判定が壊れていれば、同じ定義同士でも差分が出る。
          for f in ../spec/examples/customer_master.yaml ../spec/examples/order_entry.yaml; do
            node dist/cli.js diff "$f" "$f"
          done

      - name: MCP server answers a stdio handshake
        working-directory: typescript
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hatake_validate","arguments":{"source":"page: {type: crud, id: x, title: X, repository: xRepository}"}}}' \
            | node dist/mcp.js > /tmp/mcp.log
          # 通知には返事をしない = 4 送って 3 行。stdout に他のものを書いていないことも見る。
          test "$(wc -l < /tmp/mcp.log)" -eq 3
          grep -q '"protocolVersion":"2025-06-18"' /tmp/mcp.log
          grep -q 'hatake_reference' /tmp/mcp.log
          grep -q 'crud' /tmp/mcp.log

      - name: Scaffolds are valid definitions
        working-directory: typescript
        run: |
          set -e
          mkdir -p /tmp/scaffold
          for kind in crud search master detail form wizard dashboard report; do
            node dist/cli.js new "$kind" --id "demo_$kind" --title デモ \
              --out "/tmp/scaffold/$kind.yaml"
          done
          node dist/cli.js validate /tmp/scaffold/*.yaml
      - name: Scaffolds pass the JSON Schema too
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml
          python spec/tools/validate_schema.py /tmp/scaffold/*.yaml

  java:
    name: Java edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (incl. conformance)
        working-directory: java
        run: gradle test

  schema:
    name: DSL schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example definitions against the schema
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml openapi-spec-validator
          python spec/tools/validate_schema.py
          # 資料の絵の元になっている定義も、スキーマで見る（絵だけ通って定義が腐るのを防ぐ）。
          python spec/tools/validate_schema.py docs/diagrams/roles-app.yaml
      - name: Charset tables are up to date
        run: |
          set -e
          # 生成物（変換表とフィクスチャ）が、生成器と同じ内容であること。
          python flutter/packages/hatake_encoding/tool/generate_tables.py
          git diff --exit-code -- flutter/packages/hatake_encoding/lib/src/tables \
            spec/conformance/charset.json

      - name: The sample report PDF is a PDF (read by another library)
        run: |
          pip install --quiet pypdf
          # hatake_print は PDF を自分で書いている。自前のテストは「自分と自分が
          # 合っている」ことしか言えないので、他人の実装で読み返す。
          python spec/tools/check_report_pdf.py

      - name: Check the DTO emitter's JSON Schema output
        run: python spec/tools/check_dto_schema.py
      - name: Check the DTO emitter's OpenAPI output
        run: python spec/tools/check_openapi.py

  publish-dry-run:
    name: pub publish (dry run)
    runs-on: ubuntu-latest
    needs: [dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Only the dependency-free leaf can dry-run before the others are on
      # pub.dev; downstream packages resolve their hosted constraints only
      # after hatake_core is published.
      - name: hatake_core publish dry-run
        run: cd flutter/packages/hatake_core && dart pub get && dart pub publish --dry-run
