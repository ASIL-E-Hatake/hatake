name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    name: Pure-Dart packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake_core hatake_yaml hatake_dsl hatake_encoding hatake_print hatake_http; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && dart pub get && dart analyze && { if [ -d test ]; then dart test; fi; })
            echo "::endgroup::"
          done

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze & test
        run: |
          set -e
          for pkg in hatake hatake_material hatake_example; do
            echo "::group::$pkg"
            (cd "flutter/packages/$pkg" && flutter pub get && flutter analyze && { if [ -d test ]; then flutter test; fi; })
            echo "::endgroup::"
          done

  typescript:
    name: TypeScript edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck & test (incl. conformance)
        working-directory: typescript
        run: |
          npm install
          npm run typecheck
          npm test
      - name: CLI smoke test (validate every shipped example)
        working-directory: typescript
        run: |
          npm run build
          # --warn-as-error: 同梱の例は「通る」だけでなく「意図どおり動く」形であること。
          node dist/cli.js validate --warn-as-error ../spec/examples/*.yaml
          # デモは隣に hatake-registry.json があるので、画面の外との辻褄（Repository /
          # プラグイン名が登録済みか）もここで見ている＝名前がズレたら CI が落ちる。
          # 1枚ずつではなく assets/*.yaml を全部見る。以前 sales_app.yaml だけを見て
          # いたので、隣の customer_master.yaml に未登録のプラグイン（押しても何も
          # 起きないボタン）が入ったまま気づけなかった。配るものは全部通す。
          node dist/cli.js validate --warn-as-error \
            ../flutter/packages/hatake_example/assets/*.yaml
      - name: Reference & example catalog are reachable from a real run
        working-directory: typescript
        run: |
          set -e
          # spec/ を実行時に探す経路（--spec 無し）はテストでは通らないので、ここで。
          node dist/cli.js reference rowsPerPage
          node dist/cli.js reference --page-kind report --out /tmp/report-reference.json
          node dist/cli.js examples 帳票
          node dist/cli.js pitfalls groupBy
          node dist/cli.js pitfalls groupBy --lang en
          # 定義を人の言葉に開く／実際に転んだ実例を引く（spec/ を実行時に探す経路）。
          node dist/cli.js explain ../spec/examples/sales_report.yaml
          node dist/cli.js explain ../spec/examples/sales_app.yaml --page order_search
          # 1行の要約（README や PR 本文に貼る形）。app なら画面一覧の表。
          node dist/cli.js explain ../spec/examples/customer_form.yaml --brief
          node dist/cli.js explain ../spec/examples/sales_app.yaml --brief
          # 同じ定義どうしなら「見え方は変わりません」。終了コードは変えない道具。
          node dist/cli.js explain --diff ../spec/examples/sales_app.yaml ../spec/examples/sales_app.yaml
          node dist/cli.js failures unknown-repository
          # 実例カタログの収穫。**同梱の例からは候補が出ない**こと（配っている定義が
          # 汚れていない＝カタログに足すものが無い、が正しい状態）。
          node dist/cli.js harvest ../spec/examples --min 1 | tee /tmp/harvest.log
          grep -q '候補はありません' /tmp/harvest.log
          # 最小化。**同梱の例は最小化しても意味が変わらない**（モデルの一致は vitest でも
          # 見ているが、spec/ を実行時に探す経路でも通す）。短くした結果も警告ゼロで通ること。
          node dist/cli.js minimize ../spec/examples/customer_form.yaml > /tmp/min.yaml
          node dist/cli.js validate --warn-as-error /tmp/min.yaml
          # 2度目は落とすものが無い（＝1回で終わる）。
          node dist/cli.js minimize /tmp/min.yaml 2>&1 >/dev/null | tee /tmp/min2.log
          grep -q '落とせる指定はありません' /tmp/min2.log
          # 自動修復。綴り違い（キー名・行アクション）を入れた定義を直して、
          # **直したものが警告ゼロで通る**こと。
          cat > /tmp/typo.yaml <<'YAML'
          page:
            type: crud
            id: order_list
            title: 受注一覧
            repository: orderRepository
            key: orderNo
            table:
              rowActions: [edit, aprove]
              columns:
                - { field: orderNo, label: 受注番号, witdh: 140 }
            form:
              sections:
                - fields:
                    - { field: orderNo, label: 受注番号, required: true }
            actions:
              - { id: approve, type: plugin, plugin: approveOrder, label: 承認 }
          YAML
          # **綴り違いで**落ちていることを確かめる（「落ちれば何でもよい」にすると、
          # YAML が壊れていても「想定どおり」に見えてしまう）。
          if node dist/cli.js validate /tmp/typo.yaml 2>/tmp/typo.log; then
            echo "綴り違いを検出できていない"; exit 1
          fi
          grep -q 'witdh' /tmp/typo.log
          node dist/cli.js fix /tmp/typo.yaml > /tmp/fixed.yaml
          node dist/cli.js validate --warn-as-error /tmp/fixed.yaml
          # 同梱の例には直すものが無い（配っているものは健康）。
          node dist/cli.js fix ../spec/examples/sales_app.yaml 2>&1 >/dev/null | tee /tmp/nofix.log
          grep -q '直せるものはありませんでした' /tmp/nofix.log
          # 助言。**終了コードを変えない**のが決めごと（好みを強制しない）。
          node dist/cli.js advise ../spec/examples/sales_app.yaml
          node dist/cli.js advise ../spec/examples/customer_form.yaml
          # 定義が外に要求しているもの（アプリ側で登録が要るもの）が引けること。
          node dist/cli.js refs ../spec/examples/sales_app.yaml --needs-registration
          # 実装から作る「登録済みのもの」の一覧が、コミットしてあるものと一致すること
          # （デモの登録を変えたら再生成が要る＝一覧が古くならない）。
          # **/tmp に直接置かない。** `hatake-registry.json` は「定義の隣に在れば黙って
          # 拾う」ものなので、/tmp に置くと後のステップが /tmp に書いた定義を検証する
          # ときに**この一覧を勝手に使う**（役割名が違えば警告が出て、そのステップが
          # 落ちる）。この確認のための一覧は、この確認だけの場所に置く。
          mkdir -p /tmp/regcheck
          node dist/cli.js registry ../flutter/packages/hatake_example/lib/main.dart             --out /tmp/regcheck/hatake-registry.json
          diff -u --strip-trailing-cr ../flutter/packages/hatake_example/assets/hatake-registry.json /tmp/regcheck/hatake-registry.json
          # 同じ定義どうしの diff は「変わりません」で終了コード 0。
          node dist/cli.js diff ../spec/examples/sales_app.yaml ../spec/examples/sales_app.yaml --caution-as-error
          # コミットしてある生成物と一致すること（vitest でも見ているが、CLI 経由でも）。
          node dist/cli.js reference --out /tmp/reference.json
          # --strip-trailing-cr: Windows のチェックアウトでも同じ判定にするため。
          diff -u --strip-trailing-cr ../spec/reference.json /tmp/reference.json

      - name: Diagrams match their source
        run: |
          set -e
          # 図解は生成物。元データ（docs/diagrams/*.json）だけ直せば絵が付いてくる形にして
          # あるので、作り直して差分が出たら「絵が古い」ということ。
          for f in docs/diagrams/*.json; do
            node typescript/dist/cli.js diagram "$f" --out "${f%.json}.svg"
          done
          # 定義から作る図も生成物（資料とサイトに出しているので、古いままにしない）。
          node typescript/dist/cli.js diagram spec/examples/sales_app.yaml             --out docs/diagrams/sales-app-flow.svg
          # 権限を重ねた図（全体と、admin で通れる道だけ）。元は roles-app.yaml。
          node typescript/dist/cli.js diagram docs/diagrams/roles-app.yaml             --out docs/diagrams/roles-app-flow.svg
          node typescript/dist/cli.js diagram docs/diagrams/roles-app.yaml --role admin             --out docs/diagrams/roles-app-admin.svg
          # --ignore-cr-at-eol: Windows のチェックアウト（CRLF）で走らせても同じ判定にする。
          git diff --exit-code --ignore-cr-at-eol -- docs/diagrams

      - name: Diagram and index from real definitions
        working-directory: typescript
        run: |
          set -e
          # 定義から図を作る（app の遷移図）。描けることと、元データが出せること。
          node dist/cli.js diagram ../spec/examples/sales_app.yaml --out /tmp/app.svg
          node dist/cli.js diagram ../spec/examples/sales_app.yaml --json > /tmp/app.diagram.json
          # 出した元データを描き直せる（定義から作った図も手で直せる形になっている）。
          node dist/cli.js diagram /tmp/app.diagram.json --out /tmp/app2.svg
          diff -u /tmp/app.svg /tmp/app2.svg
          # 画面の索引。同梱の例11枚から18枚の画面が出る（app の中身も1枚ずつ数える）。
          # 同じ枚数を Dart 版・Java 版の試験でも見ている（エディションで答えが変わらない）。
          node dist/cli.js index ../spec/examples --by size | tee /tmp/index.log
          grep -q '画面 22 枚' /tmp/index.log
          node dist/cli.js index ../spec/examples --find "顧客 検索"
          # 定義から作った遷移図に、線が1本ずつ引かれていること（まとめ矢印に戻っていない）。
          grep -q 'class="flow link"' /tmp/app.svg
          # 線にできなかった遷移は文で挙げる（図から黙って消えない）。
          grep -q '線にできなかった遷移' /tmp/app.svg

      - name: Roles on the diagram
        working-directory: typescript
        run: |
          set -e
          # 権限は入口から辿るしかない（ページに roles は書けない）。1枚ずつ読んでも
          # 出ない2つ＝「誰でも開けて持ち出せる画面」と「誰も開けない画面」が出ること。
          node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --json > /tmp/roles.json
          grep -q '"warn"' /tmp/roles.json
          grep -q '誰も開けない' /tmp/roles.json
          grep -q 'admin だけ' /tmp/roles.json
          # 役割を渡すと「その役割で通れる道」の図になる。
          node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --role admin --json             > /tmp/roles-admin.json
          grep -q 'admin で通れる道' /tmp/roles-admin.json
          # 綴り違いは黙って通さない（通すと「全部開ける」に見える）。
          if node dist/cli.js diagram ../docs/diagrams/roles-app.yaml --role admn               2> /tmp/roles-typo.log; then
            echo "知らない役割名を通してしまった"; exit 1
          fi
          grep -q '出てくるのは admin / manager' /tmp/roles-typo.log

      - name: Advice can be judged by an outside ruler
        working-directory: typescript
        run: |
          set -e
          # 助言は好みなので、物差しを外から渡せる。同梱の例の物差しがそのまま通ること。
          node dist/cli.js advise ../spec/examples/sales_app.yaml             --rules ../docs/guide/advise-rules.example.json > /tmp/advise.log
          grep -q '物差しは ../docs/guide/advise-rules.example.json を使いました' /tmp/advise.log
          # 切った規則は出ない（money-without-format を off にしてある）。
          if grep -q 'money-without-format' /tmp/advise.log; then
            echo "off にした規則が出ている"; exit 1
          fi
          # 案件の決めごとは出る（並べ替えの無い一覧が例の中にある）。
          grep -q 'team-sortable-column' /tmp/advise.log
          # 知らない規則名を書いた物差しは、黙って無視せずエラーにする。
          printf '%s' '{"off":["no-such-rule"]}' > /tmp/bad-rules.json
          if node dist/cli.js advise ../spec/examples/sales_app.yaml               --rules /tmp/bad-rules.json 2> /tmp/bad-rules.log; then
            echo "読めない物差しを通してしまった"; exit 1
          fi
          grep -q '規則名ではありません' /tmp/bad-rules.log
          # レビュー用の1枚（説明＋助言）。助言が出ても終了コードは 0。
          node dist/cli.js explain ../spec/examples/sales_app.yaml --review             --page order_search > /tmp/review.log
          grep -q '書き足したほうがいい所（助言）' /tmp/review.log
          grep -q 'この画面でできないこと' /tmp/review.log
          grep -q '警告ではありません' /tmp/review.log

      - name: Cross-field validation and the access warning
        working-directory: typescript
        run: |
          set -e
          # 項目間の検証（compare）は3エディションで同じ答えになること＝共有フィクスチャで
          # 見ている（各エディションの試験の中）。ここでは CLI から見える所を確かめる。
          # 書き間違いは黙って通る類なので、警告で言えていること。
          cat > /tmp/compare.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - { field: startDate, label: 開始日, type: date }
                    - field: endDate
                      label: 終了日
                      type: date
                      validators:
                        - { type: compare, operator: gte, field: startDte }
          YAML
          # 規則名は --json にしか出ない（人向けの出力は場所と直し方だけ）。
          node dist/cli.js validate /tmp/compare.yaml --json > /tmp/compare.json
          grep -q '"rule": "compare-unknown-field"' /tmp/compare.json
          # 近い名前を出していること（これが無いと直せない）。
          grep -q 'startDate の間違い' /tmp/compare.json
          # 正しく書けば警告ゼロ（--warn-as-error で通ること）。
          sed -i 's/startDte/startDate/' /tmp/compare.yaml
          node dist/cli.js validate --warn-as-error /tmp/compare.yaml
          # 説明は相手の**ラベル**で言う（項目名は出さない）。
          node dist/cli.js explain /tmp/compare.yaml | tee /tmp/compare-explain.log
          grep -q '開始日 以上' /tmp/compare-explain.log
          # 開ける人が居ない画面は警告で言う（同梱の見本に1件わざと入っている）。
          node dist/cli.js validate ../docs/diagrams/roles-app.yaml --json > /tmp/access.json
          grep -q '"rule": "page-nobody-can-open"' /tmp/access.json
          grep -q '入口の roles を見直して' /tmp/access.json
          # **書き忘れ**は警告にできない（書いていないので）。助言で勧めること。
          cat > /tmp/no-compare.yaml <<'YAML'
          page:
            type: form
            id: reservation
            title: 予約
            repository: reservationRepository
            form:
              sections:
                - fields:
                    - { field: startDate, label: 開始日, type: date, required: true }
                    - { field: endDate, label: 終了日, type: date, required: true }
            actions:
              - { id: save, type: create, label: 登録 }
          YAML
          node dist/cli.js advise /tmp/no-compare.yaml > /tmp/no-compare.log
          grep -q 'dates-without-compare' /tmp/no-compare.log
          grep -q '「終了日」は「開始日」より前の値でも保存できます' /tmp/no-compare.log
          # 助言は好みなので、終了コードは変えない。
          node dist/cli.js advise /tmp/no-compare.yaml > /dev/null

      - name: Who can open a screen, and PR-ready output
        working-directory: typescript
        run: |
          set -e
          # 「この画面を開けるのは誰か」は1枚だけ読んでも出ない値。図（diagram --roles）と
          # 警告（page-nobody-can-open）と説明が、同じ答えを言うこと。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml > /tmp/explain-roles.log
          grep -q '## 画面を開ける人' /tmp/explain-roles.log
          grep -q '単価マスタ（price_master） … 誰も開けない' /tmp/explain-roles.log
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --page price_master > /tmp/explain-one.log
          grep -q 'この画面を開ける人' /tmp/explain-one.log
          # どこから来られるかまで言う（入口が分からないと直せない）。
          grep -q '入口「単価」（customer_master から）' /tmp/explain-one.log
          # レビュー用の1枚にも乗る（レビューは紙1枚で読むので、図を開かせない）。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --review --page price_master \
            | grep -q '誰も開けない'
          # PR 本文の形。見出しと箇条書きで出て、`<file>` が HTML に食われないこと。
          node dist/cli.js explain ../docs/diagrams/roles-app.yaml --markdown > /tmp/explain.md
          grep -q '^## ' /tmp/explain.md
          grep -q '^### 画面を開ける人' /tmp/explain.md
          grep -q 'hatake explain &lt;file&gt;' /tmp/explain.md
          if grep -q '<file>' /tmp/explain.md; then
            echo "HTML に食われる書き方が残っている"; exit 1
          fi
          # 形は1つだけ選ぶ（貼った先で形が違う、という気づきにくい事故を作らない）。
          if node dist/cli.js explain ../docs/diagrams/roles-app.yaml --json --markdown 2> /tmp/both.log; then
            echo "--json と --markdown の同時指定を通してしまった"; exit 1
          fi
          grep -q '同時に使えません' /tmp/both.log
          # 変更前は git から取れる（HEAD と作業中を比べるので、浅いクローンでも動く）。
          cp ../docs/diagrams/roles-app.yaml /tmp/roles-backup.yaml
          node dist/cli.js explain --diff --git HEAD ../docs/diagrams/roles-app.yaml > /tmp/git-same.log
          grep -q '見え方は変わりません' /tmp/git-same.log
          # 入口の roles を1つ直すと、**遠くの画面**の「開ける人」が変わったと言うこと。
          sed -i 's/roles: \[manager\]/roles: [admin]/g' ../docs/diagrams/roles-app.yaml
          node dist/cli.js explain --diff --git HEAD ../docs/diagrams/roles-app.yaml --markdown > /tmp/git-diff.md
          grep -q '単価マスタ' /tmp/git-diff.md
          grep -q 'admin だけ' /tmp/git-diff.md
          # 後方互換の判定も同じ書き方で、表にできる。
          node dist/cli.js diff --git HEAD ../docs/diagrams/roles-app.yaml --markdown > /tmp/git-api.md || true
          grep -q '| 影響 | 区分 | 場所 | 内容 |' /tmp/git-api.md
          cp /tmp/roles-backup.yaml ../docs/diagrams/roles-app.yaml
          # 触った見本を1バイト単位で元に戻せていること（後の段が同じファイルを見る）。
          # git diff では見ない（改行の扱いが環境で違うので、ここでは byte で比べる）。
          cmp /tmp/roles-backup.yaml ../docs/diagrams/roles-app.yaml

      - name: Say what nobody said (unused registrations, leftovers, paper)
        working-directory: typescript
        run: |
          set -e
          # (a) 逆向きの突き合わせ。同梱のデモは登録が全部使われていること。
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --unused --registry ../flutter/packages/hatake_example/assets/hatake-registry.json \
            > /tmp/unused.log
          grep -q '登録はすべて使われています' /tmp/unused.log
          # 消し忘れを1つ混ぜたら、それだけを出すこと。
          node -e "
            const fs = require('fs');
            const p = '../flutter/packages/hatake_example/assets/hatake-registry.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            (d.repositories = d.repositories || []).push('oldStockRepository');
            fs.writeFileSync('/tmp/reg.json', JSON.stringify(d));
          "
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --unused --registry /tmp/reg.json > /tmp/unused2.log
          grep -q 'oldStockRepository' /tmp/unused2.log
          # 全部渡していないと嘘になる、を必ず書く（この道具で一番やりがちな読み違え）。
          grep -q '定義を全部渡していないと嘘になります' /tmp/unused2.log

          # (b) 機械が直せなかった分を「次の1往復で渡す形」にする。
          cat > /tmp/mixed.yaml <<'YAML'
          app:
            id: sales
            title: 受注
            pages:
              - type: crud
                id: order_list
                title: 受注一覧
                repository: orderRepository
                key: orderNo
                table:
                  columns: [{ field: orderNo, label: 受注番号, witdh: 140 }]
                form:
                  sections:
                    - fields: [{ field: orderNo, label: 受注番号, required: true }]
                actions:
                  - { id: open, type: navigate, label: 明細, page: order_datail }
          YAML
          node dist/cli.js fix /tmp/mixed.yaml --todo > /tmp/todo.log || true
          # 直した分は「もう見なくていい」と言い、残りは場所つきで出す。
          grep -q '件を直しました' /tmp/todo.log
          grep -q 'app.pages\[0\].actions\[0\].page \[unknown-page\]' /tmp/todo.log
          # 手掛かりは実例カタログから引く（規則名 → こう直した）。
          grep -q '実例: hatake failures' /tmp/todo.log
          # 触ってよい範囲を必ず書く（言わないと、直した所を戻される）。
          grep -q 'ほかの所は触らないこと' /tmp/todo.log
          # 直した分は残りに入っていないこと。
          if grep -q 'witdh' /tmp/todo.log; then
            echo "直した分を渡している"; exit 1
          fi

          # (c) 紙に入らない帳票を、刷る前に言う。
          cat > /tmp/wide.yaml <<'YAML'
          page:
            type: report
            id: sales_report
            title: 売上明細表
            repository: orderRepository
            table:
              columns:
                - { field: orderNo, label: 受注番号, width: 200 }
                - { field: customer, label: 顧客, width: 200 }
                - { field: amount, label: 金額, type: number, width: 200 }
            report:
              rowsPerPage: 120
          YAML
          node dist/cli.js validate /tmp/wide.yaml --json > /tmp/paper.json
          grep -q '"rule": "columns-wider-than-paper"' /tmp/paper.json
          grep -q '"rule": "rows-per-page-too-many"' /tmp/paper.json
          # 数を出していること（どれだけ減らせばいいか分からないと直せない）。
          grep -q '595.28pt' /tmp/paper.json
          grep -q '7.02pt' /tmp/paper.json
          # 同梱の帳票の例は、当然どちらも言われないこと（誤検出しない）。
          node dist/cli.js validate --warn-as-error ../spec/examples/sales_report.yaml

      - name: Show the paper (a report as text, for a human or an AI)
        working-directory: typescript
        run: |
          set -e
          # 刷るのは Dart 版。TS 版は同じ座標を組んで**文字で見せる**（AI は紙を見られない）。
          # 行を渡さなくても見えること（見本の行を作る）と、そう書くこと。
          node dist/cli.js paper ../spec/examples/sales_report.yaml --columns 100 \
            > /tmp/paper.log 2> /tmp/paper.err
          grep -q '595.28 x 841.89pt の紙' /tmp/paper.log
          # 同梱の例は得意先ごとに改ページするので、紙は複数枚になる。
          grep -q -- '--- 2 枚目 ---' /tmp/paper.log
          grep -q '顧客: ' /tmp/paper.log
          grep -q '小計' /tmp/paper.log
          grep -q '行は\*\*見本\*\*です' /tmp/paper.err
          # 右寄せの数は右端が揃うこと（揃っていなければ、揃っているかを読めない）。
          # 数えるのは**表示幅**（全角は2桁）。文字数で数えると、全角の数が違う行
          # （小計の「件」）だけズレて見える。
          node -e "
            const fs = require('fs');
            const half = (c) => {
              const x = c.codePointAt(0);
              return (x >= 0x20 && x <= 0x7e) || (x >= 0xff61 && x <= 0xffdc) ||
                (x >= 0xffe8 && x <= 0xffee);
            };
            const cells = (s) => [...s].reduce((n, c) => n + (half(c) ? 1 : 2), 0);
            const ends = fs.readFileSync('/tmp/paper.log', 'utf8').split('\n')
              .filter((line) => line.includes('¥'))
              .map((line) => cells(line.trimEnd()));
            const uniq = [...new Set(ends)];
            if (ends.length < 3 || uniq.length !== 1) {
              console.error('右端が揃っていない: ' + JSON.stringify(uniq));
              process.exit(1);
            }
          "
          # 本物の行を渡したときは、見本の注記を出さないこと。
          printf '%s' '[{"orderNo":"SO-1","orderDate":"2026-04-01","status":"出荷済","customer":"山田商事","amount":1234}]' > /tmp/rows.json
          node dist/cli.js paper ../spec/examples/sales_report.yaml --rows /tmp/rows.json \
            > /tmp/paper2.log 2> /tmp/paper2.err
          grep -q '¥1,234' /tmp/paper2.log
          if grep -q '見本' /tmp/paper2.err; then
            echo "渡した行なのに見本と言っている"; exit 1
          fi
          # 帳票でない定義には、そう言って落ちること。
          if node dist/cli.js paper ../spec/examples/customer_master.yaml 2> /tmp/paper3.err; then
            echo "帳票でない定義を通してしまった"; exit 1
          fi
          grep -q '帳票（type: report）の定義がありません' /tmp/paper3.err

      - name: Printing starts in the definition, not in application code
        working-directory: typescript
        run: |
          set -e
          # 同梱の帳票には印刷ボタンがある。アクションの型が通っていなければ
          # unknown-action-type で落ちる＝「定義から刷れる」ことがここで担保される。
          node dist/cli.js validate --warn-as-error ../spec/examples/sales_report.yaml
          # 説明は画面の言葉で読み上げる（語彙は spec/vocabulary.json が正）。
          node dist/cli.js explain ../spec/examples/sales_report.yaml > /tmp/print.log
          grep -q '印刷 … 紙に刷る' /tmp/print.log
          # 紙の無い画面に置いたら、**押す前に**言うこと（押すまで分からないのは遅い）。
          cat > /tmp/print-nowhere.yaml <<'YAML'
          page:
            type: crud
            id: order_list
            title: 受注一覧
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: printPdf, type: print, label: 印刷 }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/print-nowhere.yaml               2> /tmp/nowhere.log; then
            echo "紙の無い画面の印刷ボタンを通してしまった"; exit 1
          fi
          grep -q 'この画面には report がありません' /tmp/nowhere.log
          node dist/cli.js validate --json /tmp/print-nowhere.yaml > /tmp/nowhere.json
          grep -q '"rule": "print-without-report"' /tmp/nowhere.json
          # 警告から対照表（間違い → 正しい書き方）へ繋がること。
          node dist/cli.js pitfalls print-without-report > /tmp/pitfall.log
          grep -q 'type: report' /tmp/pitfall.log
          # 紙も持ち出しの口として数えること（権限で絞っていなければ助言が出る）。
          node dist/cli.js advise /tmp/print-nowhere.yaml > /tmp/print-advise.log
          grep -q '紙で持ち出せます' /tmp/print-advise.log

      - name: What the definition needs from the application (including sinks)
        working-directory: typescript
        run: |
          set -e
          # 定義が外に要求しているもの。Repository とプラグインだけでなく、
          # **出す口**（CSV は exportSink、印刷は printSink）も出ること。ここが
          # 抜けていると「ボタンは出るのに押すと未登録です」を空のリポジトリから
          # 始める人が踏む。
          node dist/cli.js refs ../spec/examples/sales_report.yaml             --needs-registration > /tmp/needs.log
          grep -q 'exportSink' /tmp/needs.log
          grep -q 'printSink' /tmp/needs.log
          # 口が繋がっていなければ、押す前に言う（登録済み一覧との突き合わせ）。
          printf '%s' '{"repositories":["orderRepository"],"sinks":["exportSink"]}'             > /tmp/half-wired.json
          node dist/cli.js validate ../spec/examples/sales_report.yaml             --registry /tmp/half-wired.json --json > /tmp/half-wired-out.json
          grep -q '"rule": "unregistered-sink"' /tmp/half-wired-out.json
          grep -q 'printSink' /tmp/half-wired-out.json
          if grep -q '"exportSink"' /tmp/half-wired-out.json; then
            echo "登録済みの口まで未登録と言っている"; exit 1
          fi

      - name: A bulk action says what it runs on, and where it may not sit
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # デモの一覧には「選んだ行にまとめて実行する」ボタンがある（警告ゼロで通る）。
          node dist/cli.js validate --warn-as-error "$DEMO"
          # 説明は「選んだ行に対して実行する」と読み上げ、**一度に何件動くか**まで言う
          # （危険度がそこで変わるのに、定義を読んでも出てこない）。
          node dist/cli.js explain "$DEMO" --page order_search > /tmp/bulk.log
          # 上限を定義に書いてあるなら、**それが上限**だと言う（1ページの件数ではなく）。
          # 承認は役割ごと（担当20件・管理者は1ページ全部）。誰にとっての上限かまで言う。
          grep -q '1回で最大 20 件まで（manager は 50 件）＝定義で決めた上限' /tmp/bulk.log
          grep -q '1回で最大 5 件まで＝定義で決めた上限' /tmp/bulk.log
          # 表の無い画面に置いたら、押せないボタンになると言うこと。
          cat > /tmp/bulk-nowhere.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            form:
              sections:
                - fields: [{ field: orderNo, label: 受注番号, required: true }]
            actions:
              - { id: approve, type: plugin, plugin: approveOrders,
                  label: 一括承認, scope: selection }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/bulk-nowhere.yaml \
              2> /tmp/bulk-nowhere.err; then
            echo "表の無い画面の一括ボタンを通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/bulk-nowhere.yaml > /tmp/bulk1.json
          grep -q '"rule": "selection-without-table"' /tmp/bulk1.json
          # plugin 以外の型に書いたら、実行されないと言うこと（対照表にも繋がる）。
          cat > /tmp/bulk-export.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: csv, type: export, label: 一括出力, scope: selection }
          YAML
          node dist/cli.js validate --json /tmp/bulk-export.yaml > /tmp/bulk2.json
          grep -q '"rule": "selection-unsupported-type"' /tmp/bulk2.json
          grep -q '"pitfall": "bulk-delete"' /tmp/bulk2.json
          node dist/cli.js pitfalls bulk-delete > /tmp/bulk-pitfall.log
          grep -q 'rowActions' /tmp/bulk-pitfall.log
          # 助言は別のことを言う（確認が無い一括・権限で絞っていない一括）。
          cat > /tmp/bulk-bare.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            search:
              filters: [{ field: status, label: 状態 }]
            table:
              columns: [{ field: orderNo, label: 受注番号, sortable: true }]
            actions:
              - { id: approve, type: plugin, plugin: approveOrders,
                  label: 一括承認, scope: selection }
          YAML
          node dist/cli.js advise /tmp/bulk-bare.yaml > /tmp/bulk-advise.log
          grep -q 'bulk-without-confirm' /tmp/bulk-advise.log
          grep -q 'まとめて実行できます' /tmp/bulk-advise.log

          # 助言はそのまま当てられる。**書く値は渡す側が決め、書く場所は機械が決める**。
          cat > /tmp/apply-picks.json <<'JSON'
          [
            { "rule": "bulk-without-confirm",
              "value": { "message": "{count} 件を承認します。よろしいですか？", "danger": true } },
            { "rule": "open-dangerous-action", "value": ["manager"] }
          ]
          JSON
          node dist/cli.js advise /tmp/bulk-bare.yaml --apply /tmp/apply-picks.json \
            > /tmp/applied.yaml 2> /tmp/applied.log
          grep -q '2 件を当てました' /tmp/applied.log
          grep -q "confirm: { message: '{count} 件を承認します。よろしいですか？', danger: true }" /tmp/applied.yaml
          grep -q 'roles: \[manager\]' /tmp/applied.yaml
          # 当てたあとも strict で通る（壊れた定義を書き出していない）。
          node dist/cli.js validate /tmp/applied.yaml
          # 当てた助言はもう出ない（出るなら、書いた場所が違う）。
          node dist/cli.js advise /tmp/applied.yaml > /tmp/applied-advise.log
          if grep -q 'bulk-without-confirm' /tmp/applied-advise.log; then
            echo "当てたのに助言が残っている"
            exit 1
          fi
          # 値を渡していない助言は当てず、何を渡せばいいかを言う（頼み事なので 1 を返す）。
          echo '[{ "rule": "bulk-without-error-message" }]' > /tmp/apply-bare.json
          if node dist/cli.js advise /tmp/bulk-bare.yaml --apply /tmp/apply-bare.json \
               > /dev/null 2> /tmp/apply-bare.log; then
            echo "値の無い助言を当ててしまった"
            exit 1
          fi
          grep -q 'value に渡してください' /tmp/apply-bare.log

          # 一括だけは既定で厳しい。危ない書き方を1枚に集めて、5つ全部言うことを見る。
          cat > /tmp/bulk-risky.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            search:
              filters: [{ field: status, label: 状態 }]
            table:
              pagination: { enabled: false }
              columns: [{ field: orderNo, label: 受注番号, sortable: true }]
            actions:
              - { id: approve, type: plugin, plugin: approveOrders, label: 一括承認,
                  scope: selection, roles: [manager] }
              - { id: notify, type: plugin, plugin: notifyOrders, label: 通知,
                  scope: selection, roles: [manager],
                  confirm: { message: 選んだ受注に通知します },
                  onError: { message: 'x' } }
              - { id: discardSelected, type: plugin, plugin: discardOrders, label: 破棄,
                  scope: selection, roles: [manager],
                  confirm: { message: '{count} 件を破棄します' },
                  onError: { message: 'x' } }
          YAML
          # 上限（maxRows）の書き間違いは、押す前に言う。
          cat > /tmp/maxrows-bad.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              pagination: { pageSize: 10 }
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: csv, type: export, label: CSV出力, maxRows: 20 }
              - { id: approve, type: plugin, plugin: approveOrders, label: 一括承認,
                  scope: selection, maxRows: 200, roles: [manager],
                  confirm: { message: '{count} 件を承認します' },
                  onError: { message: 'x' } }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/maxrows-bad.yaml \
                2> /tmp/maxrows-bad.err; then
            echo "効かない上限を通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/maxrows-bad.yaml > /tmp/maxrows-bad.json
          for rule in maxrows-without-selection maxrows-above-page-size; do
            grep -q "\"rule\": \"$rule\"" /tmp/maxrows-bad.json || {
              echo "$rule が出ていない"; exit 1; }
          done
          # 役割ごとの上限（byRole）。3版が同じ数を出すことは共有フィクスチャが縛るので、
          # ここでは「読み上げ」と「効かない書き方」を見る。
          cat > /tmp/maxrows-roles.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              pagination: { pageSize: 100 }
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                roles: [staff, manager, admin]
                maxRows:
                  default: 20
                  byRole: { manager: 100, admin: all }
                confirm: { message: '{count} 件を承認します' }
                onError: { message: 'x' }
          YAML
          node dist/cli.js validate --warn-as-error /tmp/maxrows-roles.yaml
          node dist/cli.js explain /tmp/maxrows-roles.yaml > /tmp/maxrows-roles.log
          grep -q '1回で最大 20 件まで（manager は 100 件・admin は 上限なし）＝定義で決めた上限' \
                /tmp/maxrows-roles.log
          # 押せない役割・どこにも無い役割名に書いた上限は効かない。
          cat > /tmp/maxrows-role-bad.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                roles: [manager]
                maxRows: { default: 20, byRole: { staff: 10 } }
                confirm: { message: '{count} 件を承認します' }
                onError: { message: 'x' }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/maxrows-role-bad.yaml \
                2> /tmp/maxrows-role-bad.err; then
            echo "押せない役割の上限を通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/maxrows-role-bad.yaml \
                > /tmp/maxrows-role-bad.json
          grep -q '"rule": "maxrows-unknown-role"' /tmp/maxrows-role-bad.json
          # 上限を書いてあれば、件数の助言は言わない（Renderer が止めるので）。
          cat > /tmp/maxrows-ok.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            search:
              filters: [{ field: status, label: 状態 }]
            table:
              pagination: { enabled: false }
              columns: [{ field: orderNo, label: 受注番号, sortable: true }]
            actions:
              - { id: approve, type: plugin, plugin: approveOrders, label: 一括承認,
                  scope: selection, maxRows: 20, roles: [manager],
                  confirm: { message: '{count} 件を承認します' },
                  onError: { message: 'x' } }
          YAML
          node dist/cli.js validate --warn-as-error /tmp/maxrows-ok.yaml
          node dist/cli.js advise /tmp/maxrows-ok.yaml > /tmp/maxrows-ok.log
          if grep -q 'bulk-on-many-rows' /tmp/maxrows-ok.log; then
            echo "上限を書いてあるのに件数の助言を出している"; exit 1
          fi
          node dist/cli.js advise /tmp/bulk-risky.yaml > /tmp/bulk-risky.log
          for rule in bulk-without-confirm bulk-confirm-without-count \
                bulk-without-error-message bulk-destructive-without-danger \
                bulk-on-many-rows; do
            grep -q "$rule" /tmp/bulk-risky.log || {
              echo "$rule が出ていない"; exit 1; }
          done
          # 助言なので終了コードは変えない（一括でも警告に格上げしない）。
          node dist/cli.js advise /tmp/bulk-risky.yaml > /dev/null
          # 聞く形（prompt）は確認そのもの＝「確認が無い」と言わない（嘘を言わない）。
          cat > /tmp/bulk-prompt.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            search:
              filters: [{ field: status, label: 状態 }]
            table:
              pagination: { pageSize: 50 }
              columns: [{ field: orderNo, label: 受注番号, sortable: true }]
            actions:
              - { id: notify, type: plugin, plugin: notifyOrders, label: 通知,
                  scope: selection, roles: [manager],
                  prompt: { title: '{count} 件に通知します',
                            fields: [{ field: memo, label: 本文 }] },
                  onError: { message: 'x' } }
          YAML
          node dist/cli.js advise /tmp/bulk-prompt.yaml > /tmp/bulk-prompt.log
          if grep -q 'bulk-' /tmp/bulk-prompt.log; then
            echo "聞く形の一括に、要らない助言を出している"; exit 1
          fi
          # デモは自分の助言に従っている（一括については1件も出ない）。
          node dist/cli.js advise "$DEMO" > /tmp/bulk-demo.log
          if grep -q 'bulk-' /tmp/bulk-demo.log; then
            echo "デモが自分の助言に従っていない"; exit 1
          fi
          # 権限で絞っていない一括は、図の棚卸しでも危ない側（赤枠）に出る。
          cat > /tmp/bulk-open.yaml <<'YAML'
          app:
            id: sales
            title: 販売
            menu:
              - { id: orders, label: 受注, page: order_search }
            pages:
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                key: orderNo
                table:
                  columns: [{ field: orderNo, label: 受注番号 }]
                actions:
                  - { id: approve, type: plugin, plugin: approveOrders,
                      label: 一括承認, scope: selection }
          YAML
          node dist/cli.js diagram /tmp/bulk-open.yaml --json > /tmp/bulk-roles.json
          grep -q 'まとめて実行ができる画面' /tmp/bulk-roles.json

      - name: Role names in the definition are matched against the application
        working-directory: typescript
        run: |
          set -e
          # 定義の中で綴りが揃っていても、アプリが配る名前と違えば**その役割で
          # 出し分けている所は誰にも見えない**。画面を見ても気づけないので、
          # 名前の一覧どうしを突き合わせる。
          mkdir -p /tmp/roles-app
          cat > /tmp/roles-app/app.yaml <<'YAML'
          app:
            id: sales
            title: 販売管理
            menu:
              - { id: costs, label: 原価, page: cost_search, roles: [manager] }
            pages:
              - type: search
                id: cost_search
                title: 原価照会
                repository: costRepository
                search:
                  filters: [{ field: itemCode, label: 品目コード }]
                table:
                  columns:
                    - { field: itemCode, label: 品目コード, sortable: true }
                    - { field: cost, label: 原価, roles: [hr] }
                actions:
                  - id: approve
                    type: plugin
                    plugin: approveCosts
                    label: 一括承認
                    scope: selection
                    maxRows: { default: 20, byRole: { branch: 5 } }
                    confirm: { message: '{count} 件を承認します' }
                    onError: { message: '{failed} 件はだめでした' }
                    batchSize: 5
          YAML
          # アプリ側は「配りうる役割」を宣言する（いま配られている roles: ではない）。
          cat > /tmp/roles-app/main.dart <<'DART'
          void main() {
            runApp(HatakeScope(
              repositories: RepositoryRegistry({'costRepository': CostRepository()}),
              actions: ActionRegistry({'approveCosts': (ctx) async {}}),
              renderer: const MaterialRenderer(),
              // このアプリが配りうる役割の全部。hr は書き忘れている。
              knownRoles: const {'manager', 'branch'},
              roles: session.roles,
              child: const App(),
            ));
          }
          DART
          # 1. 実装から一覧を作る（役割は knownRoles を読む）。
          node dist/cli.js registry /tmp/roles-app/main.dart --json > /tmp/roles-reg.json
          node -e '
            const fs = require("fs");
            const reg = JSON.parse(fs.readFileSync("/tmp/roles-reg.json", "utf8"));
            const roles = (reg.roles ?? []).join(",");
            if (roles !== "branch,manager") {
              console.error("役割を読めていない: " + roles);
              process.exit(1);
            }
            delete reg.unreadable;
            fs.writeFileSync("/tmp/roles-app/hatake-registry.json", JSON.stringify(reg));
          '
          # 2. 定義にしか無い役割は「誰にも見えない」と言う（近い名前も出す）。
          if node dist/cli.js validate --warn-as-error --json /tmp/roles-app/app.yaml \
               > /tmp/roles-warn.json 2>&1; then
            echo "配られていない役割で通ってしまった"; exit 1
          fi
          grep -q 'role-not-in-app' /tmp/roles-warn.json
          grep -q 'アプリが配る役割の中にありません' /tmp/roles-warn.json
          # 役割ごとの件数（byRole）に書いた役割は、アプリが配っているので黙る。
          if grep -q 'byRole.branch' /tmp/roles-warn.json; then
            echo "アプリが配っている役割を指摘してしまった"; exit 1
          fi
          # 3. アプリ側に足せば黙る（どちら側を直しても直る）。
          node -e '
            const fs = require("fs");
            const path = "/tmp/roles-app/hatake-registry.json";
            const reg = JSON.parse(fs.readFileSync(path, "utf8"));
            reg.roles = [...reg.roles, "hr"].sort();
            fs.writeFileSync(path, JSON.stringify(reg));
          '
          node dist/cli.js validate --warn-as-error /tmp/roles-app/app.yaml
          # 4. 役割は「定義が外に要求しているもの」に並ぶ（配る必要がある、と言う）。
          node dist/cli.js refs /tmp/roles-app/app.yaml > /tmp/roles-refs.log
          grep -q 'roles:' /tmp/roles-refs.log
          grep -q 'アプリが配る必要がある' /tmp/roles-refs.log
          # 5. 逆向きの棚卸しには出さない（消す相手ではない）。
          node dist/cli.js refs /tmp/roles-app/app.yaml --unused --json > /tmp/roles-unused.json
          if grep -q '"roles"' /tmp/roles-unused.json; then
            echo "役割を「使われていない登録」に出してしまった"; exit 1
          fi
          # 6. 読めないものは黙って落とさない（空の一覧＝「役割が無い」の嘘を作らない）。
          cat > /tmp/roles-app/dyn.dart <<'DART'
          final scope = HatakeScope(knownRoles: session.allRoles(), child: child);
          DART
          if node dist/cli.js registry /tmp/roles-app/dyn.dart > /tmp/roles-dyn.log 2>&1; then
            echo "読めない語彙で成功してしまった"; exit 1
          fi
          grep -q '変数や関数の戻り値は読めません' /tmp/roles-dyn.log
          # デモも語彙を宣言している（同梱の一覧と実装が一致することは vitest が見る）。
          grep -q 'knownRoles' ../flutter/packages/hatake_example/lib/main.dart
          grep -q '"roles"' ../flutter/packages/hatake_example/assets/hatake-registry.json

      - name: Roles are counted, and every drafted value can be applied
        working-directory: typescript
        run: |
          set -e
          # 役割名は定義のあちこちに散る。棚卸しは**出てくる回数の多い順**なので、
          # 1か所しか出てこない役割（綴り違いの疑い）が下に落ちてくる。
          cat > /tmp/roles-app.yaml <<'YAML'
          app:
            id: sales
            title: 販売管理
            menu:
              - { id: orders, label: 受注, page: order_search }
              - { id: costs, label: 原価, page: cost_search, roles: [manager] }
            pages:
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                search:
                  filters: [{ field: orderNo, label: 受注番号 }]
                table:
                  columns: [{ field: orderNo, label: 受注番号, sortable: true }]
                actions:
                  - { id: exportCsv, type: export, label: CSV 出力, roles: [manager, admin] }
              - type: search
                id: cost_search
                title: 原価照会
                repository: costRepository
                search:
                  filters: [{ field: itemCode, label: 品目コード }]
                table:
                  columns:
                    - { field: itemCode, label: 品目コード, sortable: true }
                    - { field: cost, label: 原価, roles: [manaher] }
          YAML
          node dist/cli.js explain /tmp/roles-app.yaml --roles > /tmp/roles.log
          grep -q 'manager … 2 か所' /tmp/roles.log
          grep -q 'manaher … 1 か所' /tmp/roles.log
          grep -q '綴り違いの疑い' /tmp/roles.log
          # 定義に書いてある名前だけ、と毎回言う（権限がかかっている証明ではない）。
          grep -q 'アプリ側の権限判定' /tmp/roles.log
          # 役割を1つも書いていない定義でも、黙って空を返さない。
          node dist/cli.js explain ../spec/examples/order_entry.yaml --roles > /tmp/noroles.log
          grep -q '全部の人に全部見えます' /tmp/noroles.log

          # 助言の**下書きは、そのまま当てられる**（当てられない下書きは出さない）。
          cat > /tmp/draft-page.yaml <<'YAML'
          page:
            type: crud
            id: order_list
            title: 受注一覧
            repository: orderRepository
            key: orderNo
            table:
              pagination: { pageSize: 200 }
              columns:
                - { field: customer, label: 得意先 }
                - { field: orderDate, label: 受注日, type: date }
                - { field: amount, label: 金額 }
            form:
              sections:
                - fields:
                    - { field: orderNo, label: 受注番号 }
                    - { field: customer, label: 得意先 }
            actions:
              - { id: approve, type: plugin, plugin: approveOrders, label: 一括承認,
                  scope: selection, roles: [manager] }
          YAML
          node dist/cli.js advise /tmp/draft-page.yaml > /tmp/draft-advice.log
          grep -q '値の下書き:' /tmp/draft-advice.log
          grep -q '下書きです' /tmp/draft-advice.log
          node dist/cli.js advise /tmp/draft-page.yaml --json > /tmp/draft-advice.json
          node -e '
            const fs = require("fs");
            const advice = JSON.parse(fs.readFileSync("/tmp/draft-advice.json", "utf8"));
            const picks = advice
              .filter((one) => one.draft !== undefined)
              .map((one) => ({ rule: one.rule, where: one.where, value: one.draft }));
            if (picks.length < 4) {
              console.error("下書きが少なすぎる: " + picks.length);
              process.exit(1);
            }
            fs.writeFileSync("/tmp/draft-picks.json", JSON.stringify(picks));
          '
          # 1件でも当てられなければ 1 が返る＝下書きが嘘をついていないことの確認。
          node dist/cli.js advise /tmp/draft-page.yaml --apply /tmp/draft-picks.json \
            --write > /tmp/draft-applied.log 2>&1
          # 当てた所は画面の言葉でも言う。
          grep -q '変わったところ' /tmp/draft-applied.log
          # 当てたあとも strict で通る。
          node dist/cli.js validate /tmp/draft-page.yaml

      - name: A failure speaks the definition's words
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # デモの一括は confirm / onSuccess / onError を持ち、件数の差し込みを使う
          # （scope: selection なので埋まる＝警告ゼロ）。
          node dist/cli.js validate --warn-as-error "$DEMO"
          node dist/cli.js explain "$DEMO" --page order_search > /tmp/err.log
          grep -q '失敗したら' /tmp/err.log
          # 埋まらない差し込みは、押す前に言う（件数は一括だけ・{error} は失敗だけ）。
          cat > /tmp/placeholder.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 承認
                onSuccess: { message: '{count} 件を承認しました（{error}）' }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/placeholder.yaml \
              2> /tmp/placeholder.err; then
            echo "埋まらない差し込みを通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/placeholder.yaml > /tmp/ph.json
          grep -q '"rule": "placeholder-not-filled"' /tmp/ph.json
          # 2件出る（件数の差し込みと {error} は別の理由で埋まらない）。
          test "$(grep -c 'placeholder-not-filled' /tmp/ph.json)" -eq 2

          # 失敗の言い方を**書いていない**ボタンは、何が出るかまで読み返しに出す
          # （書き忘れても動くので、出ないと気づけない）。
          node dist/cli.js explain /tmp/placeholder.yaml > /tmp/noerr.log
          grep -q '失敗したら理由がそのまま出る' /tmp/noerr.log

          # 差し込みの一覧（**閉じた集合**なので機械が言える）。一覧・埋める側・
          # 検査が同じ1枚（spec/placeholders.json）を見ている。
          node dist/cli.js reference --placeholders > /tmp/ph.log
          grep -q '{failedKeys}' /tmp/ph.log
          grep -q 'ここに無いものは埋まりません' /tmp/ph.log
          node dist/cli.js reference --placeholders --json > /tmp/ph-list.json
          # 一覧に載っているのに検査が知らない差し込みは無い（載っている名前を
          # 全部 onError に書いて、警告が出ないことで確かめる）。
          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("/tmp/ph-list.json", "utf8"));
            const action = doc.contexts.find((one) => one.id === "action-message");
            const names = action.placeholders.map((one) => one.name).join(" ");
            fs.writeFileSync("/tmp/all-ph.yaml", [
              "page:",
              "  type: search",
              "  id: order_search",
              "  title: 受注照会",
              "  repository: orderRepository",
              "  key: orderNo",
              "  search:",
              "    filters: [{ field: orderNo, label: 受注番号 }]",
              "  table:",
              "    columns: [{ field: orderNo, label: 受注番号, sortable: true }]",
              "  actions:",
              "    - id: approve",
              "      type: plugin",
              "      plugin: approveOrders",
              "      label: 一括承認",
              "      scope: selection",
              "      onError: { message: '" + names + "' }",
              "",
            ].join("\n"));
          '
          node dist/cli.js validate --warn-as-error /tmp/all-ph.yaml

          # デモは失敗した行を名指しで報告する（文言の {failedKeys} が埋まる）。
          grep -q '{failedKeys}' "$DEMO"
          grep -q 'ActionOutcome.rejected' ../flutter/packages/hatake_example/lib/bulk_dialog.dart

      - name: The wiring draft still compiles (generated, then diffed)
        working-directory: typescript
        run: |
          set -e
          TOOL=../flutter/packages/hatake_example/tool
          # 配線の下書きは生成物。コミットしてあるものと一致すること＝生成器を
          # 直したら生成物も更新する（**通ることは flutter のジョブが見る**：
          # tool/ は hatake_example の中なので flutter analyze の対象）。
          node dist/cli.js wire ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --out /tmp/wired_sales_app.dart
          diff -u --strip-trailing-cr "$TOOL/wired_sales_app.dart" \
            /tmp/wired_sales_app.dart
          node dist/cli.js wire "$TOOL/wire_everything.yaml" --base /api \
            --assets tool/wire_everything.yaml --out /tmp/wired_everything.dart
          diff -u --strip-trailing-cr "$TOOL/wired_everything.dart" \
            /tmp/wired_everything.dart
          # 定義が要求している登録が、下書きに全部出ていること。
          for name in orderRepository approveOrder orderNoFormat toUpperSnake \
              median discount jpyCompact colorPicker heatmap exportSink printSink; do
            grep -q "$name" "$TOOL/wired_everything.dart" || {
              echo "配線の下書きに $name が出ていない"; exit 1; }
          done
          # 登録する口が無いもの（グラフの種類）は、コードにせず末尾で言う。
          grep -q '登録する口がまだ無いもの' "$TOOL/wired_everything.dart"
          # 「黙って何もしない」実装を置かない（埋め忘れは実行時に落ちる）。
          grep -q 'UnimplementedError' "$TOOL/wired_sales_app.dart"
          # --merge も生成物。**手で埋めた中身を消さない**ことがこの道具の条件なので、
          # 出来上がりをコミットして flutter analyze に通す（通らない Dart を書き出す
          # 道具は、無いほうがまだ良い）。
          node dist/cli.js wire "$TOOL/wire_everything.yaml"             --merge "$TOOL/wired_sales_app.dart" --out /tmp/merged_everything.dart
          diff -u --strip-trailing-cr "$TOOL/merged_everything.dart"             /tmp/merged_everything.dart
          # 足すだけ＝元の配線の行は1行も消えていない（renderer を開く1行だけが例外）。
          while IFS= read -r line; do
            case "$line" in
              *"renderer: const MaterialRenderer(),"*) continue ;;
              "") continue ;;
            esac
            grep -qxF "$line" "$TOOL/merged_everything.dart" || {
              echo "merge が行を消した: $line"; exit 1; }
          done < "$TOOL/wired_sales_app.dart"
          # 2回やっても増えない（同じものを2つ書かない）。
          node dist/cli.js wire "$TOOL/wire_everything.yaml"             --merge "$TOOL/merged_everything.dart" --out /tmp/twice.dart
          diff -u --strip-trailing-cr "$TOOL/merged_everything.dart" /tmp/twice.dart

          # ── 足した所を渡す / 埋まったかを数える ──────────────────────
          # 足した所は「誰が何を埋めるのか」の一覧にできる（足した直後は全部 TODO で、
          # 埋め忘れは動かして初めて分かる）。
          cp "$TOOL/wired_sales_app.dart" /tmp/hand.dart
          node dist/cli.js wire "$TOOL/wire_everything.yaml" \
            --merge /tmp/hand.dart --write --todo > /tmp/wire-todo.log
          grep -q '書くもの:' /tmp/wire-todo.log
          grep -q 'UnimplementedError で落ちます' /tmp/wire-todo.log
          grep -q 'hatake refs --filled' /tmp/wire-todo.log
          # 書くものの言葉は、出したコードの中の言葉と**同じ1か所**から出している。
          grep -q "median: 集約の中身" /tmp/hand.dart
          grep -q '書くもの: 集約の中身' /tmp/wire-todo.log

          # 出したままの配線は、要求している登録が**全部 TODO のまま**。
          mkdir -p /tmp/wiring && cp /tmp/wired_sales_app.dart /tmp/wiring/
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --filled --source /tmp/wiring > /tmp/filled.log
          grep -q 'TODO のまま' /tmp/filled.log
          grep -q 'approveOrders' /tmp/filled.log
          # 事実だけでは落とさない。落とす旗を立てたときだけ落ちる。
          if ! node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
               --filled --source /tmp/wiring --pending-as-error > /dev/null; then
            echo "（想定どおり）TODO のままなので落ちた"
          else
            echo "TODO のままなのに通ってしまった"; exit 1
          fi
          # 中身を埋めたら「埋まっている」に移る＝数え方が動いていることの確認。
          sed -i "s/throw UnimplementedError('approveOrders: 何をするか')/api.approve(ctx)/" \
            /tmp/wiring/wired_sales_app.dart
          node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
            --filled --source /tmp/wiring --json > /tmp/filled.json
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/filled.json", "utf8"));
            const one = report.items.find((item) => item.name === "approveOrders");
            if (one === undefined || one.state !== "filled") {
              console.error("埋めたのに「埋まっている」に移らない:", one);
              process.exit(1);
            }
          '

          # 逆向き（消す候補）は、**実装を見ていないと落とす旗を置けない**
          # ＝画面の外から直接呼んでいる登録を「使われていない」と言うのは嘘。
          echo '{"repositories":["orderRepository","goneRepository"]}' > /tmp/reg.json
          if node dist/cli.js refs ../flutter/packages/hatake_example/assets/sales_app.yaml \
               --unused --registry /tmp/reg.json --unused-as-error > /tmp/unused.log 2>&1; then
            echo "実装を見ずに落とす旗を置いてしまった"; exit 1
          fi
          grep -q -- '--source <実装のパス> が要ります' /tmp/unused.log

      - name: Asking before the action runs (prompt)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # デモの却下は「理由を書いてから」。警告ゼロで通ること。
          node dist/cli.js validate --warn-as-error "$DEMO"
          # 説明は**何を聞くか**を読み上げ、聞くなら「確認を出す」とは言わない
          # （ダイアログは1枚なので、2枚出ると読めてしまうと嘘になる）。
          node dist/cli.js explain "$DEMO" --page order_search > /tmp/prompt.log
          grep -q '押すと 理由 / 却下日 を聞く' /tmp/prompt.log
          # 聞いた値を受け取れない型なら、押す前に言う。
          cat > /tmp/prompt-nowhere.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: csv
                type: export
                label: CSV出力
                prompt:
                  fields: [{ field: memo, label: メモ }]
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/prompt-nowhere.yaml \
              2> /tmp/prompt-nowhere.err; then
            echo "受け取れない prompt を通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/prompt-nowhere.yaml > /tmp/prompt.json
          grep -q '"rule": "prompt-unsupported-type"' /tmp/prompt.json
          # 聞くことが1つも無い prompt は読めない（confirm の領分）。
          cat > /tmp/prompt-empty.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: x, type: plugin, plugin: p, label: X, prompt: { fields: [] } }
          YAML
          if node dist/cli.js explain /tmp/prompt-empty.yaml 2> /tmp/empty.err; then
            echo "空の prompt を読めてしまった"; exit 1
          fi
          grep -q '聞くことが1つも書かれていません' /tmp/empty.err

      - name: The vertical total comes from the definition (computed with of / where / join)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # デモの受注入力に小計（明細の縦計）が入っていて、警告ゼロで通ること。
          node dist/cli.js validate --warn-as-error "$DEMO"
          # 説明が**何を畳むのか**を名前で言うこと（「自動で計算する」では読めない）。
          node dist/cli.js explain "$DEMO" --page order_entry > /tmp/fold.log
          grep -q '小計 … 明細 の 金額 の合計（手では入れない）' /tmp/fold.log
          grep -q '明細行数 … 明細 の件数（手では入れない）' /tmp/fold.log
          # 絞ってから畳んだなら、**何で絞ったか**も言うこと（合計が合わない相談はこれ）。
          grep -q '取消 が true でないときの行だけ' /tmp/fold.log
          # 並べる計算は、畳む計算と別の言い方をすること（数ではなく文字が出る）。
          grep -q '明細 の 品名 を並べたもの（手では入れない）' /tmp/fold.log
          # 集約の名前は、登録が要るものとして数えない（組み込みなので）。
          node dist/cli.js refs "$DEMO" --needs-registration > /tmp/fold.refs
          if grep -q 'computedOps' /tmp/fold.refs; then
            echo "組み込みの集約が「登録が要る」に混ざっている"; exit 1
          fi
          # 書き間違いは押す前に言う（5つの規則）。
          cat > /tmp/fold-bad.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: amount, label: 金額, type: number }
                - title: 金額
                  fields:
                    - { field: a, label: 小計A, computed: { op: sum, field: lines } }
                    - { field: b, label: 小計B, computed: { op: product, field: lines, of: amount } }
                    - { field: c, label: 小計C, computed: { op: sum, field: line, of: amount } }
                    - { field: d, label: 小計D, computed: { op: sum, field: lines, of: amout } }
                    - { field: e, label: 小計E, computed: { op: avg, fields: [a, b] } }
                    - { field: f, label: 小計F, computed: { op: sum, field: lines, of: amount, fields: [a] } }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/fold-bad.yaml               2> /tmp/fold-bad.err; then
            echo "書き間違いを通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/fold-bad.yaml > /tmp/fold-bad.json
          for rule in computed-aggregate-without-of computed-rows-unsupported-op               computed-of-unknown-field computed-field-and-fields; do
            grep -q "\"rule\": \"$rule\"" /tmp/fold-bad.json || {
              echo "$rule が出ていない"; exit 1; }
          done
          # ページ送りの明細は畳めない（行がそこに揃っていない）。
          node dist/cli.js validate --json             ../flutter/packages/hatake_example/assets/sales_app.yaml > /tmp/fold-ok.json
          cat > /tmp/fold-paged.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      source: { repository: orderLineRepository, parentKey: orderNo, key: lineNo }
                      fields:
                        - { field: amount, label: 金額, type: number }
                    - { field: subtotal, label: 小計, computed: { op: sum, field: lines, of: amount } }
          YAML
          node dist/cli.js validate --json /tmp/fold-paged.yaml > /tmp/fold-paged.json
          grep -q '"rule": "computed-of-paged-subtable"' /tmp/fold-paged.json
          # 絞り込みと順番の書き間違いも、押す前に言う（どれも空欄か 0 になるだけ）。
          cat > /tmp/fold-where-bad.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: amount, label: 金額, type: number }
                        - { field: cancelled, label: 取消, type: checkbox }
                - title: 金額
                  fields:
                    - { field: a, label: 小計A, computed: { op: sum, field: lines, of: amount, where: { field: canceled, operator: notEquals, value: true } } }
                    - { field: b, label: 小計B, computed: { op: sum, fields: [x, y], where: { field: cancelled, operator: notEquals, value: true } } }
                    - { field: c, label: 小計C, computed: { op: sum, field: lines, of: amount, where: { mode: create } } }
                    - { field: d, label: 合計D, computed: { op: sum, fields: [e] } }
                    - { field: e, label: 小計E, computed: { op: sum, field: lines, of: amount } }
                    - { field: f, label: 合計F, computed: { op: sum, fields: [f] } }
                    - { field: g, label: 品名G, computed: { op: join, field: lines } }
          YAML
          if node dist/cli.js validate --warn-as-error /tmp/fold-where-bad.yaml                 2> /tmp/fold-where-bad.err; then
            echo "絞り込み・順番の書き間違いを通してしまった"; exit 1
          fi
          node dist/cli.js validate --json /tmp/fold-where-bad.yaml > /tmp/fold-where-bad.json
          for rule in computed-where-unknown-field computed-where-ignored \
                computed-where-mode computed-order computed-self-reference \
                computed-aggregate-without-of; do
            grep -q "\"rule\": \"$rule\"" /tmp/fold-where-bad.json || {
              echo "$rule が出ていない"; exit 1; }
          done
          # 同じ絞り込みは項目間の検証にも要る（計算だけ絞ると必ず食い違う）。
          cat > /tmp/fold-compare.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: amount, label: 金額, type: number }
                        - { field: cancelled, label: 取消, type: checkbox }
                    - { field: subtotal, label: 小計, computed: { op: sum, field: lines, of: amount, where: { field: cancelled, operator: notEquals, value: true } } }
                    - field: total
                      label: 合計
                      type: number
                      validators:
                        - { type: compare, operator: equals, field: lines, aggregate: sum, of: amount, where: { field: cancelled, operator: notEquals, value: true } }
          YAML
          node dist/cli.js validate --warn-as-error /tmp/fold-compare.yaml
          # 検証側だけ絞り忘れ（`aggregate` が無い / 綴り違い）は言う。
          cat > /tmp/fold-compare-bad.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: amount, label: 金額, type: number }
                        - { field: cancelled, label: 取消, type: checkbox }
                    - field: total
                      label: 合計
                      type: number
                      validators:
                        - { type: compare, operator: equals, field: lines, where: { field: cancelled, operator: notEquals, value: true } }
                    - field: other
                      label: 別の合計
                      type: number
                      validators:
                        - { type: compare, operator: equals, field: lines, aggregate: sum, of: amount, where: { field: canceled, operator: notEquals, value: true } }
          YAML
          node dist/cli.js validate --json /tmp/fold-compare-bad.yaml > /tmp/fold-compare-bad.json
          for rule in compare-where-ignored compare-where-unknown-field; do
            grep -q "\"rule\": \"$rule\"" /tmp/fold-compare-bad.json || {
              echo "$rule が出ていない"; exit 1; }
          done
          # 綴り違いに見えない名前（画面に出していない値）は責めない＝嘘の警告を出さない。
          cat > /tmp/fold-hidden.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: amount, label: 金額, type: number }
                    - { field: subtotal, label: 小計, computed: { op: sum, field: lines, of: amount, where: { field: deletedFlag, operator: isEmpty } } }
          YAML
          node dist/cli.js validate --warn-as-error /tmp/fold-hidden.yaml

      - name: Only the top rows, and rows checked against each other
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # 1. デモが**上位だけ並べる**形と**行どうしの規則**を持っていて、警告ゼロで通る。
          node dist/cli.js validate --warn-as-error "$DEMO"
          grep -q 'sort: { field: amount, ascending: false }, limit: 3' "$DEMO"
          grep -q 'type: unique, of: item' "$DEMO"
          # 2. 読み返しが「上位だけ」と言う（数からは読めない＝全部の合計と見分けが付かない）。
          node dist/cli.js explain "$DEMO" --page order_entry > /tmp/top.log
          grep -q '金額が大きい順に3 件だけ' /tmp/top.log
          grep -q '切ったぶんは件数で言う' /tmp/top.log
          # 行どうしの規則も、行の項目の言葉で読み返す。
          grep -q '品名 が同じ行は書けない' /tmp/top.log
          # 3. 効かない書き方を言う（画面を見ても気づけないものばかり）。
          cat > /tmp/top-bad.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - field: lines
                      label: 明細
                      type: subTable
                      validators:
                        - { type: unique, of: itme }
                      fields:
                        - { field: item, label: 品名 }
                        - { field: amount, label: 金額, type: number }
                    - { field: names, label: 主な品名, computed: { op: join, field: lines, of: item, sort: { field: amont, ascending: false }, limit: 2 } }
                    - { field: total, label: 合計, computed: { op: sum, fields: [a, b], limit: 2 } }
                    - { field: rows, label: 行数, computed: { op: count, field: lines, overflow: "他 {count} 件" } }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/top-bad.yaml \
               > /tmp/top-bad.json 2>&1; then
            echo "効かない書き方で通ってしまった"; exit 1
          fi
          for rule in unique-unknown-field computed-sort-unknown-field \
              computed-sort-without-rows computed-overflow-unused; do
            grep -q "\"rule\": \"$rule\"" /tmp/top-bad.json || {
              echo "$rule が出ていない"; cat /tmp/top-bad.json; exit 1; }
          done
          # 綴りを直せば通る（言っているのは「効かない」ことだけ）。
          sed -e 's/of: itme/of: item/' -e 's/field: amont/field: amount/' \
              -e 's/, limit: 2 } }$/ } }/' /tmp/top-bad.yaml > /tmp/top-ok.yaml
          grep -v 'overflow' /tmp/top-ok.yaml | grep -v 'fields: \[a, b\]' > /tmp/top-ok2.yaml
          node dist/cli.js validate --warn-as-error /tmp/top-ok2.yaml
          # 4. サーバが決める値・画面が計算する値は、契約にそう書く（readOnly）。
          #    契約を出すのは1ページ単位なので、1枚の定義で見る。
          cat > /tmp/top-page.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - { field: orderNo, label: 受注番号, required: true }
                    - { field: customer, label: 顧客, required: true }
                    - { field: id, label: 伝票ID, readOnly: true }
                    - field: lines
                      label: 明細
                      type: subTable
                      fields:
                        - { field: item, label: 品名 }
                        - { field: amount, label: 金額, type: number }
                    - { field: subtotal, label: 小計, computed: { op: sum, field: lines, of: amount } }
          YAML
          node dist/cli.js schema /tmp/top-page.yaml > /tmp/top-schema.json
          node -e '
            const doc = JSON.parse(require("fs").readFileSync("/tmp/top-schema.json", "utf8"));
            const request = doc["$defs"].OrderEntryRequest.properties;
            // 画面が計算する値（小計）とサーバが決める値（伝票ID）には readOnly の
            // 印が付く＝サーバは受け取った値を無視して定義から計算し直してよい、が読める。
            for (const name of ["subtotal", "id"]) {
              if (request[name].readOnly !== true) {
                console.error(name + " に readOnly の印が無い");
                process.exit(1);
              }
            }
            // 手で入れる項目には付かない（付けたら「送るな」と読まれてしまう）。
            if ("readOnly" in request.customer) {
              console.error("手で入れる項目に readOnly が付いている");
              process.exit(1);
            }
          '
          node dist/cli.js openapi /tmp/top-page.yaml --base-path /api/orders \
            > /tmp/top-openapi.json
          node -e '
            const doc = JSON.parse(require("fs").readFileSync("/tmp/top-openapi.json", "utf8"));
            const shape = doc.components.schemas.OrderEntryResponse.properties;
            if (shape.subtotal.readOnly !== true) {
              console.error("OpenAPI 側に readOnly の印が無い");
              process.exit(1);
            }
          '

      - name: Running a definition (scenarios, draft, coverage)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # 1. 下書きは**そのまま回せる**（作った期待が、その場の答えと合っている）。
          node dist/cli.js run "$DEMO" --page order_entry --draft \
            --out /tmp/order.scenario.json
          node dist/cli.js run "$DEMO" --page order_entry \
            --scenario /tmp/order.scenario.json > /tmp/run.log
          grep -q '件すべて期待どおり' /tmp/run.log
          # 2. 期待を1つ壊したら**落ちる**（通ることしか確かめないと、道具が寝ていても気づけない）。
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("/tmp/order.scenario.json", "utf8"));
            const one = file.cases.find((c) => c.expect && c.expect.computed
              && Object.keys(c.expect.computed).length > 0);
            if (one === undefined) { console.error("計算を確かめる件が無い"); process.exit(1); }
            const key = Object.keys(one.expect.computed)[0];
            one.expect.computed[key] = "わざと違う値";
            fs.writeFileSync("/tmp/broken.scenario.json", JSON.stringify(file), "utf8");
          '
          if node dist/cli.js run "$DEMO" --page order_entry \
               --scenario /tmp/broken.scenario.json > /tmp/broken.log 2>&1; then
            echo "壊した期待で通ってしまった"; cat /tmp/broken.log; exit 1
          fi
          grep -q 'NG' /tmp/broken.log
          # 3. まだ試していない分岐を挙げる（次に書くシナリオが決まる）。
          cat > /tmp/one.scenario.json <<'JSON'
          { "cases": [ { "name": "個人", "record": { "kind": "personal" } } ] }
          JSON
          cat > /tmp/cover.yaml <<'YAML'
          page:
            type: form
            id: member
            title: 会員
            repository: memberRepository
            form:
              sections:
                - fields:
                    - { field: kind, label: 区分, type: select,
                        options: [{ value: personal, label: 個人 }, { value: corporate, label: 法人 }] }
                    - { field: companyNo, label: 法人番号,
                        visibleWhen: { field: kind, operator: equals, value: corporate } }
            actions:
              - { id: save, type: plugin, plugin: saveMember, label: 登録 }
          YAML
          node dist/cli.js run /tmp/cover.yaml --scenario /tmp/one.scenario.json --cover \
            > /tmp/cover.log
          grep -q 'まだ試していない所' /tmp/cover.log
          grep -q '「法人番号」が出る条件' /tmp/cover.log
          # 4. **答えられないことは答えない**（登録が要る計算は値を作らない）。
          cat > /tmp/plugin.yaml <<'YAML'
          page:
            type: form
            id: tax
            title: 税
            repository: repo
            form:
              sections:
                - fields:
                    - { field: price, label: 価格, type: number }
                    - { field: tax, label: 消費税, computed: { op: consumptionTax, field: price } }
          YAML
          cat > /tmp/plugin.scenario.json <<'JSON'
          { "cases": [ { "name": "1000 円", "record": { "price": 1000 } } ] }
          JSON
          node dist/cli.js run /tmp/plugin.yaml --scenario /tmp/plugin.scenario.json \
            > /tmp/plugin.log
          grep -q 'consumptionTax' /tmp/plugin.log
          grep -q '登録が要ります' /tmp/plugin.log
          # 5. 道具の答えと**共有フィクスチャ**が一致していること（Dart 版も同じ表を食べる）。
          node -e '
            const fs = require("fs");
            const { parsePageJson } = require("./dist/parse.js");
            const { runCase, compareAnswer } = require("./dist/scenario.js");
            const fixture = JSON.parse(
              fs.readFileSync("../spec/conformance/scenario.json", "utf8"));
            const page = parsePageJson(JSON.stringify(fixture.page), { strict: true });
            for (const one of fixture.cases) {
              const bad = compareAnswer(one.expect, runCase(page, one));
              if (bad.length > 0) {
                console.error(one.name + ": " + JSON.stringify(bad));
                process.exit(1);
              }
            }
            console.log("scenario fixture: " + fixture.cases.length + " 件一致");
          '

      - name: The tutorial's definition and its output are real
        working-directory: typescript
        run: |
          set -e
          # チュートリアル（docs/tutorial.ja.md）に載せた定義を**そのまま**取り出して通す。
          # 手引きの定義が腐ると、最初の30分で必ず転ぶ（一番まずい所）。
          python3 - <<'PY' > /tmp/tutorial.yaml
          import io, re
          text = io.open("../docs/tutorial.ja.md", encoding="utf-8").read()
          blocks = re.findall(r"```yaml\n(.*?)```", text, re.S)
          # 通しで作る定義（明細の縦計を持つ1枚）。
          found = [b for b in blocks if "consumptionTax" in b]
          assert len(found) == 1, "定義の塊が1つに決まらない: %d" % len(found)
          io.open("/dev/stdout", "w", encoding="utf-8").write(found[0])
          PY
          # 警告ゼロで通ること（チュートリアルの完成形なので、警告が出ていたら嘘）。
          node dist/cli.js validate --warn-as-error /tmp/tutorial.yaml
          # 載せた説明の文が、実際にその通り出ること（言い方を直したら手引きも直す）。
          node dist/cli.js explain /tmp/tutorial.yaml > /tmp/tutorial.log
          grep -q '請求先 … 区分 が 法人 のときだけ必須' /tmp/tutorial.log
          grep -q '得意先 … 選択、必須、選択肢は customerRepository から引く' /tmp/tutorial.log
          grep -q '1行は 品名・数量・単価・金額' /tmp/tutorial.log
          # ボタンを書いていないので「できる操作」の節は出ない（手引きがそう書いている）。
          if grep -q '## できる操作' /tmp/tutorial.log; then
            echo "手引きの説明と実際の出力が食い違っている"; exit 1
          fi
          # 外に要求しているもの（手引きが「ここに出てくる」と書いている2つ）。
          node dist/cli.js refs /tmp/tutorial.yaml --needs-registration > /tmp/tutorial.refs
          grep -q 'consumptionTax' /tmp/tutorial.refs
          # 組み込みの計算（sum / product / count）は「登録が要る」に出てこない。
          # 名前まるごとで見る（`consumptionTax` に sum が入っているので部分一致は誤検出）。
          if grep -qE '^  (sum|product|count) ' /tmp/tutorial.refs; then
            echo "組み込みの計算が「登録が要る」に混ざっている"; exit 1
          fi
          # 手引きが載せている配線の下書きも、実際にその形で出ること。
          node dist/cli.js wire /tmp/tutorial.yaml --base /api > /tmp/tutorial.dart 2>/dev/null
          grep -q "'customerRepository': 'customers'," /tmp/tutorial.dart
          grep -q "'consumptionTax': (computed, record) =>" /tmp/tutorial.dart
          # 項目が1つ増えたとき、足した所を渡す形（手引きの 7 節の続き）。
          node dist/cli.js wire /tmp/tutorial.yaml --base /api --out /tmp/tut-wiring.dart \
            > /dev/null 2>&1
          python3 - <<'PY'
          import io
          s = io.open("/tmp/tutorial.yaml", encoding="utf-8").read()
          old = "          - { field: total, label: "
          assert s.count(old) == 1, s.count(old)
          add = (
              "          - { field: discount, label: 割引, type: number, readOnly: true,\n"
              "              computed: { op: discountRate, field: subtotal } }\n"
          )
          io.open("/tmp/tutorial2.yaml", "w", encoding="utf-8", newline="\n").write(
              s.replace(old, add + old, 1)
          )
          PY
          node dist/cli.js wire /tmp/tutorial2.yaml --merge /tmp/tut-wiring.dart \
            --write --todo > /tmp/tut-todo.log
          grep -q 'computeds/discountRate' /tmp/tut-todo.log
          grep -q '書くもの: 計算の中身' /tmp/tut-todo.log
          # 埋まったかを数える形（手引きが載せている数と状態が、実際にその通り出ること）。
          node dist/cli.js refs /tmp/tutorial2.yaml --filled \
            --source /tmp/tut-wiring.dart > /tmp/tut-filled.log
          grep -qE '定義が要求している登録: 4 件' /tmp/tut-filled.log
          grep -qE 'TODO のまま +2' /tmp/tut-filled.log
          grep -qE '埋まっている +2' /tmp/tut-filled.log
          # REST で組んだ配線は登録は済んでいるのに、実際に通信する所が空いている
          # ＝登録だけ数えると「全部埋まっている」と出て、動かすと1件も取れない。
          grep -q '配線そのものに残っている TODO' /tmp/tut-filled.log
          grep -q 'HTTP クライアントを繋ぐ' /tmp/tut-filled.log

      - name: The PR-comment snippet in the guide actually runs
        working-directory: typescript
        run: |
          set -e
          # 手引き（docs/guide/pr-comment.ja.md）に載せた Actions の断片を**そのまま**走らせる。
          # 文書に載せたコマンドは、動かさないと必ず腐る（貼った人の所で初めて落ちる）。
          pip install --quiet pyyaml
          python3 - <<'PY' > /tmp/snippet.sh
          import io, yaml, re
          text = io.open("../docs/guide/pr-comment.ja.md", encoding="utf-8").read()
          block = re.search(r"```yaml\n(.*?)```", text, re.S).group(1)
          steps = yaml.safe_load(block)["jobs"]["explain"]["steps"]
          run = next(s["run"] for s in steps if s.get("id") == "explain")
          io.open("/dev/stdout", "w", encoding="utf-8").write(run)
          PY
          # 定義を1枚持つ git の履歴を作る（本物の枝分かれと本物の変更）。
          rm -rf /tmp/pr && mkdir -p /tmp/pr/definitions && cd /tmp/pr
          git init -q . && git config user.email ci@example.com && git config user.name CI
          cat > definitions/order.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
          YAML
          git add -A && git commit -qm before
          BASE=$(git rev-parse HEAD)
          # 画面の見え方が変わる修正（列を1本足す）。
          cat > definitions/order.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns:
                - { field: orderNo, label: 受注番号 }
                - { field: amount, label: 金額, type: number }
          YAML
          git add -A && git commit -qm after
          export PATH="$GITHUB_WORKSPACE/typescript/node_modules/.bin:$PATH"
          alias npx=true
          # 断片の中の `npx hatake` を、いまビルドした CLI に向ける。
          sed "s#npx hatake#node $GITHUB_WORKSPACE/typescript/dist/cli.js#g" /tmp/snippet.sh > run.sh
          BASE="$BASE" DEFS=definitions GITHUB_OUTPUT=/tmp/out.txt bash run.sh
          grep -q 'changed=true' /tmp/out.txt
          grep -q 'definitions/order.yaml' body.md
          grep -q '金額' body.md
          # 見え方が変わらない修正（キーの並べ替え）では**貼らない**。
          BASE=$(git rev-parse HEAD)
          cat > definitions/order.yaml <<'YAML'
          page:
            id: order_search
            type: search
            repository: orderRepository
            title: 受注照会
            key: orderNo
            table:
              columns:
                - { label: 受注番号, field: orderNo }
                - { type: number, field: amount, label: 金額 }
          YAML
          git add -A && git commit -qm reorder
          BASE="$BASE" DEFS=definitions GITHUB_OUTPUT=/tmp/out2.txt bash run.sh
          grep -q 'changed=false' /tmp/out2.txt
          [ ! -s body.md ]

      - name: Reading the definition back in English (explain --lang en)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          node dist/cli.js explain "$DEMO" --lang en > /tmp/en.log
          # 節の見出しと言い回しは英語。
          grep -q '^## Screens' /tmp/en.log
          grep -q '^## Who can open which screen' /tmp/en.log
          grep -q 'an app of' /tmp/en.log
          # **定義に書いてあるラベルは訳さない**（業務の言葉なので、訳すと別のものを指す）。
          grep -q '受注照会' /tmp/en.log
          # 日本語は1文字も変わらない（既定は ja）。
          node dist/cli.js explain "$DEMO" > /tmp/ja.log
          grep -q '^## 画面' /tmp/ja.log
          grep -q '枚の画面をメニューで束ねたアプリ' /tmp/ja.log
          # 1枚ぶんも英語で出る（項目の注記まで）。
          node dist/cli.js explain "$DEMO" --page order_entry --lang en > /tmp/en1.log
          grep -q '^## What can be done' /tmp/en1.log
          grep -q 'required' /tmp/en1.log
          # 知らない言語は黙って日本語にしない。
          if node dist/cli.js explain "$DEMO" --lang fr > /tmp/fr.log 2>&1; then
            echo "知らない言語を通してしまった"; exit 1
          fi
          grep -q 'ja か en' /tmp/fr.log
          # まだ英語にできない道具では、半分だけ英語にせず落ちる。
          if node dist/cli.js explain "$DEMO" --review --lang en > /tmp/rev.log 2>&1; then
            echo "英語にできない道具で通してしまった"; exit 1
          fi
          grep -q '説明' /tmp/rev.log

      - name: Hitting the API the definition declares (probe / attack)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # 叩く前に「何を叩くか」が出ること（--dry-run は送らないので、この段は
          # サーバが無くても回る＝本物のデモ定義に対して毎回確かめられる）。
          node dist/cli.js probe "$DEMO" --base http://127.0.0.1:8099/api             --dry-run > /tmp/probe-dry.log
          grep -q 'GET http://127.0.0.1:8099/api/orders?page=0&pageSize=' /tmp/probe-dry.log
          grep -q '送っていません' /tmp/probe-dry.log
          # 繋がらないなら、繋がらないと言って落ちる（黙って「食い違い無し」にしない）。
          if node dist/cli.js probe "$DEMO" --base http://127.0.0.1:9/api               > /tmp/probe-dead.log; then
            echo "繋がらないのに通ってしまった"; exit 1
          fi
          grep -q '叩けませんでした' /tmp/probe-dead.log
          # ここから先は**本物の通信**。わざと食い違ったサーバを立てる
          # （偽の送信器を差し替えた試験では、fetch そのものは通らない）。
          cat > /tmp/stub-api.mjs <<'JS'
          import { appendFileSync, writeFileSync } from "node:fs";
          import { createServer } from "node:http";
          const json = (res, status, body) => {
            res.writeHead(status, { "content-type": "application/json" });
            res.end(JSON.stringify(body));
          };
          createServer((req, res) => {
            const path = req.url.split("?")[0];
            if (req.method === "POST" && path === "/auth/login") {
              // 資格の口。**POST を受けるのはここだけ**（業務の口に POST が来たら
              // 下で試験を落とす）。合言葉が違えば 401 を返す。
              let body = "";
              req.on("data", (chunk) => { body += chunk; });
              req.on("end", () => {
                const given = JSON.parse(body || "{}");
                appendFileSync("/tmp/stub-logins", `${given.userId}\n`);
                if (!String(given.password ?? "").endsWith("-pass")) {
                  return json(res, 401, { message: "bad credentials" });
                }
                json(res, 200, { data: { accessToken: `tok-${given.userId}` } });
              });
              return;
            }
            if (req.method !== "GET") {
              // 読むだけ、を**サーバ側から**縛る。1回でも来たら試験を落とす。
              writeFileSync("/tmp/stub-write-attempt", req.method);
              return json(res, 405, { message: "read-only stub" });
            }
            const staff = req.headers.authorization === "Bearer staff";
            if (path === "/api/orders") {
              // 金額を**文字で**返す（BigDecimal を文字列で出す実装。画面では
              // 桁区切りも合計も静かに効かなくなる）。
              return json(res, 200, {
                items: [{ orderNo: "SO-1", amount: "1200" }],
                totalCount: 1,
              });
            }
            if (path === "/api/prices") {
              // 資格を渡したときだけ遮断する（渡さなければ穴のまま）。
              return staff
                ? json(res, 403, { message: "forbidden" })
                : json(res, 200, { items: [{ itemCode: "A-1" }], totalCount: 1 });
            }
            if (path === "/api/prices/A-1") return json(res, 200, { itemCode: "A-1" });
            return json(res, 404, { message: "no route" });
          }).listen(8099, "127.0.0.1");
          JS
          cat > /tmp/probe-app.yaml <<'YAML'
          app:
            id: probe_check
            title: 突き合わせ
            menu:
              - { id: orders, label: 受注, page: order_search }
              - { id: prices, label: 単価マスタ, page: price_master, roles: [admin] }
            pages:
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                key: orderNo
                table:
                  pagination: { pageSize: 2 }
                  columns:
                    - { field: orderNo, label: 受注番号 }
                    - { field: amount, label: 金額, type: number, format: currency }
              - type: master
                id: price_master
                title: 単価マスタ
                repository: priceRepository
                key: itemCode
                table:
                  columns: [{ field: itemCode, label: 品目 }]
                form:
                  sections: [{ fields: [{ field: itemCode, label: 品目 }] }]
          YAML
          rm -f /tmp/stub-write-attempt /tmp/stub-logins
          node /tmp/stub-api.mjs & STUB=$!
          trap 'kill $STUB' EXIT
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused             http://127.0.0.1:8099/api/orders > /dev/null
          # 静かに壊れる食い違い（金額が文字）を捕まえて落ちること。
          if node dist/cli.js probe /tmp/probe-app.yaml               --base http://127.0.0.1:8099/api > /tmp/probe.log; then
            echo "食い違いがあるのに通ってしまった"; exit 1
          fi
          grep -q 'number の約束ですが string で返っています' /tmp/probe.log
          grep -q '合計' /tmp/probe.log
          # 権限: 見えない画面の口が開いていたら落ちる。
          if node dist/cli.js attack /tmp/probe-app.yaml --role staff               --base http://127.0.0.1:8099/api > /tmp/attack.log; then
            echo "穴があるのに通ってしまった"; exit 1
          fi
          grep -q 'API が遮断していません' /tmp/attack.log
          # 遮断されていれば通ること（同じサーバ・同じ定義で、資格だけが違う）。
          node dist/cli.js attack /tmp/probe-app.yaml --role staff --token staff             --base http://127.0.0.1:8099/api > /tmp/attack-ok.log
          grep -q '見えない口は拒否されました' /tmp/attack-ok.log

          # 役割ぜんぶ＋誰でもない人を1枚に。**資格は役割ごと**に渡す
          # （1つの資格で他の役割を判定すると、200 が穴なのか正しいのか区別できない）。
          cat > /tmp/accounts.json <<'JSON'
          {
            "$comment": "役割ごとの資格。誰でもない人は資格を送らないので書かない。",
            "accounts": {
              "admin": { "token": "admin" },
              "staff": { "token": "staff" }
            }
          }
          JSON
          # 送る前に、何を叩くかが役割ごとに出ること。
          node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
            --accounts /tmp/accounts.json --base http://127.0.0.1:8099/api \
            --dry-run > /tmp/sweep-dry.log
          grep -q '誰でもない人（資格なし）' /tmp/sweep-dry.log
          # このスタブは「資格を渡したときだけ遮断する」ので、**ログインしていない人に
          # 単価マスタが見えている**＝穴として出る（役割ごとには ok に見えるやつ）。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --accounts /tmp/accounts.json --base http://127.0.0.1:8099/api \
               > /tmp/sweep.log; then
            echo "誰でもない人に見えているのに通ってしまった"; exit 1
          fi
          grep -q 'staff=ok' /tmp/sweep.log
          grep -q '誰でもない人=穴' /tmp/sweep.log
          # 1つの資格で全部を判定するのは断る（読み替えは嘘になるので）。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --accounts /tmp/accounts.json --token staff \
               --base http://127.0.0.1:8099/api > /tmp/sweep-bad.log 2>&1; then
            echo "1つの資格で役割ぜんぶを判定してしまった"; exit 1
          fi
          grep -q '役割ごとに渡します' /tmp/sweep-bad.log

          # ── 人が横に居ない所で回す（--login / --since / --fail-on new）────────
          cat > /tmp/login.json <<'JSON'
          {
            "$comment": "資格の取り方。値は環境変数から取るので、このファイルは commit できる。",
            "url": "http://127.0.0.1:8099/auth/login",
            "tokenAt": "data.accessToken",
            "roles": {
              "admin": { "userId": "probe-admin", "password": "${ADMIN_PASSWORD}" },
              "staff": { "userId": "probe-staff", "password": "${STAFF_PASSWORD}" }
            }
          }
          JSON
          # 環境変数が無ければ**落ちる**（空のまま送ると 401 が返り、「穴が無い」と
          # 読める結果になる）。この段では1本も送っていないこと。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --login /tmp/login.json --base http://127.0.0.1:8099/api \
               > /tmp/login-noenv.log 2>&1; then
            echo "合言葉が空なのに通ってしまった"; exit 1
          fi
          grep -q 'ADMIN_PASSWORD が空です' /tmp/login-noenv.log
          test ! -f /tmp/stub-logins
          export ADMIN_PASSWORD=a-pass STAFF_PASSWORD=s-pass
          # --save が書くのは --json と同じもの（次の晩に読み直せる形でないと比べられない）。
          node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
            --login /tmp/login.json --base http://127.0.0.1:8099/api \
            --json > /tmp/night1-json.txt || true
          node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
            --login /tmp/login.json --base http://127.0.0.1:8099/api \
            --save /tmp/night1.json > /tmp/night1.log || true
          diff /tmp/night1-json.txt /tmp/night1.json
          # 役割ごとに取っている（役割の数だけ資格の口を叩く）。
          grep -qx 'probe-admin' /tmp/stub-logins
          grep -qx 'probe-staff' /tmp/stub-logins
          # 取ったトークンは**どこにも出さない**（CI のログは残る）。
          if grep -q 'tok-probe' /tmp/night1.log /tmp/night1.json; then
            echo "トークンが出力に出た"; exit 1
          fi
          grep -q '誰でもない人=穴' /tmp/night1.log
          # 手引きに書いた「初回は空の結果を置く」が本当に読めること。
          echo '{"runs":[],"skipped":[],"pages":[]}' > /tmp/empty-run.json
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --login /tmp/login.json --base http://127.0.0.1:8099/api \
               --since /tmp/empty-run.json --fail-on new > /tmp/first.log; then
            echo "初回に穴が出たのに通ってしまった"; exit 1
          fi
          grep -q '新しく出たもの' /tmp/first.log
          # 2晩目: 何も変わっていないので --fail-on new は落ちない。前から在る穴は
          # 並べずに数だけ言う（毎晩同じ表を読ませない）。
          node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
            --login /tmp/login.json --base http://127.0.0.1:8099/api \
            --since /tmp/night1.json --save /tmp/night2.json --fail-on new \
            > /tmp/night2.log
          grep -q '前回と同じです' /tmp/night2.log
          grep -q '前から続いているもの' /tmp/night2.log
          if grep -q '誰でもない人=穴' /tmp/night2.log; then
            echo "変わっていないものを並べている"; exit 1
          fi
          # 3晩目: staff の資格が通らなくなった。穴は報告から消えるが、**直ったとは
          # 言わない**し、新しい分だけで落とす設定でも**落ちる**（何も見ていない晩に
          # 静かに緑になるのが、この道具で一番まずい嘘）。
          if STAFF_PASSWORD=wrong node dist/cli.js attack /tmp/probe-app.yaml \
               --all-roles --login /tmp/login.json \
               --base http://127.0.0.1:8099/api --since /tmp/night2.json \
               --fail-on new > /tmp/night3.log; then
            echo "叩けなくなったのに通ってしまった"; exit 1
          fi
          grep -q '前回は叩けていたのに、今回叩いていない相手' /tmp/night3.log
          grep -q '資格が取れませんでした（401 が返りました）' /tmp/night3.log
          if grep -q '\[直った\]' /tmp/night3.log; then
            echo "叩いていない相手のぶんを「直った」と言った"; exit 1
          fi
          # --fail-on new は前回が無いと決められない。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --login /tmp/login.json --base http://127.0.0.1:8099/api \
               --fail-on new > /tmp/failon.log 2>&1; then
            echo "比べる相手が無いのに新しいかどうかを言ってしまった"; exit 1
          fi
          grep -q -- '--since 前回.json が要ります' /tmp/failon.log

          # ここまでで、業務の口に書き込む方式は1回も飛んでいないこと
          # （POST を受けたのは資格の口だけ）。
          if [ -f /tmp/stub-write-attempt ]; then
            echo "読むだけの道具が $(cat /tmp/stub-write-attempt) を送った"; exit 1
          fi

      - name: The dependency picture, and diagrams you can paste
        working-directory: typescript
        run: |
          set -e
          # 計算の依存の図。**サイトに載せた図が本物であること**まで見る
          # （手で書いた図は必ず腐る）。
          node dist/cli.js diagram ../spec/examples/order_entry.yaml --computed \
            > /tmp/deps.mmd
          grep -q 'flowchart LR' /tmp/deps.mmd
          # 明細の行から親へ（縦計）と、行の中の計算。
          grep -q 'lines_amount -->|sum| subtotal' /tmp/deps.mmd
          grep -q 'lines_qty --> lines_amount' /tmp/deps.mmd
          # 畳む前の絞り込みは細い線（値の流れと区別する）。
          grep -q 'lines_cancelled -.->|絞り込み| subtotal' /tmp/deps.mmd
          # サイトの図解ページに貼ってあるものと、実際の出力が一致すること。
          python3 - <<'PY'
          import io, re
          page = io.open("../site/docs/diagrams.md", encoding="utf-8").read()
          blocks = re.findall(r"```mermaid\n(.*?)```", page, re.S)
          assert len(blocks) == 1, "mermaid の塊が1つに決まらない: %d" % len(blocks)
          real = io.open("/tmp/deps.mmd", encoding="utf-8").read()
          if blocks[0].strip() != real.strip():
              raise SystemExit(
                  "サイトに貼ってある図と、実際の出力が違う:\n--- 貼ってある ---\n%s\n"
                  "--- 実際 ---\n%s" % (blocks[0], real)
              )
          PY
          # 順番が逆の依存は赤い線で出る（validate の警告と同じ判定）。
          cat > /tmp/late.yaml <<'YAML'
          page:
            type: form
            id: order_entry
            title: 受注入力
            repository: orderRepository
            key: orderNo
            form:
              sections:
                - fields:
                    - { field: total, label: 合計, computed: { op: sum, fields: [subtotal] } }
                    - { field: subtotal, label: 小計, computed: { op: sum, fields: [price] } }
                    - { field: price, label: 単価, type: number }
          YAML
          node dist/cli.js diagram /tmp/late.yaml --computed > /tmp/late.mmd
          grep -q '順番が逆' /tmp/late.mmd
          grep -q 'stroke-width:2px' /tmp/late.mmd
          # 警告の側も同じことを言う（2つの言い方をしない）。
          node dist/cli.js validate /tmp/late.yaml > /tmp/late.log 2>&1 || true
          grep -q 'diagram --computed' /tmp/late.log

          # 画面の図も貼れる形で出せる（箱の中身まで運ぶ）。
          node dist/cli.js diagram ../spec/examples/sales_app.yaml \
            --format mermaid > /tmp/app.mmd 2>/dev/null
          grep -q 'flowchart LR' /tmp/app.mmd
          grep -q 'order_search -->|詳細| order_detail' /tmp/app.mmd
          grep -q '<br/>' /tmp/app.mmd
          node dist/cli.js diagram ../spec/examples/sales_app.yaml \
            --format dot > /tmp/app.dot 2>/dev/null
          grep -q 'digraph hatake {' /tmp/app.dot
          # 知らない形は、出せる形を言って落ちる。
          if node dist/cli.js diagram ../spec/examples/sales_app.yaml \
               --format png > /tmp/badformat.log 2>&1; then
            echo "知らない形で通ってしまった"; exit 1
          fi
          grep -q 'mermaid か dot' /tmp/badformat.log

      - name: Running a bulk action in batches (progress and stopping)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          cat > /tmp/batch.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                maxRows: 40
                batchSize: 10
                confirm: { message: '{count} 件を承認します' }
                onError:
                  message: '{count} 件を承認（{failed} 件だめ／{skipped} 件は実行していません）'
          YAML
          # 1. 区切りは一括のときだけ効く（この形は警告ゼロ）。
          node dist/cli.js validate --warn-as-error /tmp/batch.yaml
          # 2. いつ止められるのかを読み返す。
          node dist/cli.js explain /tmp/batch.yaml > /tmp/batch.log
          grep -q '10 件ずつ実行する（進み具合が出て、区切りで止められる）' /tmp/batch.log
          # 3. 効かない所に書いたら言う（1件ずつのボタン／上限以上の区切り）。
          cat > /tmp/batch-bad.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: one, type: plugin, plugin: approveOne, label: 承認, batchSize: 10 }
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                maxRows: 10
                batchSize: 10
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/batch-bad.yaml \
               > /tmp/batch-bad.json 2>&1; then
            echo "効かない区切りで通ってしまった"; exit 1
          fi
          grep -q 'batchsize-without-selection' /tmp/batch-bad.json
          grep -q 'batchsize-above-maxrows' /tmp/batch-bad.json
          # 4. 送っていない件数は、差し込みの一覧の1枚から来ている
          #    （一覧・検査・埋める側が同じものを見る）。
          node dist/cli.js reference --placeholders > /tmp/ph.log
          grep -q '{skipped}' /tmp/ph.log
          # 成功の文言に書いたら言う（成功に「実行していない分」は無い）。
          cat > /tmp/batch-skipped.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                batchSize: 10
                onSuccess: { message: '{skipped} 件を残しました' }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/batch-skipped.yaml \
               > /tmp/batch-skipped.json 2>&1; then
            echo "成功の文言に {skipped} を書いて通ってしまった"; exit 1
          fi
          grep -q 'placeholder-not-filled' /tmp/batch-skipped.json
          # デモにも入っている（2件ずつ渡すので、動かすと進み具合が見える）。
          grep -q 'batchSize: 2' "$DEMO"
          node dist/cli.js explain "$DEMO" --page order_search > /tmp/demo-batch.log
          grep -q '2 件ずつ実行する' /tmp/demo-batch.log
          grep -q '{skipped} 件は実行していません' "$DEMO"

      - name: A batch size per role (smallest wins)
        working-directory: typescript
        run: |
          set -e
          # 区切りは役割ごとに書ける（回線の細い拠点は小さく、社内は大きく）。
          cat > /tmp/batch-role.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                maxRows: { default: 40, byRole: { manager: all } }
                batchSize:
                  default: 20
                  byRole: { branch: 5, manager: 50 }
          YAML
          # 1. 役割ごとの形は警告ゼロで通る（strict でも通る）。
          node dist/cli.js validate --strict --warn-as-error /tmp/batch-role.yaml
          # 2. 誰がどの件数で動くのかを読み返す（書いたのに読み上げないと、定義を
          #    読むまで分からない）。
          node dist/cli.js explain /tmp/batch-role.yaml > /tmp/batch-role.log
          grep -q '20 件ずつ実行する（進み具合が出て、区切りで止められる）' /tmp/batch-role.log
          grep -q '区切りは役割で変わる（branch は 5 件・manager は 50 件）' /tmp/batch-role.log
          # 3. 効かない区切りは、役割ごとに書いてあっても言う（同じ役割の上限と比べる／
          #    押せない役割に書いた区切りは効かない）。
          cat > /tmp/batch-role-bad.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: approve
                type: plugin
                plugin: approveOrders
                label: 一括承認
                scope: selection
                roles: [manager]
                maxRows: { default: 40, byRole: { manager: 5 } }
                batchSize:
                  default: 20
                  byRole: { manager: 5, branch: 5 }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/batch-role-bad.yaml \
               > /tmp/batch-role-bad.json 2>&1; then
            echo "効かない区切り（役割ごと）で通ってしまった"; exit 1
          fi
          grep -q 'batchsize-above-maxrows' /tmp/batch-role-bad.json
          grep -q 'batchsize-unknown-role' /tmp/batch-role-bad.json
          # 4. 区切らない（all）は書けない＝区切らないなら書かない。
          cat > /tmp/batch-all.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: approve, type: plugin, plugin: p, label: 承認, scope: selection, batchSize: all }
          YAML
          if node dist/cli.js validate /tmp/batch-all.yaml > /tmp/batch-all.log 2>&1; then
            echo "batchSize: all が通ってしまった"; exit 1
          fi

      - name: A bulk that makes people wait says so (advice, inventory, read-back)
        working-directory: typescript
        run: |
          set -e
          cat > /tmp/wait.yaml <<'YAML'
          app:
            id: sales
            title: 販売管理
            pages:
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                key: orderNo
                search:
                  filters: [{ field: orderNo, label: 受注番号 }]
                table:
                  pagination: { pageSize: 500 }
                  columns: [{ field: orderNo, label: 受注番号, sortable: true }]
                actions:
                  - id: approve
                    type: plugin
                    plugin: approveOrders
                    label: 一括承認
                    scope: selection
                    roles: [staff, manager]
                    maxRows: { default: 200, byRole: { manager: 400 } }
                    confirm: { message: '{count} 件を承認します' }
                    onError: { message: '{failed} 件は承認できませんでした' }
          YAML
          # 1. 棚卸しには**役割ごとの件数**が出る。区切りが無いことも、そう言う
          #    （上限も区切りも役割で変わるので、役割から引けないとボタンごとに定義を開く）。
          node dist/cli.js explain /tmp/wait.yaml --roles > /tmp/wait-roles.log
          grep -q '一括「一括承認」（order_search） … 1回 400 件まで・区切りなし（1回で 400 件を渡す）' \
            /tmp/wait-roles.log
          grep -q '1回 200 件まで・区切りなし' /tmp/wait-roles.log
          grep -q '進み具合も残り時間も出ず' /tmp/wait-roles.log
          # 2. 待たせるのに区切りが無い＝**助言**（好みなので終了コードは 0 のまま）。
          node dist/cli.js advise /tmp/wait.yaml > /tmp/wait-advice.log
          grep -q 'bulk-without-batchsize' /tmp/wait-advice.log
          grep -q '1回で最大 400 件動きます' /tmp/wait-advice.log
          grep -q '途中で止めることもできません' /tmp/wait-advice.log
          # 書く件数の下書きは、1回で動く件数から出す（根拠も添える）。
          grep -q '値の下書き: 80' /tmp/wait-advice.log
          grep -q '400 件）を5回に分ける件数から' /tmp/wait-advice.log
          # 3. 下書きは**そのまま当てられる**。
          node dist/cli.js advise /tmp/wait.yaml --json > /tmp/wait-advice.json
          node -e '
            const fs = require("fs");
            const advice = JSON.parse(fs.readFileSync("/tmp/wait-advice.json", "utf8"));
            const picks = advice
              .filter((one) => one.rule === "bulk-without-batchsize")
              .map((one) => ({ rule: one.rule, where: one.where, value: one.draft }));
            if (picks.length !== 1) {
              console.error("区切りの助言が1件ではない: " + picks.length);
              process.exit(1);
            }
            fs.writeFileSync("/tmp/wait-picks.json", JSON.stringify(picks));
          '
          node dist/cli.js advise /tmp/wait.yaml --apply /tmp/wait-picks.json --write \
            > /tmp/wait-applied.log
          grep -q 'batchSize: 80' /tmp/wait.yaml
          node dist/cli.js validate --strict --warn-as-error /tmp/wait.yaml
          # 当てたら、その助言は消える（言うだけ言って直せない助言を残さない）。
          node dist/cli.js advise /tmp/wait.yaml --json > /tmp/wait-advice2.json
          if grep -q 'bulk-without-batchsize' /tmp/wait-advice2.json; then
            echo "当てたのに助言が残っている"; exit 1
          fi
          # 4. 読み返しは「**何回に分かれるか**」まで言う（サーバを何回叩くか）。
          node dist/cli.js explain /tmp/wait.yaml --page order_search > /tmp/wait-explain.log
          grep -q '80 件ずつ実行する（進み具合が出て、区切りで止められる）' /tmp/wait-explain.log
          grep -q '上限まで選ぶと 3 回に分かれる' /tmp/wait-explain.log
          # 棚卸しも、当てたあとは件数と回数で出る（役割ごとに違う）。
          node dist/cli.js explain /tmp/wait.yaml --roles > /tmp/wait-roles2.log
          grep -q '1回 400 件まで・80 件ずつ（上限まで選ぶと 5 回に分かれる）' /tmp/wait-roles2.log
          grep -q '1回 200 件まで・80 件ずつ（上限まで選ぶと 3 回に分かれる）' /tmp/wait-roles2.log

      - name: How screens open (single or side by side)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          cat > /tmp/tabs.yaml <<'YAML'
          app:
            id: shop
            title: 店
            navigation: tabs
            menu:
              - { id: c, label: 顧客, page: customers }
            pages:
              - type: search
                id: customers
                title: 顧客一覧
                repository: repo
                table:
                  columns: [{ field: code, label: コード }]
                  rowActions: [open, openTab]
                actions:
                  - { id: open, type: navigate, label: 詳細, page: customer_detail }
                  - { id: openTab, type: navigate, label: 別タブ, page: customer_detail, open: tab }
              - type: detail
                id: customer_detail
                title: 顧客詳細
                repository: repo
                form: { sections: [{ fields: [{ field: code, label: コード }] }] }
          YAML
          # 1. 並べて開く定義は警告ゼロで通る（strict でも）。
          node dist/cli.js validate --strict --warn-as-error /tmp/tabs.yaml
          # 2. どう開くかを読み返す（上限も、アプリ側で上書きできることも言う）。
          node dist/cli.js explain /tmp/tabs.yaml > /tmp/tabs.log
          grep -q '## 画面の開き方' /tmp/tabs.log
          grep -q '並べて開く（メニューで選ぶと新しいタブ・同じ画面は2枚開かない・最大 10 枚）' /tmp/tabs.log
          grep -q 'アプリ側で上書きできます' /tmp/tabs.log
          # 別のタブで開くボタンは、そう読み返す（既定のボタンには何も足さない）。
          node dist/cli.js explain /tmp/tabs.yaml --page customers > /tmp/tabs-page.log
          grep -q '別タブ … 別の画面へ移る（customer_detail へ）。別のタブで開く' /tmp/tabs-page.log
          # 3. 並べない定義に `open: tab` を書いたら、効かないと言う。
          sed '/  navigation: tabs/d' /tmp/tabs.yaml > /tmp/single.yaml
          if node dist/cli.js validate --warn-as-error --json /tmp/single.yaml \
               > /tmp/single.json 2>&1; then
            echo "効かない open: tab で通ってしまった"; exit 1
          fi
          grep -q 'open-without-tabs' /tmp/single.json
          # 知らない値は黙って既定になるので、そう言う。
          sed 's/  navigation: tabs/  navigation: split/' /tmp/tabs.yaml > /tmp/bad.yaml
          if node dist/cli.js validate --warn-as-error --json /tmp/bad.yaml \
               > /tmp/bad.json 2>&1; then
            echo "知らない開き方で通ってしまった"; exit 1
          fi
          grep -q 'unknown-navigation' /tmp/bad.json
          # 4. 開き方が変わったら、そう言う（使い方が変わるので caution）。
          node dist/cli.js diff /tmp/single.yaml /tmp/tabs.yaml --json > /tmp/tabs-diff.json
          grep -q 'navigation-changed' /tmp/tabs-diff.json
          # 5. 読み返しの「最大 N 枚」と Renderer の上限は**同じ数**（ずれたら嘘になる）。
          node -e '
            const fs = require("fs");
            const dart = fs.readFileSync(
              "../flutter/packages/hatake/lib/src/runtime/hatake_router.dart", "utf8");
            const ts = fs.readFileSync("src/explain.ts", "utf8");
            const a = /maxTabs = (\d+)/.exec(dart);
            const b = /MAX_TABS = (\d+)/.exec(ts);
            if (a === null || b === null || a[1] !== b[1]) {
              console.error("タブの上限がずれています: " + (a && a[1]) + " / " + (b && b[1]));
              process.exit(1);
            }
          '
          # デモも並べて開く（動かすと試せる）。行からの遷移は既定＝同じタブの続き。
          grep -q 'navigation: tabs' "$DEMO"
          grep -q 'open: tab' "$DEMO"

      - name: When a button may be pressed (enabledWhen)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # 定義に増えたキーは1つだが、道具の側では4つ言うことがある。
          # ここでは**同じ定義**に対して4つ全部が言えることを見る。
          cat > /tmp/enabled.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              rowActions: [openEntry]
              columns:
                - { field: orderNo, label: 受注番号 }
                - { field: status, label: 状態 }
            actions:
              - id: openEntry
                type: navigate
                label: 明細編集
                page: order_entry
                enabledWhen: { field: status, operator: notEquals, value: 出荷済 }
          YAML
          # 1. 行アクションに書いた条件は効く（警告ゼロ）。
          node dist/cli.js validate --warn-as-error /tmp/enabled.yaml
          # 2. いつ押せるのかを読み返す（業務の言葉で）。
          node dist/cli.js explain /tmp/enabled.yaml > /tmp/enabled.log
          grep -q '押せるのは 状態 が 出荷済 でないとき だけ' /tmp/enabled.log
          # 3. 判定する相手が無い所に書いたら言う（ボタンは出て押せる＝黙って効かない）。
          cat > /tmp/enabled-bad.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - id: csv
                type: export
                label: CSV出力
                enabledWhen: { field: status, operator: equals, value: 未出荷 }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/enabled-bad.yaml \
               > /tmp/enabled-bad.json 2>&1; then
            echo "効かない所に書いたのに通ってしまった"; exit 1
          fi
          grep -q 'enabledwhen-without-record' /tmp/enabled-bad.json
          # 4. 押せる条件が変わったら言う（現場の手が止まる/止まらなくなる変化）。
          sed '/enabledWhen/d' /tmp/enabled.yaml > /tmp/enabled-before.yaml
          node dist/cli.js diff /tmp/enabled-before.yaml /tmp/enabled.yaml \
            > /tmp/enabled-diff.log
          grep -q '押せる条件」が付きました' /tmp/enabled-diff.log
          # デモにも入れてある（出荷済の受注は明細を直せない）。
          grep -q 'enabledWhen' "$DEMO"
          node dist/cli.js explain "$DEMO" --page order_search > /tmp/demo-enabled.log
          grep -q '押せるのは 状態 が 出荷済 でないとき だけ' /tmp/demo-enabled.log

      - name: Buttons that do nothing when pressed
        working-directory: typescript
        run: |
          set -e
          # 「定義は通り、ボタンも出て、押すまで気づけない」を全部言えること。
          # 表（actionNeeds.ts）から規則を作っているので、ここでは**7種類ぶんの
          # 出口**が本当に出るかを1枚で確かめる。
          cat > /tmp/dead.yaml <<'YAML'
          app:
            id: dead_check
            title: 空振り
            menu:
              - { id: entry, label: 入力, page: order_entry }
              - { id: search, label: 照会, page: order_search }
            pages:
              - type: form
                id: order_entry
                title: 受注入力
                repository: orderRepository
                form:
                  sections: [{ fields: [{ field: name, label: 氏名 }] }]
                actions:
                  - { id: create, type: create, label: 新規登録 }
                  - { id: csv, type: export, label: CSV出力 }
                  - { id: print, type: print, label: 印刷 }
                  - { id: delete, type: delete, label: 削除 }
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                key: orderNo
                table:
                  rowActions: [edit]
                  columns: [{ field: orderNo, label: 受注番号 }]
                actions:
                  - { id: approve, type: plugin, label: 承認 }
                  - { id: again, type: navigate, label: もう一度, page: order_search }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/dead.yaml                > /tmp/dead.json 2>&1; then
            echo "空振りするボタンだらけなのに通ってしまった"; exit 1
          fi
          node dist/cli.js validate /tmp/dead.yaml > /tmp/dead.log 2>&1 || true
          for rule in create-action-unusable export-without-rows print-without-report \
              row-declaration-unused plugin-without-name navigate-to-self \
              builtin-rowaction-unsupported; do
            grep -q "$rule" /tmp/dead.json || {
              echo "$rule が出ていない"; cat /tmp/dead.json; exit 1; }
          done
          # 押した人に何が起きるかまで書いてあること（規則名だけでは直せない）。
          grep -q '押しても何も起きません' /tmp/dead.log
          grep -q 'もう1枚開くだけ' /tmp/dead.log
          # 効いている形（行の削除の言い方を業務の言葉にする書き方）では黙ること。
          cat > /tmp/alive.yaml <<'YAML'
          page:
            type: crud
            id: customer_master
            title: 顧客マスタ
            repository: customerRepository
            key: id
            table:
              rowActions: [edit, delete]
              columns: [{ field: id, label: ID }]
            form:
              sections: [{ fields: [{ field: name, label: 氏名 }] }]
            actions:
              - id: delete
                type: delete
                label: 削除
                confirm: { message: 消しますか, danger: true }
          YAML
          node dist/cli.js validate --warn-as-error /tmp/alive.yaml
          # 一括のボタンを行に並べた形。行のボタンは**押した行**に実行するので、
          # 並べると押した行ではなくチェックした行に実行することになる（何も選んで
          # いなければ何も起きない）。
          cat > /tmp/rowbulk.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              rowActions: [approve]
              columns: [{ field: orderNo, label: 受注番号 }]
            actions:
              - { id: approve, type: plugin, plugin: approveOrders, label: 一括承認, scope: selection }
          YAML
          if node dist/cli.js validate --warn-as-error --json /tmp/rowbulk.yaml \
               > /tmp/rowbulk.json 2>&1; then
            echo "行に並べた一括で通ってしまった"; exit 1
          fi
          grep -q 'selection-as-rowaction' /tmp/rowbulk.json
          # 読み返しも同じことを言う（並べてあるからと「行に出る」とは書かない）。
          node dist/cli.js explain /tmp/rowbulk.yaml > /tmp/rowbulk.log
          grep -q '一括承認（行には出ない：選んだ行に実行するボタン）' /tmp/rowbulk.log
          # 行から外せば通る（一覧の上の一括ボタンとして出る）。
          grep -v 'rowActions: \[approve\]' /tmp/rowbulk.yaml > /tmp/rowfix.yaml
          node dist/cli.js validate --warn-as-error /tmp/rowfix.yaml
          # 空振りは**直し方の実例**からも引ける（規則名で引いて、直した形まで出る）。
          for rule in export-without-rows plugin-without-name navigate-to-self \
              row-declaration-unused builtin-rowaction-unsupported \
              selection-as-rowaction; do
            node dist/cli.js failures "$rule" > /tmp/failure.log
            grep -q 'なぜそう書くか' /tmp/failure.log || {
              echo "$rule の実例が引けない"; cat /tmp/failure.log; exit 1; }
            grep -q '直したもの' /tmp/failure.log || {
              echo "$rule の実例に直した形が無い"; exit 1; }
          done

      - name: A definition compared with itself is compatible
        working-directory: typescript
        run: |
          set -e
          # diff の判定が壊れていれば、同じ定義同士でも差分が出る。
          for f in ../spec/examples/customer_master.yaml ../spec/examples/order_entry.yaml; do
            node dist/cli.js diff "$f" "$f"
          done

      - name: MCP server answers a stdio handshake
        working-directory: typescript
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hatake_validate","arguments":{"source":"page: {type: crud, id: x, title: X, repository: xRepository}"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"hatake_advise","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: a, label: A}]}}"}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"hatake_apply_advice","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: amount, label: A}]}}","picks":[{"rule":"money-without-format"}]}}}' \
            '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"hatake_explain","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: a, label: A, roles: [manager]}]}}","roles":true}}}' \
            | node dist/mcp.js > /tmp/mcp.log
          # 通知には返事をしない = 7 送って 6 行。stdout に他のものを書いていないことも見る。
          test "$(wc -l < /tmp/mcp.log)" -eq 6
          # 役割名は定義から引ける（想像で書かせない）。
          grep -q '出てくる役割' /tmp/mcp.log
          grep -q 'manager' /tmp/mcp.log
          grep -q '"protocolVersion":"2025-06-18"' /tmp/mcp.log
          grep -q 'hatake_reference' /tmp/mcp.log
          grep -q 'crud' /tmp/mcp.log
          # 助言も道具として引ける（書いていない所は検証に出てこないので）。
          grep -q 'hatake_advise' /tmp/mcp.log
          grep -q 'no-search-filter' /tmp/mcp.log
          # 助言であって警告ではない、を毎回渡す（AI が混同すると定義を壊しに行く）。
          grep -q '警告ではありません' /tmp/mcp.log
          # 選んだ助言はその場に書き込める（AI が手で YAML を書き足すと転ぶ所）。
          grep -q 'hatake_apply_advice' /tmp/mcp.log
          grep -q 'format: currency' /tmp/mcp.log
          # 当てた所は**画面の言葉**でも返る（道の書き方では人がレビューできない）。
          grep -q 'changed' /tmp/mcp.log

      - name: Scaffolds are valid definitions
        working-directory: typescript
        run: |
          set -e
          mkdir -p /tmp/scaffold
          for kind in crud search master detail form wizard dashboard report; do
            node dist/cli.js new "$kind" --id "demo_$kind" --title デモ \
              --out "/tmp/scaffold/$kind.yaml"
          done
          # 警告ゼロで通ること（**警告として**落ちる形にする＝雛形が助言の出る定義を
          # 増やさないように）。
          node dist/cli.js validate --warn-as-error /tmp/scaffold/*.yaml
          # 助言もゼロ。AI は雛形を写すので、雛形に足りない所があると写した時点から
          # 「書いたあとに直す」が始まる（一番よく通る道なので、ここが一番効く）。
          for f in /tmp/scaffold/*.yaml; do
            node dist/cli.js advise "$f" > /tmp/scaffold-advise.log
            grep -q '書き足したほうがいい所は見つかりませんでした' /tmp/scaffold-advise.log || {
              echo "雛形に助言が出た: $f"; cat /tmp/scaffold-advise.log; exit 1; }
          done
          # 業務で決める値は TODO_ で置いてある（埋め忘れが画面に出る側に倒す）。
          grep -q 'roles: \[TODO_role\]' /tmp/scaffold/crud.yaml
      - name: Scaffolds pass the JSON Schema too
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml
          python spec/tools/validate_schema.py /tmp/scaffold/*.yaml

  java:
    name: Java edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (incl. conformance)
        working-directory: java
        run: gradle test

  schema:
    name: DSL schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example definitions against the schema
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml openapi-spec-validator
          python spec/tools/validate_schema.py
          # 資料の絵の元になっている定義も、スキーマで見る（絵だけ通って定義が腐るのを防ぐ）。
          python spec/tools/validate_schema.py docs/diagrams/roles-app.yaml
      - name: Charset tables are up to date
        run: |
          set -e
          # 生成物（変換表とフィクスチャ）が、生成器と同じ内容であること。
          python flutter/packages/hatake_encoding/tool/generate_tables.py
          git diff --exit-code -- flutter/packages/hatake_encoding/lib/src/tables \
            spec/conformance/charset.json

      - name: The sample report PDF is a PDF (read by another library)
        run: |
          pip install --quiet pypdf
          # hatake_print は PDF を自分で書いている。自前のテストは「自分と自分が
          # 合っている」ことしか言えないので、他人の実装で読み返す。
          python spec/tools/check_report_pdf.py

      - name: Check the DTO emitter's JSON Schema output
        run: python spec/tools/check_dto_schema.py
      - name: Check the DTO emitter's OpenAPI output
        run: python spec/tools/check_openapi.py

  publish-dry-run:
    name: pub publish (dry run)
    runs-on: ubuntu-latest
    needs: [dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Only the dependency-free leaf can dry-run before the others are on
      # pub.dev; downstream packages resolve their hosted constraints only
      # after hatake_core is published.
      - name: hatake_core publish dry-run
        run: cd flutter/packages/hatake_core && dart pub get && dart pub publish --dry-run
