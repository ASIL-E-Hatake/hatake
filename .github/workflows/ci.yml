      - name: The tutorial's definition and its output are real
        working-directory: typescript
        run: |
          set -e
          # チュートリアル（docs/tutorial.ja.md）に載せた定義を**そのまま**取り出して通す。
          # 手引きの定義が腐ると、最初の30分で必ず転ぶ（一番まずい所）。
          python3 - <<'PY' > /tmp/tutorial.yaml
          import io, re
          text = io.open("../docs/tutorial.ja.md", encoding="utf-8").read()
          blocks = re.findall(r"```yaml\n(.*?)```", text, re.S)
          # 通しで作る定義（明細の縦計を持つ1枚）。
          found = [b for b in blocks if "consumptionTax" in b]
          assert len(found) == 1, "定義の塊が1つに決まらない: %d" % len(found)
          io.open("/dev/stdout", "w", encoding="utf-8").write(found[0])
          PY
          # 警告ゼロで通ること（チュートリアルの完成形なので、警告が出ていたら嘘）。
          node dist/cli.js validate --warn-as-error /tmp/tutorial.yaml
          # 載せた説明の文が、実際にその通り出ること（言い方を直したら手引きも直す）。
          node dist/cli.js explain /tmp/tutorial.yaml > /tmp/tutorial.log
          grep -q '請求先 … 区分 が 法人 のときだけ必須' /tmp/tutorial.log
          grep -q '得意先 … 選択、必須、選択肢は customerRepository から引く' /tmp/tutorial.log
          grep -q '1行は 品名・数量・単価・金額' /tmp/tutorial.log
          # ボタンを書いていないので「できる操作」の節は出ない（手引きがそう書いている）。
          if grep -q '## できる操作' /tmp/tutorial.log; then
            echo "手引きの説明と実際の出力が食い違っている"; exit 1
          fi
          # 外に要求しているもの（手引きが「ここに出てくる」と書いている2つ）。
          node dist/cli.js refs /tmp/tutorial.yaml --needs-registration > /tmp/tutorial.refs
          grep -q 'consumptionTax' /tmp/tutorial.refs
          # 組み込みの計算（sum / product / count）は「登録が要る」に出てこない。
          # 名前まるごとで見る（`consumptionTax` に sum が入っているので部分一致は誤検出）。
          if grep -qE '^  (sum|product|count) ' /tmp/tutorial.refs; then
            echo "組み込みの計算が「登録が要る」に混ざっている"; exit 1
          fi
          # 手引きが載せている配線の下書きも、実際にその形で出ること。
          node dist/cli.js wire /tmp/tutorial.yaml --base /api > /tmp/tutorial.dart 2>/dev/null
          grep -q "'customerRepository': 'customers'," /tmp/tutorial.dart
          grep -q "'consumptionTax': (computed, record) =>" /tmp/tutorial.dart

      - name: The PR-comment snippet in the guide actually runs
        working-directory: typescript
        run: |
          set -e
          # 手引き（docs/guide/pr-comment.ja.md）に載せた Actions の断片を**そのまま**走らせる。
          # 文書に載せたコマンドは、動かさないと必ず腐る（貼った人の所で初めて落ちる）。
          pip install --quiet pyyaml
          python3 - <<'PY' > /tmp/snippet.sh
          import io, yaml, re
          text = io.open("../docs/guide/pr-comment.ja.md", encoding="utf-8").read()
          block = re.search(r"```yaml\n(.*?)```", text, re.S).group(1)
          steps = yaml.safe_load(block)["jobs"]["explain"]["steps"]
          run = next(s["run"] for s in steps if s.get("id") == "explain")
          io.open("/dev/stdout", "w", encoding="utf-8").write(run)
          PY
          # 定義を1枚持つ git の履歴を作る（本物の枝分かれと本物の変更）。
          rm -rf /tmp/pr && mkdir -p /tmp/pr/definitions && cd /tmp/pr
          git init -q . && git config user.email ci@example.com && git config user.name CI
          cat > definitions/order.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns: [{ field: orderNo, label: 受注番号 }]
          YAML
          git add -A && git commit -qm before
          BASE=$(git rev-parse HEAD)
          # 画面の見え方が変わる修正（列を1本足す）。
          cat > definitions/order.yaml <<'YAML'
          page:
            type: search
            id: order_search
            title: 受注照会
            repository: orderRepository
            key: orderNo
            table:
              columns:
                - { field: orderNo, label: 受注番号 }
                - { field: amount, label: 金額, type: number }
          YAML
          git add -A && git commit -qm after
          export PATH="$GITHUB_WORKSPACE/typescript/node_modules/.bin:$PATH"
          alias npx=true
          # 断片の中の `npx hatake` を、いまビルドした CLI に向ける。
          sed "s#npx hatake#node $GITHUB_WORKSPACE/typescript/dist/cli.js#g" /tmp/snippet.sh > run.sh
          BASE="$BASE" DEFS=definitions GITHUB_OUTPUT=/tmp/out.txt bash run.sh
          grep -q 'changed=true' /tmp/out.txt
          grep -q 'definitions/order.yaml' body.md
          grep -q '金額' body.md
          # 見え方が変わらない修正（キーの並べ替え）では**貼らない**。
          BASE=$(git rev-parse HEAD)
          cat > definitions/order.yaml <<'YAML'
          page:
            id: order_search
            type: search
            repository: orderRepository
            title: 受注照会
            key: orderNo
            table:
              columns:
                - { label: 受注番号, field: orderNo }
                - { type: number, field: amount, label: 金額 }
          YAML
          git add -A && git commit -qm reorder
          BASE="$BASE" DEFS=definitions GITHUB_OUTPUT=/tmp/out2.txt bash run.sh
          grep -q 'changed=false' /tmp/out2.txt
          [ ! -s body.md ]

      - name: Reading the definition back in English (explain --lang en)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          node dist/cli.js explain "$DEMO" --lang en > /tmp/en.log
          # 節の見出しと言い回しは英語。
          grep -q '^## Screens' /tmp/en.log
          grep -q '^## Who can open which screen' /tmp/en.log
          grep -q 'an app of' /tmp/en.log
          # **定義に書いてあるラベルは訳さない**（業務の言葉なので、訳すと別のものを指す）。
          grep -q '受注照会' /tmp/en.log
          # 日本語は1文字も変わらない（既定は ja）。
          node dist/cli.js explain "$DEMO" > /tmp/ja.log
          grep -q '^## 画面' /tmp/ja.log
          grep -q '枚の画面をメニューで束ねたアプリ' /tmp/ja.log
          # 1枚ぶんも英語で出る（項目の注記まで）。
          node dist/cli.js explain "$DEMO" --page order_entry --lang en > /tmp/en1.log
          grep -q '^## What can be done' /tmp/en1.log
          grep -q 'required' /tmp/en1.log
          # 知らない言語は黙って日本語にしない。
          if node dist/cli.js explain "$DEMO" --lang fr > /tmp/fr.log 2>&1; then
            echo "知らない言語を通してしまった"; exit 1
          fi
          grep -q 'ja か en' /tmp/fr.log
          # まだ英語にできない道具では、半分だけ英語にせず落ちる。
          if node dist/cli.js explain "$DEMO" --review --lang en > /tmp/rev.log 2>&1; then
            echo "英語にできない道具で通してしまった"; exit 1
          fi
          grep -q '説明' /tmp/rev.log

      - name: Hitting the API the definition declares (probe / attack)
        working-directory: typescript
        run: |
          set -e
          DEMO=../flutter/packages/hatake_example/assets/sales_app.yaml
          # 叩く前に「何を叩くか」が出ること（--dry-run は送らないので、この段は
          # サーバが無くても回る＝本物のデモ定義に対して毎回確かめられる）。
          node dist/cli.js probe "$DEMO" --base http://127.0.0.1:8099/api             --dry-run > /tmp/probe-dry.log
          grep -q 'GET http://127.0.0.1:8099/api/orders?page=0&pageSize=' /tmp/probe-dry.log
          grep -q '送っていません' /tmp/probe-dry.log
          # 繋がらないなら、繋がらないと言って落ちる（黙って「食い違い無し」にしない）。
          if node dist/cli.js probe "$DEMO" --base http://127.0.0.1:9/api               > /tmp/probe-dead.log; then
            echo "繋がらないのに通ってしまった"; exit 1
          fi
          grep -q '叩けませんでした' /tmp/probe-dead.log
          # ここから先は**本物の通信**。わざと食い違ったサーバを立てる
          # （偽の送信器を差し替えた試験では、fetch そのものは通らない）。
          cat > /tmp/stub-api.mjs <<'JS'
          import { writeFileSync } from "node:fs";
          import { createServer } from "node:http";
          const json = (res, status, body) => {
            res.writeHead(status, { "content-type": "application/json" });
            res.end(JSON.stringify(body));
          };
          createServer((req, res) => {
            if (req.method !== "GET") {
              // 読むだけ、を**サーバ側から**縛る。1回でも来たら試験を落とす。
              writeFileSync("/tmp/stub-write-attempt", req.method);
              return json(res, 405, { message: "read-only stub" });
            }
            const path = req.url.split("?")[0];
            const staff = req.headers.authorization === "Bearer staff";
            if (path === "/api/orders") {
              // 金額を**文字で**返す（BigDecimal を文字列で出す実装。画面では
              // 桁区切りも合計も静かに効かなくなる）。
              return json(res, 200, {
                items: [{ orderNo: "SO-1", amount: "1200" }],
                totalCount: 1,
              });
            }
            if (path === "/api/prices") {
              // 資格を渡したときだけ遮断する（渡さなければ穴のまま）。
              return staff
                ? json(res, 403, { message: "forbidden" })
                : json(res, 200, { items: [{ itemCode: "A-1" }], totalCount: 1 });
            }
            if (path === "/api/prices/A-1") return json(res, 200, { itemCode: "A-1" });
            return json(res, 404, { message: "no route" });
          }).listen(8099, "127.0.0.1");
          JS
          cat > /tmp/probe-app.yaml <<'YAML'
          app:
            id: probe_check
            title: 突き合わせ
            menu:
              - { id: orders, label: 受注, page: order_search }
              - { id: prices, label: 単価マスタ, page: price_master, roles: [admin] }
            pages:
              - type: search
                id: order_search
                title: 受注照会
                repository: orderRepository
                key: orderNo
                table:
                  pagination: { pageSize: 2 }
                  columns:
                    - { field: orderNo, label: 受注番号 }
                    - { field: amount, label: 金額, type: number, format: currency }
              - type: master
                id: price_master
                title: 単価マスタ
                repository: priceRepository
                key: itemCode
                table:
                  columns: [{ field: itemCode, label: 品目 }]
                form:
                  sections: [{ fields: [{ field: itemCode, label: 品目 }] }]
          YAML
          rm -f /tmp/stub-write-attempt
          node /tmp/stub-api.mjs & STUB=$!
          trap 'kill $STUB' EXIT
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused             http://127.0.0.1:8099/api/orders > /dev/null
          # 静かに壊れる食い違い（金額が文字）を捕まえて落ちること。
          if node dist/cli.js probe /tmp/probe-app.yaml               --base http://127.0.0.1:8099/api > /tmp/probe.log; then
            echo "食い違いがあるのに通ってしまった"; exit 1
          fi
          grep -q 'number の約束ですが string で返っています' /tmp/probe.log
          grep -q '合計' /tmp/probe.log
          # 権限: 見えない画面の口が開いていたら落ちる。
          if node dist/cli.js attack /tmp/probe-app.yaml --role staff               --base http://127.0.0.1:8099/api > /tmp/attack.log; then
            echo "穴があるのに通ってしまった"; exit 1
          fi
          grep -q 'API が遮断していません' /tmp/attack.log
          # 遮断されていれば通ること（同じサーバ・同じ定義で、資格だけが違う）。
          node dist/cli.js attack /tmp/probe-app.yaml --role staff --token staff             --base http://127.0.0.1:8099/api > /tmp/attack-ok.log
          grep -q '見えない口は拒否されました' /tmp/attack-ok.log

          # 役割ぜんぶ＋誰でもない人を1枚に。**資格は役割ごと**に渡す
          # （1つの資格で他の役割を判定すると、200 が穴なのか正しいのか区別できない）。
          cat > /tmp/accounts.json <<'JSON'
          {
            "$comment": "役割ごとの資格。誰でもない人は資格を送らないので書かない。",
            "accounts": {
              "admin": { "token": "admin" },
              "staff": { "token": "staff" }
            }
          }
          JSON
          # 送る前に、何を叩くかが役割ごとに出ること。
          node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
            --accounts /tmp/accounts.json --base http://127.0.0.1:8099/api \
            --dry-run > /tmp/sweep-dry.log
          grep -q '誰でもない人（資格なし）' /tmp/sweep-dry.log
          # このスタブは「資格を渡したときだけ遮断する」ので、**ログインしていない人に
          # 単価マスタが見えている**＝穴として出る（役割ごとには ok に見えるやつ）。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --accounts /tmp/accounts.json --base http://127.0.0.1:8099/api \
               > /tmp/sweep.log; then
            echo "誰でもない人に見えているのに通ってしまった"; exit 1
          fi
          grep -q 'staff=ok' /tmp/sweep.log
          grep -q '誰でもない人=穴' /tmp/sweep.log
          # 1つの資格で全部を判定するのは断る（読み替えは嘘になるので）。
          if node dist/cli.js attack /tmp/probe-app.yaml --all-roles \
               --accounts /tmp/accounts.json --token staff \
               --base http://127.0.0.1:8099/api > /tmp/sweep-bad.log 2>&1; then
            echo "1つの資格で役割ぜんぶを判定してしまった"; exit 1
          fi
          grep -q '役割ごとに渡します' /tmp/sweep-bad.log
          # ここまでで、書き込む方式は1回も飛んでいないこと。
          if [ -f /tmp/stub-write-attempt ]; then
            echo "読むだけの道具が $(cat /tmp/stub-write-attempt) を送った"; exit 1
          fi

      - name: A definition compared with itself is compatible
        working-directory: typescript
        run: |
          set -e
          # diff の判定が壊れていれば、同じ定義同士でも差分が出る。
          for f in ../spec/examples/customer_master.yaml ../spec/examples/order_entry.yaml; do
            node dist/cli.js diff "$f" "$f"
          done

      - name: MCP server answers a stdio handshake
        working-directory: typescript
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hatake_validate","arguments":{"source":"page: {type: crud, id: x, title: X, repository: xRepository}"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"hatake_advise","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: a, label: A}]}}"}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"hatake_apply_advice","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: amount, label: A}]}}","picks":[{"rule":"money-without-format"}]}}}' \
            '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"hatake_explain","arguments":{"source":"page: {type: search, id: s, title: S, repository: r, table: {columns: [{field: a, label: A, roles: [manager]}]}}","roles":true}}}' \
            | node dist/mcp.js > /tmp/mcp.log
          # 通知には返事をしない = 7 送って 6 行。stdout に他のものを書いていないことも見る。
          test "$(wc -l < /tmp/mcp.log)" -eq 6
          # 役割名は定義から引ける（想像で書かせない）。
          grep -q '出てくる役割' /tmp/mcp.log
          grep -q 'manager' /tmp/mcp.log
          grep -q '"protocolVersion":"2025-06-18"' /tmp/mcp.log
          grep -q 'hatake_reference' /tmp/mcp.log
          grep -q 'crud' /tmp/mcp.log
          # 助言も道具として引ける（書いていない所は検証に出てこないので）。
          grep -q 'hatake_advise' /tmp/mcp.log
          grep -q 'no-search-filter' /tmp/mcp.log
          # 助言であって警告ではない、を毎回渡す（AI が混同すると定義を壊しに行く）。
          grep -q '警告ではありません' /tmp/mcp.log
          # 選んだ助言はその場に書き込める（AI が手で YAML を書き足すと転ぶ所）。
          grep -q 'hatake_apply_advice' /tmp/mcp.log
          grep -q 'format: currency' /tmp/mcp.log
          # 当てた所は**画面の言葉**でも返る（道の書き方では人がレビューできない）。
          grep -q 'changed' /tmp/mcp.log

      - name: Scaffolds are valid definitions
        working-directory: typescript
        run: |
          set -e
          mkdir -p /tmp/scaffold
          for kind in crud search master detail form wizard dashboard report; do
            node dist/cli.js new "$kind" --id "demo_$kind" --title デモ \
              --out "/tmp/scaffold/$kind.yaml"
          done
          node dist/cli.js validate /tmp/scaffold/*.yaml
      - name: Scaffolds pass the JSON Schema too
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml
          python spec/tools/validate_schema.py /tmp/scaffold/*.yaml

  java:
    name: Java edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (incl. conformance)
        working-directory: java
        run: gradle test

  schema:
    name: DSL schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example definitions against the schema
        run: |
          pip install --quiet 'jsonschema[format]' pyyaml openapi-spec-validator
          python spec/tools/validate_schema.py
          # 資料の絵の元になっている定義も、スキーマで見る（絵だけ通って定義が腐るのを防ぐ）。
          python spec/tools/validate_schema.py docs/diagrams/roles-app.yaml
      - name: Charset tables are up to date
        run: |
          set -e
          # 生成物（変換表とフィクスチャ）が、生成器と同じ内容であること。
          python flutter/packages/hatake_encoding/tool/generate_tables.py
          git diff --exit-code -- flutter/packages/hatake_encoding/lib/src/tables \
            spec/conformance/charset.json

      - name: The sample report PDF is a PDF (read by another library)
        run: |
          pip install --quiet pypdf
          # hatake_print は PDF を自分で書いている。自前のテストは「自分と自分が
          # 合っている」ことしか言えないので、他人の実装で読み返す。
          python spec/tools/check_report_pdf.py

      - name: Check the DTO emitter's JSON Schema output
        run: python spec/tools/check_dto_schema.py
      - name: Check the DTO emitter's OpenAPI output
        run: python spec/tools/check_openapi.py

  publish-dry-run:
    name: pub publish (dry run)
    runs-on: ubuntu-latest
    needs: [dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Only the dependency-free leaf can dry-run before the others are on
      # pub.dev; downstream packages resolve their hosted constraints only
      # after hatake_core is published.
      - name: hatake_core publish dry-run
        run: cd flutter/packages/hatake_core && dart pub get && dart pub publish --dry-run
