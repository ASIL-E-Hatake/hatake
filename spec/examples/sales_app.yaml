# 複数ページを束ねたアプリ定義の例（メニュー＋画面遷移）。
# 受注照会は複数条件検索、受注入力は親子・明細（type: subTable）のショーケース。
# 受注入力は2種類あり、明細を親レコードに埋め込む版と別 Repository から引く版（source）。
dsl_version: "1.0"
app:
  id: sales_admin
  title: 販売管理
  home: customers
  menu:
    - { id: customers, label: 顧客, icon: people, page: customer_master }
    - group: マスタ
      items:
        - { label: 商品, icon: inventory, page: product_master }
    - { id: orders, label: 受注照会, icon: list, page: order_search }
    - { id: orderEntry, label: 受注入力, icon: dashboard, page: order_entry }
    - { id: orderEntryPaged, label: 受注入力（明細別テーブル）, icon: table_rows, page: order_entry_paged }
  pages:
    - type: master
      id: customer_master
      title: 顧客マスタ
      repository: customerRepository
      key: id
      search:
        filters:
          - { field: name, label: 顧客名, type: text, operator: contains }
      table:
        rowActions: [edit, delete]
        columns:
          - { field: code, label: コード, sortable: true, width: 140 }
          - { field: name, label: 顧客名, width: 220 }
      form:
        sections:
          - title: 基本情報
            fields:
              - { field: code, label: コード, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: name, label: 顧客名, type: text, required: true }
      actions:
        - { id: create, type: create, label: 新規登録 }

    - type: master
      id: product_master
      title: 商品マスタ
      repository: productRepository
      table:
        columns:
          - { field: code, label: コード, width: 140 }
          - { field: name, label: 商品名, width: 220 }
      form:
        sections:
          - fields:
              - { field: code, label: コード, required: true }
              - { field: name, label: 商品名, required: true }
      actions:
        - { id: create, type: create, label: 新規登録 }

    - type: search
      id: order_search
      title: 受注照会
      repository: orderRepository
      key: orderNo
      # 複数条件の検索。layout.columns で入力欄を2列に並べる。
      search:
        layout: { columns: 2 }
        filters:
          - { field: customer, label: 顧客名, type: text, operator: contains }
          - field: status
            label: 状態
            type: select
            operator: equals
            options:
              - { value: 未出荷, label: 未出荷 }
              - { value: 出荷済, label: 出荷済 }
          - { field: shipped, label: 出荷済, type: checkbox, operator: equals }
          # between は開始／終了の2入力になり、[開始, 終了] で渡る。
          - { field: orderDate, label: 受注日, type: date, operator: between }
      table:
        rowActions: [detail, openEntry]
        columns:
          - { field: orderNo, label: 受注番号, sortable: true, width: 160 }
          - { field: customer, label: 顧客, width: 200 }
          - { field: orderDate, label: 受注日, width: 140 }
          - { field: status, label: 状態, type: badge, width: 120 }
          - { field: amount, label: 金額, type: number, format: currency, config: { symbol: "¥" }, width: 140 }
      actions:
        # 行から詳細へ遷移。$row.no を詳細ページの key に渡す。
        - { id: detail, type: navigate, label: 詳細, page: order_detail, params: { id: "$row.orderNo" } }
        # 行から親子（ヘッダ＋明細）編集へ。
        - { id: openEntry, type: navigate, label: 明細編集, page: order_entry, params: { id: "$row.orderNo" } }

    - type: detail
      id: order_detail
      title: 受注詳細
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号 }
              - { field: customer, label: 顧客 }
              - { field: orderDate, label: 受注日 }
              - { field: status, label: 状態 }
              - { field: amount, label: 金額, format: currency, config: { symbol: "¥" } }

    # 親子・明細（master-detail）: ヘッダ＋明細行を1画面で入力し、まとめて保存する。
    - type: form
      id: order_entry
      title: 受注入力
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: customer, label: 顧客, type: text, required: true }
          - title: 明細
            fields:
              # この項目の値が子行の配列になる（type: subTable）。
              - field: lines
                label: 明細
                type: subTable
                columns:
                  - { field: item, label: 品名, width: 220 }
                  - { field: qty, label: 数量, type: number, width: 90 }
                  - { field: price, label: 単価, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                  - { field: amount, label: 金額, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                fields:
                  - { field: item, label: 品名, type: text, required: true }
                  - { field: qty, label: 数量, type: number, required: true, validators: [ { type: min, value: 1 } ] }
                  - { field: price, label: 単価, type: number, required: true, validators: [ { type: min, value: 0 } ] }
                  # 行内の計算項目: 金額 = 数量 × 単価
                  - { field: amount, label: 金額, computed: { op: product, fields: [qty, price] } }

    # 明細が大量にあるとき: 子行を別 Repository から外部キーで引き、ページングする
    # （subTable の source）。行は1件ずつ即時保存されるため、ヘッダの保存が先。
    - type: form
      id: order_entry_paged
      title: 受注入力（明細別テーブル）
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: customer, label: 顧客, type: text, required: true }
          - title: 明細
            fields:
              # 値は親レコードに入らない。行は orderLineRepository が持つ。
              - field: lines
                label: 明細
                type: subTable
                source:
                  repository: orderLineRepository
                  parentKey: orderNo   # 子行が持つ親キーの項目名
                  key: lineNo          # 子行の主キー項目名
                  pageSize: 10
                columns:
                  - { field: item, label: 品名, width: 220 }
                  - { field: qty, label: 数量, type: number, width: 90 }
                  - { field: price, label: 単価, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                  - { field: amount, label: 金額, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                fields:
                  - { field: item, label: 品名, type: text, required: true }
                  - { field: qty, label: 数量, type: number, required: true, validators: [ { type: min, value: 1 } ] }
                  - { field: price, label: 単価, type: number, required: true, validators: [ { type: min, value: 0 } ] }
                  # 行内の計算項目: 金額 = 数量 × 単価
                  - { field: amount, label: 金額, computed: { op: product, fields: [qty, price] } }
