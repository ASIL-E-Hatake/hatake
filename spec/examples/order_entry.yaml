dsl_version: "1.0"
# 親子・明細（master-detail）の例: 受注ヘッダ＋明細行を1画面で入力し、まとめて保存する。
page:
  type: form
  id: order_entry
  title: 受注入力
  repository: orderRepository
  key: orderNo
  form:
    sections:
      - title: 受注情報
        fields:
          - { field: orderNo, label: 受注番号, type: text, required: true, normalize: [toHankaku, trim] }
          - { field: customer, label: 顧客, type: text, required: true }
          - { field: orderDate, label: 受注日, type: date, required: true, format: date }
          - field: status
            label: 状態
            type: select
            required: true
            options:
              - { value: 未出荷, label: 未出荷 }
              - { value: 出荷済, label: 出荷済 }

      # セクション見出しは付けない: subTable 自身の label がグリッドの見出しになるため。
      - fields:
          # この項目の値が子行の配列になる。
          - field: lines
            label: 明細
            type: subTable
            columns:
              - { field: item, label: 品名, width: 220 }
              - { field: qty, label: 数量, type: number, width: 100 }
              - { field: price, label: 単価, type: number, width: 140, format: currency, config: { symbol: "¥" } }
              - { field: amount, label: 金額, type: number, width: 140, format: currency, config: { symbol: "¥" } }
            fields:
              - { field: item, label: 品名, type: text, required: true }
              - { field: qty, label: 数量, type: number, required: true, validators: [ { type: min, value: 1 } ] }
              - { field: price, label: 単価, type: number, required: true, validators: [ { type: min, value: 0 } ] }
              # 行内の計算項目: 金額 = 数量 × 単価
              - { field: amount, label: 金額, computed: { op: product, fields: [qty, price] } }

      - title: 合計
        fields:
          # 縦計（明細の行を畳む）。`field` が明細の項目、`of` が行の項目。
          # 集約の語彙はダッシュボードのカードと同じ（count / sum / avg / min / max）。
          - { field: subtotal, label: 小計, format: currency, config: { symbol: "¥" },
              computed: { op: sum, field: lines, of: amount } }
          - { field: lineCount, label: 明細行数,
              computed: { op: count, field: lines } }
          # 同じレコードの項目を畳むのは `fields`。計算は**書いた順に1回**なので、
          # 小計より後ろに置く（前の結果を使える）。
          - { field: total, label: 合計金額, format: currency, config: { symbol: "¥" },
              computed: { op: sum, fields: [subtotal] } }
  actions:
    - { id: save, type: plugin, plugin: saveOrder, label: 保存 }
