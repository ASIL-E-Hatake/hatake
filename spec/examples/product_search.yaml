# yaml-language-server: $schema=https://github.com/ASIL-E-Hatake/hatake/raw/main/spec/hatake-page.schema.json
# hatake — SearchPage definition example: 商品照会 (Product search, read-only)
dsl_version: "1.0"

page:
  type: search
  id: product_search
  title: 商品照会
  repository: productRepository
  key: id

  search:
    layout: { columns: 3 }
    filters:
      - { field: name,     label: 商品名,     type: text,   operator: contains }
      - field: category
        label: カテゴリ
        type: select
        operator: equals
        options:
          - { value: food,    label: 食品 }
          - { value: drink,   label: 飲料 }
          - { value: daily,   label: 日用品 }
      # 検索条件の連動: カテゴリを選ぶと、細目の選択肢がそのカテゴリのものだけになる。
      # 入力項目と同じ書き方（optionsFrom ＋ 各選択肢の when）。
      - field: subCategory
        label: 細目
        type: select
        operator: equals
        optionsFrom: category
        options:
          - { value: vegetable, label: 野菜,     when: food }
          - { value: meat,      label: 精肉,     when: food }
          - { value: juice,     label: ジュース, when: drink }
          - { value: detergent, label: 洗剤,     when: daily }

  table:
    pagination: { pageSize: 50 }
    rowActions: [detail]
    columns:
      - { field: code,     label: コード,   width: 120, sortable: true }
      - { field: name,     label: 商品名,   sortable: true }
      - { field: category, label: カテゴリ, type: badge }
      - { field: price,    label: 価格,     type: number, sortable: true, format: currency, config: { symbol: "¥" } }

  actions:
    - { id: detail, type: plugin, plugin: showDetail, label: 詳細 }
    - { id: export, type: plugin, plugin: csvExport,  label: CSV出力 }
