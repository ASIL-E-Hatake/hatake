name: hatake_print
description: >-
  Print output for hatake reports: ReportDocument to a neutral PrintLayout, and
  PrintLayout to PDF bytes. An opt-in adapter — pure Dart, no dependencies
  beyond hatake_core, so a nightly batch can print without a UI.
version: 0.0.1
repository: https://github.com/ASIL-E-Hatake/hatake
homepage: https://github.com/ASIL-E-Hatake/hatake
issue_tracker: https://github.com/ASIL-E-Hatake/hatake/issues
topics:
  - pdf
  - printing
  - report
  - declarative

environment:
  sdk: ^3.5.0

dependencies:
  hatake_core: ^0.0.1

dev_dependencies:
  hatake_yaml: ^0.0.1
  lints: ^4.0.0
  test: ^1.25.0

# During monorepo development, resolve siblings from the local path.
# Ignored when publishing (pub.dev uses the hosted version constraints above).
dependency_overrides:
  hatake_core:
    path: ../hatake_core
  hatake_yaml:
    path: ../hatake_yaml
