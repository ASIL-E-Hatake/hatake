# hatake デモ用の定義。spec/examples/sales_app.yaml をベースに、デモ限定の
# 「定義を見る」プラグインアクション（plugin: showDefinition）を各ページへ追加し、
# 受注照会（order_search）を複数条件検索のショーケースに拡張したもの。
dsl_version: "1.0"
app:
  id: sales_admin
  title: 販売管理
  home: dashboard
  # 見た目も定義から。畠なので緑。業務画面は密度が高い方が使いやすい。
  theme:
    primaryColor: "#1B5E20"
    density: compact
    radius: 8
  menu:
    - { id: dashboard, label: ダッシュボード, icon: insights, page: sales_dashboard }
    - { id: customers, label: 顧客, icon: people, page: customer_master }
    - group: マスタ
      items:
        - { label: 商品, icon: inventory, page: product_master }
    - { id: orders, label: 受注照会, icon: list, page: order_search }
    - { id: salesReport, label: 売上明細表, icon: receipt_long, page: sales_report }
    - { id: orderEntry, label: 受注入力, icon: edit_note, page: order_entry }
    - { id: orderEntryPaged, label: 受注入力（明細別テーブル）, icon: table_rows, page: order_entry_paged }
  pages:
    # ダッシュボード: カードごとに小さな読み取りクエリを投げ、結果の見せ方だけを
    # 定義する。集計は Repository が返した行に対する畳み込み（aggregate）。
    - type: dashboard
      id: sales_dashboard
      title: 売上ダッシュボード
      repository: orderRepository     # カードが repository を省いたときの既定
      layout: { columns: 4 }
      # 検索エリアは全カードに効く（期間で board 全体を絞る）。
      search:
        filters:
          - { field: orderDate, label: 受注日, type: date, operator: between }
      items:
        - { id: orderCount, title: 受注件数, action: openOrders }
        - id: totalAmount
          title: 受注金額
          value: { aggregate: sum, field: amount }
          format: currency
          config: { symbol: "¥" }
        - id: avgAmount
          title: 平均受注額
          value: { aggregate: avg, field: amount }
          format: currency
          config: { symbol: "¥" }
        - id: pending
          title: 未出荷
          filters: { status: 未出荷 }   # このカードだけの固定条件
          action: openOrders
        - id: byCustomer
          type: chart
          title: 顧客別の受注金額
          span: 2
          chart: { kind: bar, labelField: customer, valueField: amount, aggregate: sum }
          format: currency
          config: { symbol: "¥" }
        - id: byStatus
          type: chart
          title: 状態別の構成比
          span: 2
          chart: { kind: pie, labelField: status, valueField: amount, aggregate: sum }
          format: currency
          config: { symbol: "¥" }
        - id: recent
          type: table
          title: 直近の受注
          span: 4
          limit: 5
          sort: { field: orderDate, ascending: false }
          columns:
            - { field: orderNo, label: 受注番号, width: 140 }
            - { field: customer, label: 顧客名 }
            - { field: orderDate, label: 受注日, width: 120 }
            - { field: status, label: 状態, width: 100 }
            - { field: amount, label: 金額, type: number, format: currency, config: { symbol: "¥" } }
      actions:
        - { id: openOrders, type: navigate, label: 受注照会, page: order_search }
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: sales_dashboard } }

    - type: master
      id: customer_master
      title: 顧客マスタ
      repository: customerRepository
      key: id
      search:
        filters:
          - { field: name, label: 顧客名, type: text, operator: contains }
      table:
        rowActions: [edit, delete]
        columns:
          - { field: code, label: コード, sortable: true, width: 140 }
          - { field: name, label: 顧客名, width: 220 }
      form:
        sections:
          - title: 基本情報
            fields:
              - { field: code, label: コード, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: name, label: 顧客名, type: text, required: true }
      actions:
        - { id: create, type: create, label: 新規登録 }
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: customer_master } }
        # 定義を持ってプレイグラウンドへ（触って壊せる場）。
        - { id: playground, type: plugin, plugin: openPlayground, label: 触ってみる, config: { page: customer_master } }
        # 削除は宣言が無くても確認するが、業務の言葉で聞きたいので宣言する。
        - id: delete
          type: delete
          label: 削除
          confirm:
            title: 顧客の削除
            message: この顧客を削除すると、受注履歴から辿れなくなります。よろしいですか？
            okLabel: 削除する
            danger: true
          onSuccess:
            message: 顧客を削除しました

    - type: master
      id: product_master
      title: 商品マスタ
      repository: productRepository
      table:
        columns:
          - { field: code, label: コード, width: 140 }
          - { field: name, label: 商品名, width: 220 }
      form:
        sections:
          - fields:
              - { field: code, label: コード, required: true }
              - { field: name, label: 商品名, required: true }
      actions:
        - { id: create, type: create, label: 新規登録 }
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: product_master } }

    - type: search
      id: order_search
      title: 受注照会
      repository: orderRepository
      key: orderNo
      # 複数条件の検索。layout.columns で入力欄を2列に並べる。
      search:
        layout: { columns: 2 }
        filters:
          - { field: customer, label: 顧客名, type: text, operator: contains }
          - field: status
            label: 状態
            type: select
            operator: equals
            options:
              - { value: 未出荷, label: 未出荷 }
              - { value: 出荷済, label: 出荷済 }
          - { field: shipped, label: 出荷済, type: checkbox, operator: equals }
          # between は開始／終了の2入力になり、[開始, 終了] で渡る。
          - { field: orderDate, label: 受注日, type: date, operator: between }
      table:
        rowActions: [detail, openEntry, openEntryPaged]
        columns:
          - { field: orderNo, label: 受注番号, sortable: true, width: 160 }
          - { field: customer, label: 顧客, width: 200 }
          - { field: orderDate, label: 受注日, width: 140 }
          - { field: status, label: 状態, type: badge, width: 120 }
          - { field: amount, label: 金額, type: number, format: currency, config: { symbol: "¥" }, width: 140 }
      actions:
        # 行から詳細へ遷移。$row.no を詳細ページの key に渡す。
        - { id: detail, type: navigate, label: 詳細, page: order_detail, params: { id: "$row.orderNo" } }
        # 行から親子（ヘッダ＋明細）編集へ。出荷済の受注は明細を直せないので、
        # その行では**押せない**（ボタンは出たまま灰色になり、何で決まるかが出る）。
        # 判定するのは行アクションなので「その行のレコード」。
        - id: openEntry
          type: navigate
          label: 明細編集
          page: order_entry
          params: { id: "$row.orderNo" }
          enabledWhen: { field: status, operator: notEquals, value: 出荷済 }
        # 明細を別テーブルに持つ版へ。子行は親キーが要るので、行から開くのが本来の入口。
        - { id: openEntryPaged, type: navigate, label: 明細（別テーブル）, page: order_entry_paged, params: { id: "$row.orderNo" } }
        # 一覧の CSV。表示中のページではなく検索結果全体を出す。
        - { id: csv, type: export, label: CSV出力, config: { filename: 受注一覧, bom: true } }
        # 選んだ行に対して実行する。scope: selection を書くと表にチェックボックスが
        # 出て、ボタンは選ぶまで押せない。一括の中身は業務なので type: plugin＝
        # 選んだ行（records）を受け取るのはアプリ側。
        # 一括は1回の操作が件数ぶん動くので confirm を出す。結果はハンドラが
        # 報告し（出荷済は承認できない）、文言は定義側で言う。{count} / {failed} は
        # scope: selection のときだけ埋まる。{failedKeys} は**アプリ側が行を名指しで
        # 報告したときだけ**埋まる（件数だけの報告なら文字のまま出る）。
        - id: approveSelected
          type: plugin
          plugin: approveOrders
          label: 一括承認
          scope: selection
          # 1回で動かせる上限は業務の決めごと。超えて選んでいる間は押せない
          # （切り詰めて実行はしない＝一部だけ動いたことに気づけないのを避ける）。
          # 上限は役割で変わる（担当は20件・管理者は1ページ全部）。当てはまる役割が
          # 複数あれば一番ゆるい方が効く＝roles と同じ考え方。1ページの件数（既定50）
          # より大きい上限は一度も効かないので、validate が言う。
          maxRows:
            default: 20
            byRole: { manager: 50 }
          # 確認の文の {count} は**押す前に**埋まる（選んだ行の数）。ボタンにも件数は
          # 出るが、最後に読むのはこの文なので、数はここにも出す。
          # 何件ずつハンドラに渡すか。書くと**枠組みが回す側**になるので、進み具合が
          # 出て、区切りで止められる（1回で全部渡してしまうと、途中の状態は枠組みには
          # 分からない＝進み具合も中断も出せない）。止めたぶんは {skipped} に入る。
          batchSize: 2
          confirm: { message: '{count} 件の受注を承認します' }
          onSuccess: { message: '{count} 件を承認しました' }
          onError:
            message: '{count} 件を承認しました（{failed} 件は出荷済みなので承認できません: {failedKeys}／{skipped} 件は実行していません）'
        # 実行の前に聞く。聞いた値はハンドラが ActionContext.input で受け取る。
        # prompt の OK が確認そのもの（ダイアログを2枚出さない）。
        - id: rejectSelected
          type: plugin
          plugin: rejectOrders
          label: 却下
          scope: selection
          # 戻せない操作なので、承認より小さい上限にしてある。
          maxRows: 5
          confirm: { message: '{count} 件を却下します。元に戻せません。', danger: true }
          prompt:
            title: 却下の理由
            okLabel: 却下する
            fields:
              - { field: reason, label: 理由, type: textarea, required: true }
              - { field: rejectedOn, label: 却下日, type: date }
          onSuccess: { message: '{count} 件を却下しました' }
          onError: { message: '{count} 件を却下しました（{failed} 件は承認済みなので却下できません）' }
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: order_search } }

    # 帳票: 一覧の印刷版。明細の列は table から取り、report が「紙の構造」を足す。
    # グループはコントロールブレイクなので、sort で並べた順に依存する。
    - type: report
      id: sales_report
      title: 売上明細表
      repository: orderRepository
      search:
        layout: { columns: 2 }
        filters:
          - { field: orderDate, label: 受注日, type: date, operator: between }
          - field: status
            label: 状態
            type: select
            operator: equals
            options:
              - { value: 未出荷, label: 未出荷 }
              - { value: 出荷済, label: 出荷済 }
      table:
        columns:
          - { field: orderNo, label: 受注番号, width: 140 }
          - { field: orderDate, label: 受注日, width: 120 }
          - { field: status, label: 状態, width: 100 }
          - { field: amount, label: 金額, type: number, format: currency, config: { symbol: "¥" } }
      report:
        paper: { size: A4, orientation: portrait }
        rowsPerPage: 12
        sort: { field: customer }
        groupBy:
          - { field: customer, label: 顧客 }
        totals:
          - { field: amount, aggregate: sum }
          - { field: amount, aggregate: count }
      actions:
        - { id: csv, type: export, label: CSV出力, config: { filename: 売上明細, bom: true } }
        # 受け側が Shift_JIS 固定の連携向け。変換するのは出力先（hatake_encoding）で、
        # 定義は「どの文字コードで欲しいか」を言うだけ。BOM は UTF-8 のものなので付かない。
        - id: csvSjis
          type: export
          label: CSV出力（Shift_JIS）
          config: { filename: 売上明細_sjis, charset: cp932 }
        # 紙に刷る。Framework が渡すのは「紙の中身」まで（帳票の定義と行）で、PDF の
        # バイト列を作るのは opt-in の hatake_print、それをプリンタやファイルに送るのは
        # アプリの担当。config は読まずにそのまま渡るので、字の指定はアダプタが読む。
        - { id: printPdf, type: print, label: 印刷, config: { filename: 売上明細, font: mincho } }
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: sales_report } }

    - type: detail
      id: order_detail
      title: 受注詳細
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号 }
              - { field: customer, label: 顧客 }
              - { field: orderDate, label: 受注日 }
              - { field: status, label: 状態 }
              - { field: amount, label: 金額, format: currency, config: { symbol: "¥" } }
      actions:
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: order_detail } }

    # 親子・明細（master-detail）: ヘッダ＋明細行を1画面で入力し、まとめて保存する。
    - type: form
      id: order_entry
      title: 受注入力
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: customer, label: 顧客, type: text, required: true }
              - { field: orderDate, label: 受注日, type: date, required: true }
              - field: status
                label: 状態
                type: select
                required: true
                options:
                  - { value: 未出荷, label: 未出荷 }
                  - { value: 出荷済, label: 出荷済 }
          # セクション見出しは付けない: subTable 自身の label が見出しになるため。
          - fields:
              # この項目の値が子行の配列になる（type: subTable）。
              - field: lines
                label: 明細
                type: subTable
                columns:
                  - { field: item, label: 品名, width: 220 }
                  - { field: qty, label: 数量, type: number, width: 90 }
                  - { field: price, label: 単価, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                  - { field: amount, label: 金額, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                  # 取消印は列にも出す。出さないと、合計から外れた行を画面で見分けられない。
                  - { field: cancelled, label: 取消, type: checkbox, width: 80 }
                fields:
                  - { field: item, label: 品名, type: text, required: true }
                  - { field: qty, label: 数量, type: number, required: true, validators: [ { type: min, value: 1 } ] }
                  - { field: price, label: 単価, type: number, required: true, validators: [ { type: min, value: 0 } ] }
                  # 行内の計算項目: 金額 = 数量 × 単価
                  - { field: amount, label: 金額, computed: { op: product, fields: [qty, price] } }
                  # 取消した行は残す（消すと何を取消したか分からない）。合計からは外す。
                  - { field: cancelled, label: 取消, type: checkbox }
          - title: 金額
            fields:
              # 縦計。`field` が明細の項目、`of` が行の項目（集約の語彙はダッシュ
              # ボードのカードと同じ）。行を1行足す・数量を直すと、その場で変わる。
              # `where` で**畳む前に行を絞る**（取消した行は合計に入れない）。
              # 条件の書き方は visibleWhen と同じもの＝条件の言葉を2つ持たない。
              - { field: subtotal, label: 小計, format: currency, config: { symbol: "¥" },
                  computed: { op: sum, field: lines, of: amount,
                              where: { field: cancelled, operator: notEquals, value: true } } }
              - { field: lineCount, label: 明細行数,
                  computed: { op: count, field: lines,
                              where: { field: cancelled, operator: notEquals, value: true } } }
              # 並べて1行にするのは join（数ではなく文字が出る）。伝票の「品名」欄。
              - { field: itemNames, label: 品名, type: textarea, readOnly: true,
                  computed: { op: join, field: lines, of: item, separator: "、",
                              where: { field: cancelled, operator: notEquals, value: true } } }
      actions:
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: order_entry } }

    # 明細が大量にあるとき: 子行を別 Repository から外部キーで引き、ページングする
    # （subTable の source）。行は1件ずつ即時保存されるため、ヘッダの保存が先。
    - type: form
      id: order_entry_paged
      title: 受注入力（明細別テーブル）
      repository: orderRepository
      key: orderNo
      form:
        sections:
          - title: 受注情報
            fields:
              - { field: orderNo, label: 受注番号, type: text, required: true, normalize: [toHankaku, trim] }
              - { field: customer, label: 顧客, type: text, required: true }
              - { field: orderDate, label: 受注日, type: date, required: true }
              - field: status
                label: 状態
                type: select
                required: true
                options:
                  - { value: 未出荷, label: 未出荷 }
                  - { value: 出荷済, label: 出荷済 }
          # セクション見出しは付けない: subTable 自身の label が見出しになるため。
          - fields:
              # 値は親レコードに入らない。行は orderLineRepository が持つ。
              - field: lines
                label: 明細
                type: subTable
                source:
                  repository: orderLineRepository
                  parentKey: orderNo   # 子行が持つ親キーの項目名
                  key: lineNo          # 子行の主キー項目名
                  pageSize: 10
                columns:
                  - { field: item, label: 品名, width: 220 }
                  - { field: qty, label: 数量, type: number, width: 90 }
                  - { field: price, label: 単価, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                  - { field: amount, label: 金額, type: number, width: 130, format: currency, config: { symbol: "¥" } }
                fields:
                  - { field: item, label: 品名, type: text, required: true }
                  - { field: qty, label: 数量, type: number, required: true, validators: [ { type: min, value: 1 } ] }
                  - { field: price, label: 単価, type: number, required: true, validators: [ { type: min, value: 0 } ] }
                  # 行内の計算項目: 金額 = 数量 × 単価
                  - { field: amount, label: 金額, computed: { op: product, fields: [qty, price] } }
      actions:
        - { id: showDef, type: plugin, plugin: showDefinition, label: 定義を見る, config: { page: order_entry_paged } }
