name: hatake_example
description: >-
  Example app demonstrating hatake — a YAML-defined CrudPage rendered with
  Material 3, backed by an in-memory repository.
version: 0.9.13
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  hatake_material: ^0.9.13
  hatake_yaml: ^0.9.13
  # 文字コード変換は opt-in アダプタ。Shift_JIS で出す画面があるので入れている。
  hatake_encoding: ^0.9.13
  # 印刷も opt-in アダプタ。帳票に印刷ボタン（type: print）があるので入れている。
  # 刷らないアプリは入れなくてよい＝PDF を書くコードは1行も入らない。
  hatake_print: ^0.9.13
  # REST の Repository も opt-in アダプタ。デモ本体はインメモリだが、
  # `hatake wire --base` が出す配線（tool/wired_everything.dart）がこれを使う
  # ＝生成物が flutter analyze に通ることで、生成器の嘘を防いでいる。
  hatake_http: ^0.9.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 画面の試験の道具。`hatake run --widget-draft` が起こした下書き
  # （test/drafted_customer_master_test.dart）がこれを使う＝**生成した試験が
  # 本当に通ること**で、下書きの嘘を防いでいる（配線の下書きと同じ考え）。
  hatake_test: ^0.9.13

dependency_overrides:
  hatake_core:
    path: ../hatake_core
  hatake:
    path: ../hatake
  hatake_material:
    path: ../hatake_material
  hatake_yaml:
    path: ../hatake_yaml
  hatake_encoding:
    path: ../hatake_encoding
  hatake_print:
    path: ../hatake_print
  hatake_http:
    path: ../hatake_http
  hatake_test:
    path: ../hatake_test

flutter:
  # Required to bundle the MaterialIcons font. Without it FontManifest.json is
  # empty and every Icon renders as a tofu box on web.
  uses-material-design: true
  assets:
    - assets/customer_master.yaml
    - assets/sales_app.yaml
