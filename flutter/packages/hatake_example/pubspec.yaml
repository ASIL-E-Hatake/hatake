name: hatake_example
description: >-
  Example app demonstrating hatake — a YAML-defined CrudPage rendered with
  Material 3, backed by an in-memory repository.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  hatake_material: ^0.0.1
  hatake_yaml: ^0.0.1
  # 文字コード変換は opt-in アダプタ。Shift_JIS で出す画面があるので入れている。
  hatake_encoding: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  hatake_core:
    path: ../hatake_core
  hatake:
    path: ../hatake
  hatake_material:
    path: ../hatake_material
  hatake_yaml:
    path: ../hatake_yaml
  hatake_encoding:
    path: ../hatake_encoding

flutter:
  # Required to bundle the MaterialIcons font. Without it FontManifest.json is
  # empty and every Icon renders as a tofu box on web.
  uses-material-design: true
  assets:
    - assets/customer_master.yaml
    - assets/sales_app.yaml
