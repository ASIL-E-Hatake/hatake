name: hatake_core
description: >-
  Core definitions for hatake — a business-definition framework: screens,
  validation, permissions and API shapes from one definition. Pure Dart, no
  Flutter dependency.
version: 0.9.26
# TODO: replace the placeholder org with the real GitHub repository before publishing.
repository: https://github.com/ASIL-E-Hatake/hatake
homepage: https://github.com/ASIL-E-Hatake/hatake
issue_tracker: https://github.com/ASIL-E-Hatake/hatake/issues
topics:
  - ui
  - declarative
  - definition
  - crud

environment:
  sdk: ^3.5.0

dependencies:
  equatable: ^2.0.5

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
  # 公開面の台帳（test/public_api_test.dart）が使う。**字を読むだけ**の
  # 構文解析で、part を自分で追う必要があるので当てずっぽうでは数えられない。
  analyzer: '>=6.0.0 <9.0.0'
  path: ^1.9.0
